<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#17202a;
  --muted:#6b7280;
  --line:#e5e7eb;
  --green:#18864b;
  --green2:#0f6b3a;
  --red:#dc3545;
  --orange:#f59e0b;
  --blue:#2563eb;
  --shadow:0 3px 15px rgba(0,0,0,.07);
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}
.auth-box{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:var(--shadow)
}
.auth-box h1{margin-top:0;text-align:center;color:var(--green)}
.auth-box input{width:100%;margin-bottom:12px}

.app{min-height:100vh;display:flex}

.sidebar{
  width:240px;
  background:#10251b;
  color:#fff;
  padding:18px 12px;
  position:fixed;
  left:0;top:0;bottom:0;
  overflow:auto;
  z-index:50
}
.logo{
  font-size:25px;
  font-weight:800;
  padding:12px;
  margin-bottom:18px;
}
.logo span{color:#58d68d}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#dbe8df;
  padding:13px 14px;
  text-align:left;
  border-radius:10px;
  margin:3px 0;
}
.nav-btn:hover,.nav-btn.active{
  background:#1c4931;
  color:#fff
}
.logout{margin-top:25px;background:#7d2630!important}

.main{
  margin-left:240px;
  width:calc(100% - 240px);
  padding:24px;
  max-width:1800px
}

.mobile-header{
  display:none;
  background:#10251b;
  color:#fff;
  padding:13px 15px;
  position:sticky;
  top:0;
  z-index:40
}
.mobile-header button{
  background:transparent;
  border:0;color:#fff;font-size:24px
}

.page-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px
}
.page-head h1{margin:0}
.page-head p{margin:5px 0;color:var(--muted)}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  background:#e9edf0;
  color:#17202a;
}
.btn:hover{filter:brightness(.96)}
.btn-primary{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-warning{background:var(--orange);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-small{padding:7px 10px;font-size:13px}

.cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  margin-bottom:20px
}
.card{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow);
  border:1px solid var(--line)
}
.stat-label{color:var(--muted);font-size:13px}
.stat-value{font-size:28px;font-weight:800;margin-top:7px}
.stat-sub{font-size:12px;color:var(--muted);margin-top:5px}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px
}

.section{
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
  padding:18px;
  margin-bottom:18px
}
.section h2,.section h3{margin-top:0}

.table-wrap{overflow:auto}
table{
  width:100%;
  border-collapse:collapse;
  min-width:700px
}
th,td{
  border-bottom:1px solid var(--line);
  padding:10px 8px;
  text-align:left;
  vertical-align:middle
}
th{
  font-size:12px;
  color:var(--muted);
  background:#f8faf9;
  position:sticky;
  top:0;
  z-index:2
}
td{font-size:14px}

.badge{

  padding:4px 8px;

  font-size:12px;
  background:#e8f5ed;

}
.badge-red{background:#fdebed;color:#a51f2d}
.badge-orange{background:#fff4db;color:#a16207}
.badge-blue{background:#e8efff;color:#1d4ed8}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px
}

input,select,textarea{
  width:100%;
  border:1px solid #d6dbe0;
  border-radius:8px;
  padding:10px;
  background:#fff;
  color:#17202a
}
textarea{min-height:80px;resize:vertical}
label{
  display:block;
  font-size:13px;
  color:#4b5563;
  margin-bottom:5px
}
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}
.form-grid-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px
}
.full{grid-column:1/-1}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100
}
.modal-box{
  width:100%;
  max-width:850px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  padding:22px
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}
.modal-head h2{margin:0}
.close{
  border:0;background:#eee;
  border-radius:8px;
  width:35px;height:35px
}
.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:8px;
  margin-bottom:15px
}
.tab{
  border:0;
  background:#edf1ee;
  padding:9px 13px;
  border-radius:9px;
  white-space:nowrap
}
.tab.active{
  background:var(--green);
  color:#fff
}

.phase{
  border-left:4px solid var(--green);
  padding:12px;
  margin:8px 0;
  background:#f7faf8;
  border-radius:7px
}
.phase strong{display:block}
.recommend{
  background:#eef8f2;
  border:1px solid #cbe8d6;
  border-radius:10px;
  padding:13px;
  margin-top:10px
}
.warning{
  background:#fff6df;
  border:1px solid #f1d28b;
  border-radius:10px;
  padding:12px
}
.danger-box{
  background:#fff0f1;
  border:1px solid #f1b8bd;
  border-radius:10px;
  padding:12px
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted)
}

.report-print{display:none}

@media print{
  .sidebar,.mobile-header,.no-print,.page-head .btn,.actions{display:none!important}
  .main{margin:0;width:100%;padding:0}
  .report-print{display:block}
  .section{box-shadow:none;border:1px solid #ccc}
  body{background:#fff}
}

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
    width:270px
  }
  .sidebar.open{transform:translateX(0)}
  .main{
    margin-left:0;
    width:100%;
    padding:15px

    align-items:center;
    gap:10px

  .grid2,.grid3{grid-template-columns:1fr}

@media(max-width:600px){

  .card{padding:12px}
  .stat-value{font-size:22px}
  .section{padding:13px;border-radius:11px}
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .page-head{
    align-items:flex-start;
    flex-direction:column

  .modal{padding:5px}
  .modal-box{padding:15px;border-radius:12px;max-height:96vh}
  table{min-width:760px}
  .btn{padding:9px 11px}
}
</style>
</head>

<script>
const SUPABASE_URL = "https://axxormlcevusdjfqruib.supabase.co";
const SUPABASE_KEY = "sb_publishable_fmFGe67Hi8_nUZC8sKP5xg_piWbDfZi";

const sb = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null;
let currentPage="dashboard";

let currentFlock=null;

const TODAY=()=>new Date().toISOString().slice(0,10);

const BROILER_PHASES=[
  {from:1,to:15,name:"Стартер"},
  {from:16,to:20,name:"Гровер"},
  {from:21,to:28,name:"Гровер"},
  {from:29,to:35,name:"Гровер"},
  {from:36,to:42,name:"Фінішер"},
  {from:43,to:50,name:"Фінішер"}

function money(v){
  return Number(v||0).toLocaleString("uk-UA",{minimumFractionDigits:2,maximumFractionDigits:2})+" грн";
}
function num(v){
  return Number(v||0).toLocaleString("uk-UA",{maximumFractionDigits:2});
}
function dateUA(v){
  if(!v)return "—";
  return new Date(v+"T00:00:00").toLocaleDateString("uk-UA");
}
function ageDays(date){
  if(!date)return 0;
  const a=new Date(date+"T00:00:00");
  const b=new Date();
  b.setHours(0,0,0,0);
  return Math.max(0,Math.floor((b-a)/86400000)+1);
}
function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
function val(id){
  return document.getElementById(id)?.value ?? "";
}
function setMsg(t,color="#dc3545"){
  const x=document.getElementById("authMsg");
  if(x){x.textContent=t;x.style.color=color}

async function login(){

/* =========================
   DATABASE HELPERS
========================= */

async function q(table,extra={}){
  let query=sb.from(table).select("*").eq("user_id",user.id);
  if(extra.order)query=query.order(extra.order,{ascending:extra.asc??false});
  if(extra.eq)for(const [k,v] of Object.entries(extra.eq))query=query.eq(k,v);
  const r=await query;
  if(r.error)throw r.error;
  return r.data||[];
}

async function insert(table,data){
  const r=await sb.from(table).insert({...data,user_id:user.id}).select().single();
  if(r.error)throw r.error;
  return r.data;
}

async function update(table,id,data){
  const r=await sb.from(table).update(data).eq("id",id).eq("user_id",user.id);
  if(r.error)throw r.error;
}

async function remove(table,id){
  if(!confirm("Видалити цей запис?"))return;
  const r=await sb.from(table).delete().eq("id",id).eq("user_id",user.id);
  if(r.error)alert(r.error.message);
}

/* =========================
   BROILER CALCULATIONS
========================= */

function phaseForDay(day){
  return BROILER_PHASES.find(x=>day>=x.from&&day<=x.to)
      || (day>50?BROILER_PHASES[5]:BROILER_PHASES[0]);
}

function feedRecommendationBroiler(day,heads){
  const rates=[
    [1,7,0.018],
    [8,14,0.030],
    [15,20,0.055],
    [21,28,0.080],
    [29,35,0.110],
    [36,42,0.135],
    [43,50,0.155]
  ];
  const x=rates.find(r=>day>=r[0]&&day<=r[1])||rates[rates.length-1];
  return Number(heads||0)*x[2];
}

function waterRecommendationBroiler(day,heads){
  const feed=feedRecommendationBroiler(day,heads);
  return feed*1.8;
}

function layerFeedRecommendation(age,heads){
  let g=115;
  if(age<18)g=100;
  else if(age<30)g=105;
  else if(age<60)g=110;
  else if(age<100)g=112;
  else g=115;
  return heads*g/1000;
}

function calcHeads(batch,daily,sales,home){
  let heads=Number(batch.initial_heads||0);
  for(const x of daily)heads-=Number(x.mortality||0);
  for(const x of sales)heads-=Number(x.heads||0);
  for(const x of home)heads-=Number(x.heads||0);
  return Math.max(0,heads);
}

function dailyFeedKg(row){
  const phases=[
    "feed_starter_kg",
    "feed_g1520_kg",
    "feed_g2128_kg",
    "feed_g2935_kg",
    "feed_f3642_kg",
    "feed_f4350_kg"
  ];
  const sum=phases.reduce((a,k)=>a+Number(row[k]||0),0);
  if(sum>0)return sum;
  return Number(row.feed_kg||0);
}

async function broilerStats(batch){
  const [daily,weights,sales,home,treatments]=await Promise.all([
    q("broiler_daily",{eq:{batch_id:batch.id}}),
    q("broiler_weights",{eq:{batch_id:batch.id},order:"record_date"}),
    q("broiler_sales",{eq:{batch_id:batch.id}}),
    q("broiler_home_slaughter",{eq:{batch_id:batch.id}}),
    q("broiler_treatments",{eq:{batch_id:batch.id}})
  ]);

  const heads=calcHeads(batch,daily,sales,home);
  const feed=daily.reduce((a,x)=>a+dailyFeedKg(x),0);
  const mortality=daily.reduce((a,x)=>a+Number(x.mortality||0),0);

  const latest=weights.length?weights[weights.length-1]:null;
  const first=weights.length?weights[0]:null;

  let fcr=null;
  if(latest && first && latest!==first){
    const gainPerHead=(Number(latest.average_weight_g)-Number(first.average_weight_g))/1000;
    const totalGain=gainPerHead*heads;
    if(totalGain>0)fcr=feed/totalGain;
  }else if(latest){
    const initialWeight=0.0494;
    const totalGain=(Number(latest.average_weight_g)/1000-initialWeight)*heads;
    if(totalGain>0)fcr=feed/totalGain;
  }

  const treatmentCost=treatments.reduce(
    (a,x)=>a+(Number(x.ml_used||0)/10)*Number(x.price_per_10ml||0),0
  );

  const revenue=sales.reduce((a,x)=>a+Number(x.revenue||0),0);

  return {
    daily,weights,sales,home,treatments,
    heads,feed,mortality,latest,fcr,treatmentCost,revenue
  };
}

async function nextBatchNumber(){
  const rows=await q("broiler_batches");
  return rows.length+1;
}

async function saveBroiler(id){
  const data={
    name:val("b_name").trim(),
    breed:val("b_breed").trim(),
    placement_date:val("b_date"),
    initial_heads:Number(val("b_heads")||0),
    chick_price:Number(val("b_price")||0),
    target_weight:Number(val("b_target")||4.8),
    notes:val("b_notes")
  };

  if(!data.name||!data.placement_date)return alert("Заповни назву та дату.");

  try{
    if(id)await update("broiler_batches",id,data);
    else await insert("broiler_batches",{...data,status:"active"});
    closeModal();
    renderPage();
  }catch(e){alert(e.message)}
}

async function archiveBroiler(id){
  if(!confirm("Перемістити партію в архів?"))return;
  try{
    await update("broiler_batches",id,{
      status:"archived",
      archived_at:new Date().toISOString()
    });
    renderPage();
  }catch(e){alert(e.message)}
}
async function restoreBroiler(id){
  try{
    await update("broiler_batches",id,{status:"active",archived_at:null});
    renderPage();
  }catch(e){alert(e.message)}
}
async function deleteBroiler(id){
  if(!confirm("Видалити партію та її дані?"))return;
  try{
    const tables=[
      "broiler_daily",
      "broiler_weights",
      "broiler_treatments",
      "broiler_sales",
      "broiler_home_slaughter"
    ];
    for(const t of tables){
      await sb.from(t).delete().eq("batch_id",id).eq("user_id",user.id);
    }
    await sb.from("broiler_batches").delete().eq("id",id).eq("user_id",user.id);
    renderPage();
  }catch(e){alert(e.message)}
}

  document.getElementById("broilerTabContent").innerHTML=`
    <div class="section">
      <div class="page-head">
        <div><h2>📄 Звіт по партії</h2><p>Готовий до друку</p></div>

        <div class="card"><div class="stat-label">Корм</div><div class="stat-value">${money(feedCost)}</div></div>
        <div class="card"><div class="stat-label">Ліки</div><div class="stat-value">${money(s.treatmentCost)}</div></div>
        <div class="card"><div class="stat-label">Інші витрати</div><div class="stat-value">${money(financeCost)}</div></div>
        <div class="card"><div class="stat-label">Собівартість</div><div class="stat-value">${money(totalCost)}</div></div>
        <div class="card"><div class="stat-label">Прибуток</div><div class="stat-value">${money(profit)}</div></div>
      </div>

      <div class="section">
        <h3>Поголів'я</h3>
        <p>Початково: <strong>${num(b.initial_heads)}</strong></p>
        <p>Падіж: <strong>${num(s.mortality)}</strong></p>
        <p>Продано: <strong>${num(s.sales.reduce((a,x)=>a+Number(x.heads||0),0))}</strong></p>
        <p>Забито додому: <strong>${num(s.home.reduce((a,x)=>a+Number(x.heads||0),0))}</strong></p>

      </div>

      <div class="section">
        <h3>Продажі</h3>
        <p>Виручка: <strong>${money(s.revenue)}</strong></p>
      </div>
    </div>
  `;
}

async function awaitFeedCostForBatch(batchId){
  const rows=await q("feed_records",{eq:{batch_id:batchId}});
  return rows.reduce((a,x)=>a+Number(x.quantity_kg||0)*Number(x.price_per_kg||0),0);
}
async function awaitBatchFinanceCost(batchId){
  const rows=await q("finances",{eq:{batch_id:batchId}});
  return rows.filter(x=>x.operation_type==="cost")
    .reduce((a,x)=>a+Number(x.amount||0),0);
}

      <strong>🌾 Рекомендований корм для курей</strong><br>
      Орієнтовна норма: <strong>${num(rec)} кг/добу</strong> на ${num(heads)} курей.
      <br><small>Рецепт корму не фіксований. Ти сам створюєш його з актуальних інгредієнтів.</small>

async function flockTab(name,button){

  if(name==="daily")renderFlockDaily(daily);
  if(name==="sales")renderEggSales();

function renderRecipes(recipes){
  if(!recipes.length)return `<div class="empty">Рецептів немає.</div>`;
  const grouped={};
  recipes.forEach(x=>{
    if(!grouped[x.phase])grouped[x.phase]=[];
    grouped[x.phase].push(x);
  });
  return Object.entries(grouped).map(([phase,items])=>{
    const total=items.reduce((a,x)=>a+Number(x.kg||0),0);
    const cost=items.reduce((a,x)=>a+Number(x.kg||0)*Number(x.price_per_kg||0),0);
    return `
      <div class="section" style="background:#fafcfb">
        <h3>${esc(phase)}</h3>
        <p>Всього: <strong>${num(total)} кг</strong> • Собівартість: <strong>${money(cost)}</strong> • ${total?num(cost/total):0} грн/кг</p>
        <div class="table-wrap"><table>
        <thead><tr><th>Інгредієнт</th><th>Кг</th><th>Ціна</th><th>Сума</th><th>Дії</th></tr></thead>
        <tbody>${items.map(x=>`
          <tr>
            <td>${esc(x.ingredient_name)}</td>
            <td>${num(x.kg)}</td>
            <td>${money(x.price_per_kg)}</td>
            <td>${money(Number(x.kg)*Number(x.price_per_kg))}</td>
            <td>
              <button class="btn btn-small" onclick="openRecipeModal('${x.id}')">✏️</button>
              <button class="btn btn-small btn-danger" onclick="deleteRecipe('${x.id}')">🗑</button>
            </td>
          </tr>
        `).join("")}</tbody>
        </table></div>
      </div>`;
  }).join("");
}

   FINANCE
========================= */

async function financePage(){
  const c=document.getElementById("content");
  try{
    const rows=await q("finances",{order:"operation_date"});
    const costs=rows.filter(x=>x.operation_type==="cost")
      .reduce((a,x)=>a+Number(x.amount||0),0);
    const income=rows.filter(x=>x.operation_type==="income")
      .reduce((a,x)=>a+Number(x.amount||0),0);

    c.innerHTML=`
      <div class="page-head">
        <div><h1>💰 Витрати та доходи</h1><p>Усі витрати можна прив'язати до конкретної партії.</p></div>
        <button class="btn btn-primary" onclick="openFinanceModal()">＋ Операція</button>
      </div>

      <div class="cards">
        <div class="card"><div class="stat-label">Витрати</div><div class="stat-value">${money(costs)}</div></div>
        <div class="card"><div class="stat-label">Доходи</div><div class="stat-value">${money(income)}</div></div>
        <div class="card"><div class="stat-label">Результат</div><div class="stat-value">${money(income-costs)}</div></div>
      </div>

      <div class="section">
        <div class="table-wrap"><table>
        <thead><tr><th>Дата</th><th>Тип</th><th>Категорія</th><th>Сума</th><th>Опис</th><th>Партія</th><th>Дії</th></tr></thead>
        <tbody>
        ${rows.map(x=>`
          <tr>
            <td>${dateUA(x.operation_date)}</td>
            <td><span class="badge ${x.operation_type==="income"?"badge-blue":"badge-orange"}">${x.operation_type==="income"?"Дохід":"Витрата"}</span></td>
            <td>${esc(x.category)}</td>
            <td><strong>${money(x.amount)}</strong></td>
            <td>${esc(x.description||"")}</td>
            <td>${x.batch_id?"Партія":"Загальна"}</td>
            <td>
              <button class="btn btn-small" onclick="openFinanceModal('${x.id}')">✏️</button>
              <button class="btn btn-small btn-danger" onclick="deleteFinance('${x.id}')">🗑</button>
            </td>
          </tr>
        `).join("")||`<tr><td colspan="7" class="empty">Операцій немає</td></tr>`}
        </tbody>
        </table></div>
      </div>
    `;
  }catch(e){c.innerHTML=`<div class="danger-box">${esc(e.message)}</div>`}
}

async function openFinanceModal(id=null){

    const r=await sb.from("finances").select("*").eq("id",id).eq("user_id",user.id).single();
    if(r.error)return alert(r.error.message);
    x=r.data;
  }
  const batches=await q("broiler_batches",{order:"name",asc:true});

  openModal(x?"Редагування операції":"Нова операція",`
    <div class="form-grid">
      <div>
        <label>Тип</label>

          <option value="cost" ${x?.operation_type!=="income"?"selected":""}>Витрата</option>

        <label>Партія</label>
        <select id="fi_batch">
          <option value="">Загальна</option>
          ${batches.map(b=>`<option value="${b.id}" ${x?.batch_id===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}
        </select>

      <button class="btn" onclick="closeModal()">Скасувати</button>

async function saveFinance(id){

  };
  try{
    if(id)await update("finances",id,data);
    else await insert("finances",data);
    closeModal();financePage();
  }catch(e){alert(e.message)}

async function deleteFinance(id){
  await remove("finances",id);financePage();
}

/* =========================
   MODAL
========================= */

function openModal(title,body){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){
  document.getElementById("modal").classList.add("hidden");
  document.getElementById("modalBody").innerHTML="";
}
document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal")closeModal();
});

   START
========================= */

(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session)user=data.session.user;
  if(user)startApp();
})();
