function batchView(id){let b=C.batches.find(x=>x.id===id);if(!b)return;let isB=b.kind==='broiler';let ev=C.events.filter(x=>x.batch_id===id),ws=isB?weights(id):[],ds=C.daily.filter(x=>x.batch_id===id),es=C.eggs.filter(x=>x.batch_id===id),sales=C.eggSales.filter(x=>x.batch_id===id);modal(`<div class="row"><div><h2>${esc(b.name)}</h2><div class="muted">${isB?'Бройлери':'Несучки'} · ${esc(b.breed||'')} · ${age(b)} день</div></div><button class="secondary right" onclick="close()">✕</button></div><div class="grid g4"><div class="card">Поголів'я<div class="stat">${heads(b)}</div></div>${isB?`<div class="card">Середня вага<div class="stat">${lastWeight(id)?num(lastWeight(id).average_weight_g).toFixed(0):'—'} г</div></div><div class="card">Корм<div class="stat">${feed(id).toFixed(1)} кг</div></div><div class="card">FCR<div class="stat">${fcr(id)?fcr(id).toFixed(3):'—'}</div></div>`:`<div class="card">Яйця<div class="stat">${es.reduce((s,x)=>s+num(x.good_eggs),0)}</div></div><div class="card">Продано<div class="stat">${sales.reduce((s,x)=>s+num(x.quantity),0)}</div></div><div class="card">Дохід<div class="stat">${money(sales.reduce((s,x)=>s+num(x.total_amount),0))}</div></div>`}</div><div class="tabs section"><button onclick="batchEditEvent('${id}')">＋ Поголів'я</button>${isB?`<button onclick="weightForm('${id}')">⚖️ Зважування</button>`:''}<button onclick="dailyForm('${id}')">🌾 ${isB?'Корм':'Корм/яйця'}</button>${!isB?`<button onclick="eggSaleForm('${id}')">🥚 Продаж яєць</button>`:''}<button onclick="treatmentForm('${id}')">💊 Лікування</button></div><div class="card"><h3>Операції з поголів'ям</h3><table class="table"><thead><tr><th>Дата</th><th>Операція</th><th>Голів</th><th>Маса</th><th>Сума</th><th></th></tr></thead><tbody>${ev.map(x=>`<tr><td>${x.event_date}</td><td>${esc(x.event_type)}</td><td>${x.heads}</td><td>${num(x.weight_kg).toFixed(2)} кг</td><td>${money(x.total_amount)}</td><td><button class="danger mini" onclick="del('livestock_events','${x.id}');batchView('${id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Немає операцій.</td></tr>'}</tbody></table></div>${isB?`<div class="card section"><h3>Зважування</h3><table class="table"><thead><tr><th>Дата</th><th>Відібрано</th><th>Середня вага</th><th>Загальна жива маса</th><th></th></tr></thead><tbody>${ws.map(w=>`<tr><td>${w.weigh_date}</td><td>${w.sampled_heads}</td><td>${num(w.average_weight_g).toFixed(1)} г</td><td>${(heads(b)*num(w.average_weight_g)/1000).toFixed(2)} кг</td><td><button class="danger mini" onclick="del('broiler_weights','${w.id}');batchView('${id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Немає зважувань.</td></tr>'}</tbody></table></div>`:`<div class="card section"><h3>Яйця</h3><table class="table"><thead><tr><th>Дата</th><th>Добрі</th><th>Брак</th><th>Несучість</th><th></th></tr></thead><tbody>${es.map(x=>{let rate=heads(b)?num(x.good_eggs)/heads(b)*100:0;return `<tr><td>${x.record_date}</td><td>${x.good_eggs}</td><td>${x.broken_eggs}</td><td>${rate.toFixed(1)}%</td><td><button class="danger mini" onclick="del('egg_records','${x.id}');batchView('${id}')">✕</button></td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Немає записів.</td></tr>'}</tbody></table></div>`}<div class="card section"><h3>Щоденні записи</h3><table class="table"><thead><tr><th>Дата</th><th>Корм</th><th>Вода</th><th>Яйця</th><th>Витрати</th><th></th></tr></thead><tbody>${ds.map(x=>`<tr><td>${x.record_date}</td><td>${num(x.feed_kg).toFixed(2)} кг</td><td>${num(x.water_l).toFixed(1)} л</td><td>${x.eggs||0}</td><td>${money(num(x.medicine_cost)+num(x.bedding_cost)+num(x.electricity_cost)+num(x.labor_cost)+num(x.other_cost))}</td><td><button class="secondary mini" onclick="dailyForm('${id}','${x.id}')">✏️</button><button class="danger mini" onclick="del('daily_records','${x.id}');batchView('${id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Немає записів.</td></tr>'}</tbody></table></div>`)}
function batchEditEvent(id){let b=C.batches.find(x=>x.id===id);modal(`<h2>Операція з поголів'ям</h2><form id="ef" class="grid g2"><div class="field"><label>Дата</label><input id="e_date" type="date" value="${dateNow()}" required></div><div class="field"><label>Тип</label><select id="e_type"><option value="mortality">Падіж</option><option value="cull">Вибракування</option><option value="sale">Продаж</option><option value="home">Додому</option><option value="adjustment">Коригування +</option></select></div><div class="field"><label>Голів</label><input id="e_heads" type="number" min="1" required></div><div class="field"><label>Вага, кг</label><input id="e_weight" type="number" min="0" step="0.001" value="0"></div><div class="field"><label>Ціна, грн/кг</label><input id="e_price" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Клієнт</label><input id="e_client"></div><div class="field" style="grid-column:1/-1"><label>Примітка</label><textarea id="e_note"></textarea></div><button class="primary">Зберегти</button></form>`);$('ef').onsubmit=async e=>{e.preventDefault();let n=num($('e_heads').value),available=heads(b),type=$('e_type').value;if(type!=='adjustment'&&n>available){alert(`Недостатньо птиці. Доступно: ${available} гол.`);return}let total=num($('e_weight').value)*num($('e_price').value);await save('livestock_events',{batch_id:id,event_date:$('e_date').value,event_type:type,heads:n,weight_kg:num($('e_weight').value),price_per_kg:num($('e_price').value),total_amount:total,client:$('e_client').value.trim(),notes:$('e_note').value.trim()});if(type==='sale'&&total>0)await save('finance',{operation_type:'income',operation_date:$('e_date').value,category:'Продаж птиці',amount:total,batch_id:id,description:`Продаж ${n} гол.`});close();batchView(id)}}
function weightForm(id){modal(`<h2>⚖️ Зважування</h2><form id="wf" class="grid g2"><div class="field"><label>Дата</label><input id="w_date" type="date" value="${dateNow()}" required></div><div class="field"><label>Кількість зважених</label><input id="w_n" type="number" min="1" required></div><div class="field"><label>Середня вага, г</label><input id="w_avg" type="number" min="0" step="0.1" required></div><div class="field"><label>Примітка</label><input id="w_note"></div><button class="primary">Зберегти</button></form>`);$('wf').onsubmit=async e=>{e.preventDefault();let b=C.batches.find(x=>x.id===id),n=num($('w_n').value);if(n>heads(b)){alert('Зважених не може бути більше поточного поголів’я.');return}await save('broiler_weights',{batch_id:id,weigh_date:$('w_date').value,sampled_heads:n,average_weight_g:num($('w_avg').value),notes:$('w_note').value.trim()});close();batchView(id)}}
function dailyForm(id,rid){let r=rid?C.daily.find(x=>x.id===rid):null;modal(`<h2>${r?'Редагування':'Додати'} щоденний облік</h2><form id="df" class="grid g3"><div class="field"><label>Дата</label><input id="d_date" type="date" value="${r?.record_date||dateNow()}" required></div><div class="field"><label>Корм, кг</label><input id="d_feed" type="number" min="0" step="0.001" value="${r?.feed_kg||0}"></div><div class="field"><label>Вода, л</label><input id="d_water" type="number" min="0" step="0.1" value="${r?.water_l||0}"></div><div class="field"><label>Яйця, шт.</label><input id="d_eggs" type="number" min="0" value="${r?.eggs||0}"></div><div class="field"><label>Ліки, грн</label><input id="d_med" type="number" min="0" step="0.01" value="${r?.medicine_cost||0}"></div><div class="field"><label>Підстилка, грн</label><input id="d_bed" type="number" min="0" step="0.01" value="${r?.bedding_cost||0}"></div><div class="field"><label>Електроенергія, грн</label><input id="d_el" type="number" min="0" step="0.01" value="${r?.electricity_cost||0}"></div><div class="field"><label>Зарплата, грн</label><input id="d_lab" type="number" min="0" step="0.01" value="${r?.labor_cost||0}"></div><div class="field"><label>Інше, грн</label><input id="d_other" type="number" min="0" step="0.01" value="${r?.other_cost||0}"></div><div class="field" style="grid-column:1/-1"><label>Примітка</label><textarea id="d_note">${esc(r?.notes||'')}</textarea></div><button class="primary">Зберегти</button></form>`);$('df').onsubmit=async e=>{e.preventDefault();await save('daily_records',{batch_id:id,record_date:$('d_date').value,feed_kg:num($('d_feed').value),water_l:num($('d_water').value),eggs:Math.round(num($('d_eggs').value)),medicine_cost:num($('d_med').value),bedding_cost:num($('d_bed').value),electricity_cost:num($('d_el').value),labor_cost:num($('d_lab').value),other_cost:num($('d_other').value),notes:$('d_note').value.trim()},rid);close();batchView(id)}}
function eggSaleForm(id){modal(`<h2>🥚 Продаж яєць</h2><form id="sf" class="grid g2"><div class="field"><label>Дата</label><input id="s_date" type="date" value="${dateNow()}"></div><div class="field"><label>Кількість, шт.</label><input id="s_qty" type="number" min="1" required></div><div class="field"><label>Ціна 1 яйця, грн</label><input id="s_price" type="number" min="0" step="0.01" required></div><div class="field"><label>Клієнт</label><input id="s_client"></div><button class="primary">Зберегти</button></form>`);$('sf').onsubmit=async e=>{e.preventDefault();let qty=Math.round(num($('s_qty').value)),total=qty*num($('s_price').value);let produced=C.eggs.filter(x=>x.batch_id===id).reduce((s,x)=>s+num(x.good_eggs),0),sold=C.eggSales.filter(x=>x.batch_id===id).reduce((s,x)=>s+num(x.quantity),0);if(qty>produced-sold){alert(`Недостатньо яєць. Доступно: ${produced-sold} шт.`);return}await save('egg_sales',{batch_id:id,sale_date:$('s_date').value,quantity:qty,price_per_egg:num($('s_price').value),client:$('s_client').value.trim()});await save('finance',{operation_type:'income',operation_date:$('s_date').value,category:'Продаж яєць',amount:total,batch_id:id,description:`Продаж ${qty} яєць`});close();batchView(id)}}
function treatmentForm(id){modal(`<h2>💊 Лікування</h2><form id="tf" class="grid g2"><div class="field"><label>Дата</label><input id="t_date" type="date" value="${dateNow()}"></div><div class="field"><label>Препарат</label><select id="t_med"><option value="">Вибрати</option>${C.meds.map(m=>`<option value="${m.id}">${esc(m.name)} ${esc(m.concentration||'')}</option>`).join('')}</select></div><div class="field"><label>Назва препарату, якщо немає в списку</label><input id="t_name"></div><div class="field"><label>Дозування</label><input id="t_dose" placeholder="наприклад 1 мл/л"></div><div class="field"><label>Птиця, голів</label><input id="t_birds" type="number" min="0"></div><div class="field"><label>Витрачено</label><input id="t_qty" type="number" min="0" step="0.001"></div><div class="field"><label>Одиниця</label><select id="t_unit"><option>мл</option><option>г</option><option>л</option><option>шт.</option></select></div><div class="field"><label>Ціна за одиницю, грн</label><input id="t_price" type="number" min="0" step="0.0001"></div><button class="primary">Зберегти</button></form>`);$('t_med').onchange=()=>{let m=C.meds.find(x=>x.id===$('t_med').value);if(m){$('t_name').value=m.name;$('t_price').value=m.package_ml?num(m.price)/num(m.package_ml):m.package_g?num(m.price)/num(m.package_g):num(m.price)}};$('tf').onsubmit=async e=>{e.preventDefault();let m=C.meds.find(x=>x.id===$('t_med').value);await save('treatments',{batch_id:id,treatment_date:$('t_date').value,medicine_id:m?.id||null,medicine_name:($('t_name').value.trim()||m?.name||'Препарат'),dosage:$('t_dose').value.trim(),birds:Math.round(num($('t_birds').value)),used_qty:num($('t_qty').value),unit:$('t_unit').value,price_per_unit:num($('t_price').value),notes:''});close();batchView(id)}}
function warehouse(){let rows=C.items.map(i=>{let q=C.moves.filter(m=>m.item_id===i.id).reduce((s,m)=>{if(m.movement_type==='in')return s+num(m.quantity);if(['use','sale','home'].includes(m.movement_type))return s-num(m.quantity);if(m.movement_type==='adjustment')return s+(m.adjustment_direction==='out'?-num(m.quantity):num(m.quantity));return s},0);return {...i,q}});$('content').innerHTML=`<div class="row noPrint"><button class="primary" onclick="itemForm()">＋ Товар</button><button class="secondary" onclick="moveForm()">＋ Рух</button></div><div class="card section"><table class="table"><thead><tr><th>Тип</th><th>Назва</th><th>Од.</th><th>Залишок</th><th>Ціна</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.item_type)}</td><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.supplier||'')}</span></td><td>${esc(x.unit)}</td><td><b>${x.q.toFixed(3)}</b></td><td>${money(x.price_per_unit)}</td><td><button class="secondary mini" onclick="itemForm('${x.id}')">✏️</button> <button class="secondary mini" onclick="moveForm('${x.id}')">＋ Рух</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Склад порожній.</td></tr>'}</tbody></table></div>`}
function itemForm(id){let x=id?C.items.find(i=>i.id===id):null;modal(`<h2>${x?'Редагування':'Новий'} товар</h2><form id="if" class="grid g3"><div class="field"><label>Тип</label><select id="i_type"><option value="feed" ${x?.item_type==='feed'?'selected':''}>Корм</option><option value="medicine" ${x?.item_type==='medicine'?'selected':''}>Ліки</option><option value="bedding" ${x?.item_type==='bedding'?'selected':''}>Підстилка</option><option value="other" ${x?.item_type==='other'?'selected':''}>Інше</option></select></div><div class="field"><label>Назва</label><input id="i_name" value="${esc(x?.name||'')}" required></div><div class="field"><label>Одиниця</label><input id="i_unit" value="${esc(x?.unit||'кг')}" required></div><div class="field"><label>Ціна за одиницю</label><input id="i_price" type="number" min="0" step="0.0001" value="${x?.price_per_unit||0}"></div><div class="field"><label>Постачальник</label><input id="i_supplier" value="${esc(x?.supplier||'')}"></div><div class="field"><label>Партія</label><input id="i_lot" value="${esc(x?.lot||'')}"></div><div class="field"><label>Термін придатності</label><input id="i_exp" type="date" value="${x?.expiry_date||''}"></div><button class="primary">Зберегти</button></form>`);$('if').onsubmit=async e=>{e.preventDefault();await save('warehouse_items',{item_type:$('i_type').value,name:$('i_name').value.trim(),unit:$('i_unit').value.trim(),price_per_unit:num($('i_price').value),supplier:$('i_supplier').value.trim(),lot:$('i_lot').value.trim(),expiry_date:$('i_exp').value||null},id);close()}}
function stock(itemId){return C.moves.filter(m=>m.item_id===itemId).reduce((s,m)=>m.movement_type==='in'?s+num(m.quantity):['use','sale','home'].includes(m.movement_type)?s-num(m.quantity):m.movement_type==='adjustment'?s+(m.adjustment_direction==='out'?-num(m.quantity):num(m.quantity)):s,0)}
function moveForm(defaultItem){let items=C.items;modal(`<h2>📦 Рух складу</h2><form id="mf" class="grid g3"><div class="field"><label>Товар</label><select id="m_item" required>${items.map(x=>`<option value="${x.id}" ${x.id===defaultItem?'selected':''}>${esc(x.name)} (${stock(x.id).toFixed(2)} ${esc(x.unit)})</option>`).join('')}</select></div><div class="field"><label>Дата</label><input id="m_date" type="date" value="${dateNow()}"></div><div class="field"><label>Операція</label><select id="m_type"><option value="in">Прихід</option><option value="use">Використання</option><option value="sale">Продаж</option><option value="home">Додому</option><option value="adjustment">Коригування</option></select></div><div class="field"><label>Кількість</label><input id="m_qty" type="number" min="0.001" step="0.001" required></div><div class="field"><label>Ціна/од.</label><input id="m_price" type="number" min="0" step="0.0001"></div><div class="field"><label>Напрямок коригування</label><select id="m_dir"><option value="in">+</option><option value="out">−</option></select></div><div class="field"><label>Партія</label><select id="m_batch"><option value="">Без партії</option>${C.batches.filter(b=>b.status!=='archived').map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>Постачальник</label><input id="m_supplier"></div><div class="field"><label>Примітка</label><input id="m_note"></div><button class="primary">Зберегти</button></form>`);$('mf').onsubmit=async e=>{e.preventDefault();let item=$('m_item').value,q=num($('m_qty').value),type=$('m_type').value;if(['use','sale','home'].includes(type)&&q>stock(item)){alert(`Недостатній залишок. Є ${stock(item).toFixed(3)}.`);return}let total=q*num($('m_price').value);await save('warehouse_movements',{item_id:item,movement_date:$('m_date').value,movement_type:type,quantity:q,unit_price:num($('m_price').value),total_amount:total,adjustment_direction:type==='adjustment'?$('m_dir').value:null,batch_id:$('m_batch').value||null,supplier:$('m_supplier').value.trim(),notes:$('m_note').value.trim()});if(type==='in'&&total>0)await save('finance',{operation_type:'expense',operation_date:$('m_date').value,category:'Придбання '+(C.items.find(x=>x.id===item)?.name||'товару'),amount:total,batch_id:$('m_batch').value||null,description:'Прихід на склад'});close()}}
function medicines(){let a=C.meds;$('content').innerHTML=`<div class="row noPrint"><button class="primary" onclick="medForm()">＋ Препарат</button></div><div class="card section"><table class="table"><thead><tr><th>Назва</th><th>Концентрація</th><th>Форма</th><th>Упаковка</th><th>Ціна</th><th>Постачальник</th><th></th></tr></thead><tbody>${a.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.concentration||'')}</td><td>${esc(m.form||'')}</td><td>${num(m.package_ml)||num(m.package_g)||0}</td><td>${money(m.price)}</td><td>${esc(m.supplier||'')}</td><td><button class="secondary mini" onclick="medForm('${m.id}')">✏️</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">Немає препаратів.</td></tr>'}</tbody></table></div>`}
function medForm(id){let m=id?C.meds.find(x=>x.id===id):null;modal(`<h2>${m?'Редагування':'Новий'} препарат</h2><form id="medf" class="grid g3"><div class="field"><label>Назва</label><input id="mn" value="${esc(m?.name||'')}" required></div><div class="field"><label>Концентрація</label><input id="mc" value="${esc(m?.concentration||'')}"></div><div class="field"><label>Форма</label><input id="mf2" value="${esc(m?.form||'')}"></div><div class="field"><label>Об'єм упаковки, мл</label><input id="ml" type="number" min="0" step="0.001" value="${m?.package_ml||0}"></div><div class="field"><label>Маса упаковки, г</label><input id="mg" type="number" min="0" step="0.001" value="${m?.package_g||0}"></div><div class="field"><label>Ціна упаковки, грн</label><input id="mp" type="number" min="0" step="0.01" value="${m?.price||0}"></div><div class="field"><label>Постачальник</label><input id="ms" value="${esc(m?.supplier||'')}"></div><div class="field"><label>Партія</label><input id="mlo" value="${esc(m?.lot||'')}"></div><div class="field"><label>Термін</label><input id="me" type="date" value="${m?.expiry_date||''}"></div><button class="primary">Зберегти</button></form>`);$('medf').onsubmit=async e=>{e.preventDefault();await save('medicines',{name:$('mn').value.trim(),concentration:$('mc').value.trim(),form:$('mf2').value.trim(),package_ml:num($('ml').value),package_g:num($('mg').value),price:num($('mp').value),supplier:$('ms').value.trim(),lot:$('mlo').value.trim(),expiry_date:$('me').value||null},id);close()}}
function recipes(){let a=C.recipes;$('content').innerHTML=`<div class="row noPrint"><button class="primary" onclick="recipeForm()">＋ Рецепт</button></div><div class="grid g2 section">${a.map(r=>{let l=C.lines.filter(x=>x.recipe_id===r.id),kg=l.reduce((s,x)=>s+num(x.kg),0),cost=l.reduce((s,x)=>s+num(x.kg)*num(x.price_per_kg),0);return `<div class="card"><div class="row"><h3>${esc(r.name)}</h3><span class="right pill">${esc(r.phase||'')}</span></div><table class="table"><tbody>${l.map(x=>`<tr><td>${esc(x.ingredient_name)}</td><td>${num(x.kg).toFixed(3)} кг</td><td>${money(num(x.kg)*num(x.price_per_kg))}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Немає інгредієнтів.</td></tr>'}</tbody></table><b>${kg.toFixed(3)} кг · ${money(cost)} · ${kg?money(cost/kg):'—'}/кг</b><div class="row section"><button class="secondary mini" onclick="recipeForm('${r.id}')">✏️</button><button class="danger mini" onclick="del('feed_recipes','${r.id}')">Видалити</button></div></div>`}).join('')||'<div class="card muted">Рецептів немає.</div>'}</div>`}
function recipeForm(id){let r=id?C.recipes.find(x=>x.id===id):null,lines=id?C.lines.filter(x=>x.recipe_id===id):[];let rows=lines.length?lines:[{ingredient_name:'',kg:0,price_per_kg:0,protein_pct:0,energy_mj:0}];modal(`<div class="row"><h2>${r?'Редагування':'Новий'} рецепт</h2><button class="secondary right" onclick="close()">✕</button></div><form id="rf"><div class="grid g2"><div class="field"><label>Назва</label><input id="rn" value="${esc(r?.name||'') }" required></div><div class="field"><label>Фаза</label><input id="rp" value="${esc(r?.phase||'')}"></div></div><div class="section"><table class="table"><thead><tr><th>Інгредієнт</th><th>Кг</th><th>Ціна/кг</th><th>Білок %</th><th>МДж</th><th></th></tr></thead><tbody id="rbody">${rows.map((x,i)=>`<tr><td><input class="ri" value="${esc(x.ingredient_name||'')}"></td><td><input class="rk" type="number" min="0.001" step="0.001" value="${x.kg||0}"></td><td><input class="rc" type="number" min="0" step="0.0001" value="${x.price_per_kg||0}"></td><td><input class="rpct" type="number" min="0" step="0.001" value="${x.protein_pct||0}"></td><td><input class="re" type="number" min="0" step="0.001" value="${x.energy_mj||0}"></td><td><button type="button" class="danger mini" onclick="this.closest('tr').remove()">✕</button></td></tr>`).join('')}</tbody></table><button type="button" class="secondary" onclick="addRecipeRow()">＋ Інгредієнт</button></div><div class="row section"><button class="primary">💾 Зберегти рецепт</button></div></form>`);$('rf').onsubmit=async e=>{e.preventDefault();let p={name:$('rn').value.trim(),phase:$('rp').value.trim(),notes:''};let saved=await save('feed_recipes',p,id);if(!saved)return;let recipe=id?C.recipes.find(x=>x.id===id):C.recipes.find(x=>x.name===p.name);if(id){for(const x of C.lines.filter(x=>x.recipe_id===id))await db.from('feed_recipe_lines').delete().eq('id',x.id)}for(const tr of document.querySelectorAll('#rbody tr')){let cells=tr.querySelectorAll('input');if(!cells[0].value.trim()||num(cells[1].value)<=0)continue;await save('feed_recipe_lines',{recipe_id:recipe.id,ingredient_name:cells[0].value.trim(),kg:num(cells[1].value),price_per_kg:num(cells[2].value),protein_pct:num(cells[3].value),energy_mj:num(cells[4].value)})}close();await load()}}
function addRecipeRow(){let tr=document.createElement('tr');tr.innerHTML='<td><input class="ri"></td><td><input class="rk" type="number" min="0.001" step="0.001"></td><td><input class="rc" type="number" min="0" step="0.0001"></td><td><input class="rpct" type="number" min="0" step="0.001"></td><td><input class="re" type="number" min="0" step="0.001"></td><td><button type="button" class="danger mini" onclick="this.closest(\'tr\').remove()">✕</button></td>';$('rbody').appendChild(tr)}
function phaseManager(){modal(`<h2>⚙️ Фази годівлі бройлерів</h2><table class="table"><thead><tr><th>Фаза</th><th>Від</th><th>До</th><th>Рекоменд. вага, г</th><th>Корм г/гол</th><th></th></tr></thead><tbody>${C.phases.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.from_day}</td><td>${p.to_day}</td><td>${num(p.recommended_weight_g)}</td><td>${num(p.recommended_feed_g_head)}</td><td><button class="secondary mini" onclick="phaseForm('${p.id}')">✏️</button></td></tr>`).join('')}</tbody></table>`)}
function phaseForm(id){let p=C.phases.find(x=>x.id===id);modal(`<h2>Редагування фази</h2><form id="pf" class="grid g2"><div class="field"><label>Назва</label><input id="pn" value="${esc(p.name)}"></div><div class="field"><label>Від дня</label><input id="pfrom" type="number" min="1" value="${p.from_day}"></div><div class="field"><label>До дня</label><input id="pto" type="number" min="1" value="${p.to_day}"></div><div class="field"><label>Рекомендована вага, г</label><input id="pw" type="number" min="0" step="0.1" value="${p.recommended_weight_g||0}"></div><div class="field"><label>Рекомендований корм, г/гол/день</label><input id="pfed" type="number" min="0" step="0.1" value="${p.recommended_feed_g_head||0}"></div><button class="primary">Зберегти</button></form>`);$('pf').onsubmit=async e=>{e.preventDefault();await save('feed_phases',{name:$('pn').value.trim(),from_day:Math.round(num($('pfrom').value)),to_day:Math.round(num($('pto').value)),recommended_weight_g:num($('pw').value),recommended_feed_g_head:num($('pfed').value),kind:'broiler',sort_order:p.sort_order},id);close();phaseManager()}}
function finance(){let inc=C.finance.filter(x=>x.operation_type==='income'),exp=C.finance.filter(x=>x.operation_type==='expense'),I=inc.reduce((s,x)=>s+num(x.amount),0),E=exp.reduce((s,x)=>s+num(x.amount),0);$('content').innerHTML=`<div class="grid g3"><div class="card">Дохід<div class="stat">${money(I)}</div></div><div class="card">Витрати<div class="stat">${money(E)}</div></div><div class="card">Результат<div class="stat">${money(I-E)}</div></div></div><div class="row noPrint section"><button class="primary" onclick="finForm()">＋ Операція</button></div><div class="card section"><table class="table"><thead><tr><th>Дата</th><th>Тип</th><th>Категорія</th><th>Партія</th><th>Сума</th><th></th></tr></thead><tbody>${C.finance.slice().reverse().map(x=>`<tr><td>${x.operation_date}</td><td>${x.operation_type==='income'?'Дохід':'Витрата'}</td><td>${esc(x.category)}</td><td>${esc(C.batches.find(b=>b.id===x.batch_id)?.name||'')}</td><td>${money(x.amount)}</td><td><button class="secondary mini" onclick="finForm('${x.id}')">✏️</button> <button class="danger mini" onclick="del('finance','${x.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Немає операцій.</td></tr>'}</tbody></table></div>`}
function finForm(id){let x=id?C.finance.find(z=>z.id===id):null;modal(`<h2>${x?'Редагування':'Нова'} фінансова операція</h2><form id="ff" class="grid g2"><div class="field"><label>Тип</label><select id="ft"><option value="income" ${x?.operation_type==='income'?'selected':''}>Дохід</option><option value="expense" ${x?.operation_type==='expense'?'selected':''}>Витрата</option></select></div><div class="field"><label>Дата</label><input id="fd" type="date" value="${x?.operation_date||dateNow()}"></div><div class="field"><label>Категорія</label><input id="fc" value="${esc(x?.category||'')}" required></div><div class="field"><label>Сума, грн</label><input id="fa" type="number" min="0" step="0.01" value="${x?.amount||0}" required></div><div class="field"><label>Партія</label><select id="fb"><option value="">Без партії</option>${C.batches.map(b=>`<option value="${b.id}" ${x?.batch_id===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>Опис</label><input id="fx" value="${esc(x?.description||'')}"></div><button class="primary">Зберегти</button></form>`);$('ff').onsubmit=async e=>{e.preventDefault();await save('finance',{operation_type:$('ft').value,operation_date:$('fd').value,category:$('fc').value.trim(),amount:num($('fa').value),batch_id:$('fb').value||null,description:$('fx').value.trim()},id);close()}}
function reports(){let a=C.batches.filter(b=>b.status!=='archived');$('content').innerHTML=`<div class="row noPrint"><button class="secondary" onclick="window.print()">🖨️ Друк / PDF</button></div><div class="grid g2 section">${a.map(b=>`<div class="report"><h2>${esc(b.name)}</h2><p>${b.kind==='broiler'?'Бройлери':'Кури-несучки'} · ${esc(b.breed||'')} · посадка ${b.placed_at}</p><div class="grid g3"><div><b>Поголів'я</b><br>${heads(b)}</div><div><b>Вік</b><br>${age(b)} дн.</div><div><b>Витрати</b><br>${money(batchCost(b.id))}</div></div>${b.kind==='broiler'?`<hr><div class="grid g3"><div><b>Середня вага</b><br>${lastWeight(b.id)?num(lastWeight(b.id).average_weight_g).toFixed(0)+' г':'—'}</div><div><b>Жива маса</b><br>${lastWeight(b.id)?(heads(b)*num(lastWeight(b.id).average_weight_g)/1000).toFixed(2)+' кг':'—'}</div><div><b>FCR</b><br>${fcr(b.id)?fcr(b.id).toFixed(3):'—'}</div></div><p>Корм: ${feed(b.id).toFixed(2)} кг · Приріст: ${gain(b.id).toFixed(2)} кг · Витрати корму/кг приросту: ${fcr(b.id)?fcr(b.id).toFixed(3):'—'} кг</p>`:`<hr><div class="grid g3"><div><b>Добрі яйця</b><br>${C.eggs.filter(x=>x.batch_id===b.id).reduce((s,x)=>s+num(x.good_eggs),0)}</div><div><b>Продано яєць</b><br>${C.eggSales.filter(x=>x.batch_id===b.id).reduce((s,x)=>s+num(x.quantity),0)}</div><div><b>Дохід від яєць</b><br>${money(C.eggSales.filter(x=>x.batch_id===b.id).reduce((s,x)=>s+num(x.total_amount),0))}</div></div>`}<hr><div><b>Дохід партії:</b> ${money(fin(b.id,'income'))}</div><div><b>Фінансовий результат:</b> ${money(fin(b.id,'income')-batchCost(b.id))}</div><div class="section muted mini">Падіж: ${C.events.filter(x=>x.batch_id===b.id&&x.event_type==='mortality').reduce((s,x)=>s+num(x.heads),0)} · Продаж: ${C.events.filter(x=>x.batch_id===b.id&&x.event_type==='sale').reduce((s,x)=>s+num(x.heads),0)} · Додому: ${C.events.filter(x=>x.batch_id===b.id&&x.event_type==='home').reduce((s,x)=>s+num(x.heads),0)}</div></div>`).join('')||'<div class="card muted">Немає партій для звіту.</div>'}</div>`}
function settings(){$('content').innerHTML=`<div class="card"><h3>FERMA PRO v5</h3><p class="muted">Облік обмежено двома напрямками: бройлери та кури-несучки.</p><p>Email: ${esc(user?.email||'')}</p><button class="secondary" onclick="load()">Перезавантажити дані</button></div>`}
async function init(){let s=await db.auth.getSession();user=s.data?.session?.user||null;if(user){$('auth').classList.add('hidden');$('app').classList.remove('hidden');await load()}else{$('auth').classList.remove('hidden');$('app').classList.add('hidden')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;$('authMsg').textContent='Вхід...';let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)$('authMsg').textContent=r.error.message;else await init();$('loginBtn').disabled=false};$('signupBtn').onclick=async()=>{let r=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authMsg').textContent=r.error?r.error.message:'Реєстрацію виконано. Якщо потрібно, підтвердь email.'};db.auth.onAuthStateChange(()=>init());init();
</script></body></html>
