const URL='https://axxormlcevusdjfqruib.supabase.co',KEY='sb_publishable_fmFGe67Hi8_nUZC8sKP5xg_piWbDfZi',db=supabase.createClient(URL,KEY);let user=null,P='dashboard';const C={batches:[],events:[],weights:[],daily:[],items:[],moves:[],meds:[],treatments:[],finance:[],recipes:[],lines:[],phases:[]};const $=id=>document.getElementById(id),N=v=>{const x=Number(v);return Number.isFinite(x)?x:0},money=v=>N(v).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' грн',esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const today=()=>new Date().toISOString().slice(0,10);function close(){ $('modal').classList.add('hidden') }function modal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}
async function login(){const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)$('authMsg').textContent=r.error.message}async function signup(){const r=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authMsg').textContent=r.error?r.error.message:'Реєстрацію виконано. Перевір email, якщо підтвердження увімкнено.'}async function logout(){await db.auth.signOut()}db.auth.onAuthStateChange((e,s)=>{user=s?.user||null;if(user){$('auth').classList.add('hidden');$('app').classList.remove('hidden');refresh()}else{$('auth').classList.remove('hidden');$('app').classList.add('hidden')}});

function heads(b){let x=N(b.initial_heads);for(const e of C.events.filter(e=>e.batch_id===b.id)){if(['mortality','sale','home','cull'].includes(e.event_type))x-=N(e.heads);if(e.event_type==='adjustment')x+=N(e.heads)}return Math.max(0,Math.round(x))}function age(b,d=today()){return Math.max(1,Math.floor((new Date(d)-new Date(b.placed_at))/86400000)+1)}function weight(id){return C.weights.filter(x=>x.batch_id===id).sort((a,b)=>new Date(b.weigh_date)-new Date(a.weigh_date))[0]||null}function firstWeight(id){return C.weights.filter(x=>x.batch_id===id).sort((a,b)=>new Date(a.weigh_date)-new Date(b.weigh_date))[0]||null}function phase(b){const a=age(b);return C.phases.filter(p=>p.kind==='broiler').find(p=>a>=N(p.from_day)&&a<=N(p.to_day))||null}function feed(bid){return C.daily.filter(x=>x.batch_id===bid).reduce((s,x)=>s+N(x.feed_kg),0)}function costDaily(bid){return C.daily.filter(x=>x.batch_id===bid).reduce((s,x)=>s+N(x.medicine_cost)+N(x.bedding_cost)+N(x.electricity_cost)+N(x.water_cost)+N(x.labor_cost)+N(x.other_cost),0)}function medCost(bid){return C.treatments.filter(x=>x.batch_id===bid).reduce((s,x)=>s+N(x.total_cost),0)}function eventRevenue(bid){return C.events.filter(x=>x.batch_id===bid&&x.event_type==='sale').reduce((s,x)=>s+N(x.total_amount),0)}function financeFor(bid,type){return C.finance.filter(x=>x.batch_id===bid&&(!type||x.operation_type===type)).reduce((s,x)=>s+N(x.amount),0)}function gain(b){const w=weight(b.id),f=firstWeight(b.id);if(!w||!f)return 0;const cur=heads(b)*N(w.average_weight_g)/1000,initial=b.initial_heads*N(f.average_weight_g)/1000;return Math.max(0,cur-initial)}function fcr(b){const g=gain(b),f=feed(b.id);return g>0?f/g:0}function safe(v,d='—'){return Number.isFinite(N(v))&&N(v)!==0?d?String(v):v:d}
function dashboard(){const bs=C.batches.filter(b=>b.status!=='archived'),bro=bs.filter(b=>b.kind==='broiler'),lay=bs.filter(b=>b.kind==='layer'),inc=C.finance.filter(x=>x.operation_type==='income').reduce((s,x)=>s+N(x.amount),0),exp=C.finance.filter(x=>x.operation_type==='expense').reduce((s,x)=>s+N(x.amount),0),stock=C.items.map(i=>({i,b:C.moves.filter(m=>m.item_id===i.id).reduce((s,m)=>s+(['in','adjustment'].includes(m.movement_type)?(m.adjustment_direction==='out'?-N(m.quantity):N(m.quantity)):['use','sale','home'].includes(m.movement_type)?-N(m.quantity):0),0)}));$('content').innerHTML=`<div class="grid g4"><div class="card">🐔 Бройлери<div class="stat">${bro.reduce((s,b)=>s+heads(b),0)}</div><div class="muted">активних голів</div></div><div class="card">🥚 Несучки<div class="stat">${lay.reduce((s,b)=>s+heads(b),0)}</div><div class="muted">активних голів</div></div><div class="card">💰 Дохід<div class="stat">${money(inc)}</div></div><div class="card">📉 Витрати<div class="stat">${money(exp)}</div><div class="muted">прибуток ${money(inc-exp)}</div></div></div><div class="card" style="margin-top:14px"><h3>Активні партії</h3>${bro.map(b=>{const w=weight(b.id),p=phase(b);return `<div class="card" style="margin:8px 0"><div class="row"><b>${esc(b.name)}</b><span class="pill">${heads(b)} гол.</span><span class="pill">${age(b)} день</span>${p?`<span class="pill">${esc(p.name)}</span>`:''}<span class="right">${w?N(w.average_weight_g).toFixed(0)+' г':'немає ваги'} </span><button class="secondary small" onclick="openBatch('${b.id}')">Облік</button></div><div class="muted small">Корм ${feed(b.id).toFixed(2)} кг · приріст ${gain(b).toFixed(2)} кг · FCR ${fcr(b)?fcr(b).toFixed(3):'—'}</div></div>`}).join('')||'<div class="muted">Немає активних партій</div>'}</div>`}
function broilers(){const a=C.batches.filter(b=>b.kind==='broiler');$('content').innerHTML=`<div class="row noPrint"><button class="primary" onclick="batchForm('broiler')">＋ Нова партія</button><button class="secondary" onclick="phaseManager()">⚙️ Фази годівлі</button></div><div class="card" style="margin-top:12px"><table class="table"><thead><tr><th>Партія</th><th>Посадка</th><th>Було</th><th>Зараз</th><th>Вік</th><th>Вага</th><th>Корм</th><th>FCR</th><th></th></tr></thead><tbody>${a.map(b=>{const w=weight(b.id);return `<tr><td><b>${esc(b.name)}</b><br>${esc(b.breed||'')}</td><td>${b.placed_at}</td><td>${N(b.initial_heads)}</td><td><b>${heads(b)}</b></td><td>${age(b)}</td><td>${w?N(w.average_weight_g).toFixed(0)+' г':'—'}</td><td>${feed(b.id).toFixed(2)} кг</td><td>${fcr(b)?fcr(b).toFixed(3):'—'}</td><td><button class="secondary small" onclick="openBatch('${b.id}')">Облік</button> <button class="secondary small" onclick="batchForm('broiler','${b.id}')">✎</button> <button class="danger small" onclick="del('batches','${b.id}')">×</button></td></tr>`}).join('')}</tbody></table></div>`}

function batchForm(kind,id){const b=id?C.batches.find(x=>x.id===id):null;modal(`<h3>${b?'Редагування':'Нова'} партія ${kind==='broiler'?'бройлерів':'несучок'}</h3><form id="bf" class="grid g2"><div class="field"><label>Назва партії</label><input name="name" required value="${esc(b?.name||'')}"></div><div class="field"><label>Порода</label><input name="breed" value="${esc(b?.breed||'Cobb 500')}"></div><div class="field"><label>Дата посадки</label><input name="placed_at" type="date" required value="${b?.placed_at||today()}"></div><div class="field"><label>Початкова кількість</label><input name="initial_heads" type="number" min="1" required value="${N(b?.initial_heads)||''}"></div><div class="field"><label>Ціна курчати, грн/гол.</label><input name="chick_price" type="number" step="0.01" value="${N(b?.chick_price)||''}"></div><div class="field"><label>Стартова вага, г</label><input name="start_weight_g" type="number" step="0.1" value="${N(b?.start_weight_g)||''}"></div><div class="field" style="grid-column:1/-1"><label>Примітка</label><textarea name="notes">${esc(b?.notes||'')}</textarea></div><div class="row" style="grid-column:1/-1"><button class="primary">Зберегти</button><button type="button" class="secondary" onclick="close()">Скасувати</button></div></form>`);$('bf').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.user_id=user.id;x.kind=kind;x.initial_heads=N(x.initial_heads);x.chick_price=N(x.chick_price);x.start_weight_g=N(x.start_weight_g);let r=b?await db.from('batches').update(x).eq('id',b.id):await db.from('batches').insert(x);if(r.error)return alert(r.error.message);close();await refresh()}}

ry">Зберегти</button><button type="button" class="secondary" onclick="close()">Скасувати</button></div></form>`);$('medf').onsubmit=async e=>{e.preventDefault();const z=Object.fromEntries(new FormData(e.target));z.user_id=user.id;z.package_ml=N(z.package_ml);z.package_g=N(z.package_g);z.price=N(z.price);const r=id?await db.from('medicines').update(z).eq('id',id):await db.from('medicines').insert(z);if(r.error)return alert(r.error.message);close();refresh()}}
function recipes(){const total=r=>C.lines.filter(l=>l.recipe_id===r.id).reduce((s,l)=>s+N(l.kg)*N(l.price_per_kg),0),kg=r=>C.lines.filter(l=>l.recipe_id===r.id).reduce((s,l)=>s+N(l.kg),0);$('content').innerHTML=`<div class="row noPrint"><button class="primary" onclick="recipeForm()">＋ Новий рецепт</button></div><div class="grid g2" style="margin-top:12px">${C.recipes.map(r=>`<div class="card"><h3 style="margin-top:0">${esc(r.name)}</h3><div class="muted">${esc(r.phase||'')}</div><p>Маса: ${kg(r).toFixed(2)} кг<br>Собівартість: ${money(total(r))}<br>Ціна/кг: ${kg(r)?money(total(r)/kg(r)):'—'}</p><table class="table"><tr><th>Інгредієнт</th><th>кг</th><th>%</th><th>грн</th></tr>${C.lines.filter(l=>l.recipe_id===r.id).map(l=>`<tr><td>${esc(l.ingredient_name)}</td><td>${N(l.kg).toFixed(2)}</td><td>${kg(r)?(N(l.kg)/kg(r)*100).toFixed(2):'0.00'}</td><td>${money(N(l.kg)*N(l.price_per_kg))}</td></tr>`).join('')}</table><div class="row"><button class="secondary small" onclick="recipeForm('${r.id}')">✎ Редагувати</button><button class="danger small" onclick="del('feed_recipes','${r.id}')">×</button></div></div>`).join('')||'<div class="muted">Рецептів немає</div>'}</div>`}
function recipeForm(id){const r=id?C.recipes.find(x=>x.id===id):null;let lines=id?C.lines.filter(x=>x.recipe_id===id):[];const row=(l={})=>`<div class="row line"><input class="ri" placeholder="Інгредієнт" value="${esc(l.ingredient_name||'')}"><input class="rk" type="number" step="0.001" placeholder="кг" value="${N(l.kg)||''}"><input class="rp" type="number" step="0.01" placeholder="грн/кг" value="${N(l.price_per_kg)||''}"><input class="rpr" type="number" step="0.01" placeholder="білок %" value="${N(l.protein_pct)||''}"><button type="button" class="danger" onclick="this.parentElement.remove()">×</button></div>`;modal(`<h3>${r?'Редагувати':'Новий'} рецепт</h3><form id="rf" class="grid"><div class="grid g2"><div class="field"><label>Назва</label><input name="name" required value="${esc(r?.name||'')}"></div><div class="field"><label>Фаза</label><input name="phase" value="${esc(r?.phase||'')}"></div></div><div class="notice">Додай скільки завгодно інгредієнтів. Відсоток, маса та собівартість рахуються автоматично.</div><div id="rl" class="grid">${lines.map(row).join('')||row()}</div><button type="button" class="secondary" onclick="$('rl').insertAdjacentHTML('beforeend',`${row().replace(/`/g,'\\`')}`)">＋ Інгредієнт</button><div class="row"><button class="primary">Зберегти</button><button type="button" class="secondary" onclick="close()">Скасувати</button></div></form>`);$('rf').onsubmit=async e=>{e.preventDefault();const z=Object.fromEntries(new FormData(e.target));z.user_id=user.id;let rr=id?await db.from('feed_recipes').update(z).eq('id',id).select().single():await db.from('feed_recipes').insert(z).select().single();if(rr.error)return alert(rr.error.message);const rid=id? id:rr.data.id;if(id)await db.from('feed_recipe_lines').delete().eq('recipe_id',id);const arr=[...$('rl').querySelectorAll('.line')].map(a=>({user_id:user.id,recipe_id:rid,ingredient_name:a.querySelector('.ri').value.trim(),kg:N(a.querySelector('.rk').value),price_per_kg:N(a.querySelector('.rp').value),protein_pct:N(a.querySelector('.rpr').value),energy_mj:0})).filter(x=>x.ingredient_name&&x.kg>0);if(arr.length){const lr=await db.from('feed_recipe_lines').insert(arr);if(lr.error)return alert(lr.error.message)}close();refresh()}}
function phaseManager(){const a=C.phases.filter(p=>p.kind==='broiler');modal(`<h3>Фази годівлі бройлерів</h3><p class="muted">Саме 1 STARTER + 3 GROWER + 2 FINISHER. Межі можна редагувати.</p><table class="table"><tr><th>Фаза</th><th>Від</th><th>До</th><th>Реком. вага, г</th><th>Корм, г/гол.</th><th></th></tr>${a.map(p=>`<tr><td>${esc(p.name)}</td><td>${N(p.from_day)}</td><td>${N(p.to_day)}</td><td>${N(p.recommended_weight_g)}</td><td>${N(p.recommended_feed_g_head)}</td><td><button class="secondary small" onclick="phaseForm('${p.id}')">✎</button></td></tr>`).join('')}</table><div class="row"><button class="secondary" onclick="phaseForm()">＋ Додати фазу</button><button class="secondary" onclick="close()">Закрити</button></div>`)}function phaseForm(id){const p=id?C.phases.find(x=>x.id===id):null;modal(`<h3>${p?'Редагувати':'Нова'} фаза</h3><form id="pf" class="grid g2"><div class="field"><label>Назва</label><input name="name" required value="${esc(p?.name||'')}"></div><div class="field"><label>Від дня</label><input name="from_day" type="number" min="1" required value="${N(p?.from_day)||''}"></div><div class="field"><label>До дня</label><input name="to_day" type="number" min="1" required value="${N(p?.to_day)||''}"></div><div class="field"><label>Реком. вага, г</label><input name="recommended_weight_g" type="number" step="0.1" value="${N(p?.recommended_weight_g)||''}"></div><div class="field"><label>Реком. корм, г/гол.</label><input name="recommended_feed_g_head" type="number" step="0.1" value="${N(p?.recommended_feed_g_head)||''}"></div><div class="row" style="grid-column:1/-1"><button class="primary">Зберегти</button><button type="button" class="secondary" onclick="phaseManager()">Назад</button></div></form>`);$('pf').onsubmit=async e=>{e.preventDefault();const z=Object.fromEntries(new FormData(e.target));z.user_id=user.id;z.kind='broiler';z.from_day=N(z.from_day);z.to_day=N(z.to_day);z.recommended_weight_g=N(z.recommended_weight_g);z.recommended_feed_g_head=N(z.recommended_feed_g_head);z.sort_order=z.from_day;const r=id?await db.from('feed_phases').update(z).eq('id',id):await db.from('feed_phases').insert(z);if(r.error)return alert(r.error.message);await refresh();phaseManager()}}
function finance(){const inc=C.finance.filter(x=>x.operation_type==='income').reduce((s,x)=>s+N(x.amount),0),exp=C.finance.filter(x=>x.operation_type==='expense').reduce((s,x)=>s+N(x.amount),0);$('content').innerHTML=`<div class="grid g3"><div class="card">Дохід<div class="stat">${money(inc)}</div></div><div class="card">Витрати<div class="stat">${money(exp)}</div></div><div class="card">Результат<div class="stat">${money(inc-exp)}</div></div></div><div class="row noPrint" style="margin:12px 0"><button class="primary" onclick="financeForm('income')">＋ Дохід</button><button class="secondary" onclick="financeForm('expense')">＋ Витрата</button></div><div class="card"><table class="table"><tr><th>Дата</th><th>Тип</th><th>Категорія</th><th>Партія</th><th>Сума</th><th></th></tr>${C.finance.slice().reverse().map(x=>`<tr><td>${x.operation_date}</td><td>${x.operation_type}</td><td>${esc(x.category)}</td><td>${esc(batchBy(x.batch_id)?.name||'—')}</td><td>${money(x.amount)}</td><td><button class="secondary small" onclick="financeForm('${x.operation_type}', '${x.batch_id||''}','${x.id}')">✎</button><button class="danger small" onclick="del('finance','${x.id}')">×</button></td></tr>`).join('')}</table></div>`}function financeForm(type,bid='',id){const x=id?C.finance.find(f=>f.id===id):null;modal(`<h3>${x?'Редагувати':'Додати'} ${type==='income'?'дохід':'витрату'}</h3><form id="ff" class="grid g2"><div class="field"><label>Дата</label><input name="operation_date" type="date" value="${x?.operation_date||today()}"></div><div class="field"><label>Категорія</label><input name="category" value="${esc(x?.category||'')}"></div><div class="field"><label>Сума, грн</label><input name="amount" type="number" step="0.01" min="0" required value="${N(x?.amount)||''}"></div><div class="field"><label>Партія</label><select name="batch_id"><option value="">Без партії</option>${C.batches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>Опис</label><textarea name="description">${esc(x?.description||'')}</textarea></div><div class="row" style="grid-column:1/-1"><button class="primary">Зберегти</button><button type="button" class="secondary" onclick="close()">Скасувати</button></div></form>`);$('ff').querySelector('[name=batch_id]').value=x?.batch_id||bid||'';$('ff').onsubmit=async e=>{e.preventDefault();const z=Object.fromEntries(new FormData(e.target));z.user_id=user.id;z.operation_type=type;z.amount=N(z.amount);z.batch_id=z.batch_id||null;const r=id?await db.from('finance').update(z).eq('id',id):await db.from('finance').insert(z);if(r.error)return alert(r.error.message);close();refresh()}}
function report(bid){const b=C.batches.find(x=>x.id===bid);const w=weight(bid),fw=firstWeight(bid),ev=C.events.filter(x=>x.batch_id===bid),ds=C.daily.filter(x=>x.batch_id===bid),tr=C.treatments.filter(x=>x.batch_id===bid),feedKg=feed(bid),feedCost=financeFor(bid,'expense'),income=eventRevenue(bid)+financeFor(bid,'income'),other=costDaily(bid)+medCost(bid),total=feedCost+other+N(b.chick_price)*N(b.initial_heads),outKg=ev.filter(x=>['sale','home'].includes(x.event_type)).reduce((s,x)=>s+N(x.weight_kg),0),profit=income-total;modal(`<div class="report"><div class="row"><div><h2>FERMA PRO</h2><div class="muted">Звіт по партії</div></div><span class="right"><button class="secondary noPrint" onclick="window.print()">🖨 Друк / PDF</button><button class="secondary noPrint" onclick="close()">Закрити</button></span></div><h3>${esc(b.name)}</h3><table class="table"><tr><th>Показник</th><th>Значення</th><th>Показник</th><th>Значення</th></tr><tr><td>Посадка</td><td>${b.placed_at}</td><td>Початково</td><td>${N(b.initial_heads)} гол.</td></tr><tr><td>Зараз</td><td>${heads(b)} гол.</td><td>Смертність</td><td>${ev.filter(x=>x.event_type==='mortality').reduce((s,x)=>s+N(x.heads),0)}</td></tr><tr><td>Остання вага</td><td>${w?N(w.average_weight_g).toFixed(1)+' г':'—'}</td><td>Жива маса</td><td>${w?(heads(b)*N(w.average_weight_g)/1000).toFixed(2)+' кг':'—'}</td></tr><tr><td>Корм</td><td>${feedKg.toFixed(2)} кг</td><td>FCR</td><td>${fcr(b)?fcr(b).toFixed(3):'—'}</td></tr><tr><td>Приріст</td><td>${gain(b).toFixed(2)} кг</td><td>Продано/додому</td><td>${outKg.toFixed(2)} кг</td></tr><tr><td>Курчата</td><td>${money(N(b.chick_price)*N(b.initial_heads))}</td><td>Корм та інші витрати</td><td>${money(feedCost+other)}</td></tr><tr><td>Загальна собівартість</td><td>${money(total)}</td><td>Собівартість/кг виходу</td><td>${outKg?money(total/outKg):'—'}</td></tr><tr><td>Дохід</td><td>${money(income)}</td><td><b>Прибуток</b></td><td><b>${money(profit)}</b></td></tr></table><h3>Історія зважувань</h3><table class="table"><tr><th>Дата</th><th>Голів вибірки</th><th>Середня вага</th></tr>${C.weights.filter(x=>x.batch_id===bid).map(x=>`<tr><td>${x.weigh_date}</td><td>${N(x.sampled_heads)}</td><td>${N(x.average_weight_g).toFixed(1)} г</td></tr>`).join('')}</table><h3>Витрати по днях</h3><table class="table"><tr><th>Дата</th><th>Корм</th><th>Медицина</th><th>Підстилка</th><th>Електрика</th><th>Вода</th><th>Праця</th><th>Інші</th></tr>${ds.map(x=>`<tr><td>${x.record_date}</td><td>${N(x.feed_kg).toFixed(2)}</td><td>${money(x.medicine_cost)}</td><td>${money(x.bedding_cost)}</td><td>${money(x.electricity_cost)}</td><td>${money(x.water_cost)}</td><td>${money(x.labor_cost)}</td><td>${money(x.other_cost)}</td></tr>`).join('')}</table></div>`)}
function reports(){const a=C.batches;$('content').innerHTML=`<div class="card"><h3>Звіти</h3><p class="muted">Професійний звіт по партії з поголів'ям, зважуваннями, кормом, витратами, доходом, собівартістю та прибутком.</p><div class="grid g2">${a.map(b=>`<div class="card"><b>${esc(b.name)}</b><div class="muted">${b.kind==='broiler'?'Бройлер':'Несучка'} · ${heads(b)} гол.</div><button class="primary" style="margin-top:8px" onclick="report('${b.id}')">Відкрити звіт</button></div>`).join('')}</div></div>`}
function settings(){$('content').innerHTML=`<div class="card"><h3>Налаштування</h3><p>Користувач: ${esc(user?.email||'')}</p><p class="muted">Всі форми в FERMA PRO v4 підтримують редагування. Після зміни даних показники перераховуються з поточної історії.</p><button class="secondary" onclick="seedPhases()">Додати стандартні 6 фаз, якщо їх немає</button></div>`}async function seedPhases(){const names=[['STARTER',1,14,500,45],['GROWER 1',15,20,1000,90],['GROWER 2',21,28,1500,115],['GROWER 3',29,35,2100,145],['FINISHER 1',36,42,2800,170],['FINISHER 2',43,9999,4500,190]];for(let i=0;i<names.length;i++){const [name,from,to,w,f]=names[i];if(!C.phases.some(p=>p.kind==='broiler'&&p.name===name))await db.from('feed_phases').insert({user_id:user.id,kind:'broiler',name,from_day:from,to_day:to,recommended_weight_g:w,recommended_feed_g_head:f,sort_order:i+1})}await refresh();alert('Готово. Стандартні 6 фаз перевірено/додано.')}async function del(table,id){if(!confirm('Видалити запис?'))return;const r=await db.from(table).delete().eq('id',id);if(r.error)return alert(r.error.message);await refresh()}
</script></body></html>
