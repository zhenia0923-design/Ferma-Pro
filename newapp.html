<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FERMA PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font:14px system-ui;background:#f3f5f7;color:#17202a}button,input,select,textarea{font:inherit}button{cursor:pointer}.nav{position:fixed;inset:0 auto 0 0;width:220px;background:#17202a;color:white;padding:12px;box-sizing:border-box}.nav button{display:block;width:100%;border:0;background:transparent;color:#ddd;text-align:left;padding:10px;border-radius:8px}.nav button:hover,.nav .on{background:#365314;color:white}.main{margin-left:220px;padding:18px;max-width:1600px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.right{margin-left:auto}.muted{color:#6b7280}.stat{font-size:24px;font-weight:900}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:8px}.primary,.secondary,.danger{border:0;border-radius:8px;padding:9px 12px;font-weight:700}.primary{background:#166534;color:white}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:7px;border-bottom:1px solid #e5e7eb;text-align:left}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:12px}.modal>div{background:white;border-radius:14px;width:min(1050px,100%);max-height:94vh;overflow:auto;padding:18px}.hidden{display:none!important}@media(max-width:800px){.nav{position:static;width:100%;display:flex;overflow:auto}.nav button{min-width:max-content}.main{margin:0}.g4,.g2{grid-template-columns:1fr}}@media print{.nav,.top,.noPrint{display:none}.main{margin:0}.card{border:0}}</style></head><body><nav class="nav"><b>🌾 FERMA PRO</b><button data-p="dashboard">📊 Головна</button><button data-p="broilers">🐥 Бройлери</button><button data-p="layers">🥚 Несучки</button><button data-p="warehouse">📦 Склад</button><button data-p="medicines">💊 Ліки</button><button data-p="recipes">🌾 Рецепти</button><button data-p="finance">💰 Фінанси</button><button data-p="reports">📑 Звіти</button><button data-p="settings">⚙️ Налаштування</button><button id="logout">🚪 Вийти</button></nav><main class="main"><div class="top row"><div><h2 id="title">Головна</h2><span class="muted">Бройлери + кури-несучки</span></div><button class="secondary noPrint" id="refresh">↻ Оновити</button></div><div id="content"></div></main><div id="modal" class="modal hidden"><div id="mb"></div></div><script>'use strict';const U='https://zfqekerozvjrpauqiqln.supabase.co',K='sb_publishable_HO1JIwKs8dkUNtKu7UuZUg_KGCjUsVp',db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-zfqekerozvjrpauqiqln-auth-token'}});let user,page='dashboard';const C={batches:[],events:[],weights:[],daily:[],eggs:[],eggSales:[],items:[],moves:[],meds:[],treat:[],fin:[],recipes:[],lines:[],phases:[]},$=x=>document.getElementById(x),N=x=>Number.isFinite(Number(x))?Number(x):0,D=()=>new Date().toISOString().slice(0,10),M=x=>N(x).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' грн',E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function modal(h){$('mb').innerHTML=h;$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden')}$('modal').onclick=e=>e.target.id==='modal'&&close();async function get(t,o){let q=db.from(t).select('*');if(o)q=q.order(o);const r=await q;return r.error?(console.error(t,r.error),[]):r.data||[]}async function load(){const m=[['batches','placed_at','batches'],['livestock_events','event_date','events'],['broiler_weights','weigh_date','weights'],['daily_records','record_date','daily'],['egg_records','record_date','eggs'],['egg_sales','sale_date','eggSales'],['warehouse_items','name','items'],['warehouse_movements','movement_date','moves'],['medicines','name','meds'],['treatments','treatment_date','treat'],['finance','operation_date','fin'],['feed_recipes','created_at','recipes'],['feed_recipe_lines','ingredient_name','lines'],['feed_phases','sort_order','phases']];for(const [t,o,k]of m)C[k]=await get(t,o);render()}async function save(t,p,id){const r=id?await db.from(t).update(p).eq('id',id).eq('user_id',user.id):await db.from(t).insert({...p,user_id:user.id});if(r.error)return alert(r.error.message);await load();return 1}async function del(t,id){if(confirm('Видалити запис?')){const r=await db.from(t).delete().eq('id',id).eq('user_id',user.id);if(r.error)alert(r.error.message);else load()}}function heads(b){let n=N(b.initial_heads);C.events.filter(x=>x.batch_id===b.id).forEach(e=>{if(['mortality','sale','home','cull'].includes(e.event_type))n-=N(e.heads);if(e.event_type==='adjustment')n+=N(e.heads)});return Math.max(0,Math.round(n))}function age(b){return Math.max(1,Math.floor((new Date()-new Date(b.placed_at))/86400000)+1)}function ws(id){return C.weights.filter(x=>x.batch_id===id).sort((a,b)=>new Date(a.weigh_date)-new Date(b.weigh_date))}function lw(id){let a=ws(id);return a[a.length-1]}function fw(id){return ws(id)[0]}function feed(id){return C.daily.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.feed_kg),0)}function dcost(id){return C.daily.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.water_cost)+N(x.medicine_cost)+N(x.bedding_cost)+N(x.electricity_cost)+N(x.labor_cost)+N(x.other_cost),0)}function mcost(id){return C.treat.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.total_cost),0)}function income(id){return C.events.filter(x=>x.batch_id===id&&x.event_type==='sale').reduce((s,x)=>s+N(x.total_amount),0)+C.eggSales.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.total_amount),0)}function fcost(id){return C.fin.filter(x=>x.batch_id===id&&x.operation_type==='expense').reduce((s,x)=>s+N(x.amount),0)}function cost(id){let b=C.batches.find(x=>x.id===id);return N(b?.initial_heads)*N(b?.chick_price)+fcost(id)+dcost(id)+mcost(id)}function gain(id){let b=C.batches.find(x=>x.id===id),a=fw(id),z=lw(id);return !b||!a||!z||a.id===z.id?0:Math.max(0,heads(b)*N(z.average_weight_g)/1000-N(b.initial_heads)*N(a.average_weight_g)/1000)}function fcr(id){let g=gain(id);return g?feed(id)/g:0}function phase(b){return C.phases.find(p=>p.kind==='broiler'&&age(b)>=N(p.from_day)&&age(b)<=N(p.to_day))}function render(){const n={dashboard:'Головна',broilers:'Бройлери',layers:'Несучки',warehouse:'Склад',medicines:'Ліки',recipes:'Рецепти',finance:'Фінанси',reports:'Звіти',settings:'Налаштування'};$('title').textContent=n[page];document.querySelectorAll('.nav button[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===page));({dashboard,broilers,layers,warehouse,medicines,recipes,finance,reports,settings}[page])()}document.querySelectorAll('.nav button[data-p]').forEach(x=>x.onclick=()=>{page=x.dataset.p;render()});$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};
function dashboard(){let a=C.batches.filter(b=>b.status!=='archived'),br=a.filter(b=>b.kind==='broiler'),la=a.filter(b=>b.kind==='layer'),inc=C.fin.filter(x=>x.operation_type==='income').reduce((s,x)=>s+N(x.amount),0)+C.eggSales.reduce((s,x)=>s+N(x.total_amount),0),ex=C.fin.filter(x=>x.operation_type==='expense').reduce((s,x)=>s+N(x.amount),0);$('content').innerHTML=`<div class="grid g4"><div class="card">🐥 Бройлери<div class="stat">${br.reduce((s,b)=>s+heads(b),0)}</div>голів</div><div class="card">🥚 Несучки<div class="stat">${la.reduce((s,b)=>s+heads(b),0)}</div>голів</div><div class="card">💰 Дохід<div class="stat">${M(inc)}</div></div><div class="card">📉 Витрати<div class="stat">${M(ex)}</div></div></div><div class="grid g2">${br.map(b=>`<div class="card"><div class="row"><b>${E(b.name)}</b><span class="right">${heads(b)} гол.</span></div><p>${age(b)} день · ${E(phase(b)?.name||'')} · вага ${lw(b.id)?N(lw(b.id).average_weight_g).toFixed(0)+' г':'—'}</p><small>Корм ${feed(b.id).toFixed(2)} кг · FCR ${fcr(b.id)?fcr(b.id).toFixed(3):'—'} · витрати ${M(cost(b.id))}</small></div>`).join('')}</div>`}
function list(kind){let a=C.batches.filter(b=>b.kind===kind);$('content').innerHTML=`<button class="primary" onclick="batchForm('${kind}')">＋ Нова партія</button><div class="grid g2">${a.map(b=>`<div class="card"><div class="row"><h3>${E(b.name)}</h3><span class="right">${heads(b)} гол.</span></div><div class="muted">${E(b.breed||'')} · ${b.placed_at} · ${age(b)} день</div><p>${kind==='broiler'?'Вага: '+(lw(b.id)?N(lw(b.id).average_weight_g).toFixed(0)+' г':'—')+' · FCR: '+(fcr(b.id)?fcr(b.id).toFixed(3):'—'):'Яйця: '+C.eggs.filter(x=>x.batch_id===b.id).reduce((s,x)=>s+N(x.good_eggs),0)}</p><button class="primary" onclick="detail('${b.id}')">Облік</button> <button class="secondary" onclick="batchForm('${kind}','${b.id}')">Ред.</button> <button class="danger" onclick="del('batches','${b.id}')">×</button></div>`).join('')||'<div class="card">Немає партій.</div>'}</div>`}function broilers(){list('broiler')}function layers(){list('layer')}
function batchForm(kind,id){let b=id&&C.batches.find(x=>x.id===id);modal(`<h3>${b?'Редагувати':'Нова'} партія</h3><form id="f" class="grid g2"><div class="field"><label>Назва</label><input name="name" required value="${E(b?.name||'')}"></div><div class="field"><label>Порода</label><input name="breed" value="${E(b?.breed||'')}"></div><div class="field"><label>Дата посадки</label><input name="placed_at" type="date" required value="${b?.placed_at||D()}"></div><div class="field"><label>Початкова кількість</label><input name="initial_heads" type="number" min="1" required value="${N(b?.initial_heads)||''}"></div><div class="field"><label>Ціна, грн/гол</label><input name="chick_price" type="number" step=".01" value="${N(b?.chick_price)}"></div><div class="field"><label>Стартова вага, г</label><input name="start_weight_g" type="number" step=".1" value="${N(b?.start_weight_g)||''}"></div><div class="field"><label>Статус</label><select name="status"><option value="active">Активна</option><option value="completed">Завершена</option><option value="archived">Архів</option></select></div><div class="field"><label>Примітки</label><textarea name="notes">${E(b?.notes||'')}</textarea></div><button class="primary">Зберегти</button></form>`);$('f').status.value=b?.status||'active';$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.kind=kind;['initial_heads','chick_price','start_weight_g'].forEach(k=>p[k]=N(p[k]));await save('batches',p,id);close()}}
function detail(id){let b=C.batches.find(x=>x.id===id);modal(`<div class="row"><h2>${E(b.name)}</h2><button class="secondary right" onclick="close()">Закрити</button></div><p>${E(b.breed||'')} · ${b.placed_at} · ${heads(b)} голів</p><div class="row"><button class="primary" onclick="detailTab('${id}','heads')">Поголів'я</button>${b.kind==='broiler'?'<button class="primary" onclick="detailTab(\''+id+'\',\'weight\')">Зважування</button>':'<button class="primary" onclick="detailTab(\''+id+'\',\'eggs\')">Яйця</button>'}<button class="primary" onclick="detailTab('${id}','daily')">Корм/витрати</button><button class="primary" onclick="detailTab('${id}','sales')">Продаж</button></div><div id="dt"></div>`);detailTab(id,'heads')}function detailTab(id,t){let b=C.batches.find(x=>x.id===id),h='';if(t==='heads')h=`<button class="primary" onclick="eventForm('${id}','mortality')">＋ Падіж</button> <button class="primary" onclick="eventForm('${id}','cull')">＋ Вибракування</button> <button class="primary" onclick="eventForm('${id}','sale')">＋ Продаж</button> <button class="primary" onclick="eventForm('${id}','home')">＋ Додому</button><table class="table"><tr><th>Дата</th><th>Тип</th><th>Голови</th><th>Сума</th><th></th></tr>${C.events.filter(x=>x.batch_id===id).map(x=>`<tr><td>${x.event_date}</td><td>${E(x.event_type)}</td><td>${N(x.heads)}</td><td>${M(x.total_amount)}</td><td><button class="secondary" onclick="eventForm('${id}','${x.event_type}','${x.id}')">Ред.</button> <button class="danger" onclick="del('livestock_events','${x.id}')">×</button></td></tr>`).join('')}</table><b>Поточне поголів'я: ${heads(b)}</b>`;if(t==='weight')h=`<button class="primary" onclick="weightForm('${id}')">＋ Зважування</button><table class="table"><tr><th>Дата</th><th>Вибірка</th><th>Середня</th><th>Маса</th><th></th></tr>${ws(id).map(x=>`<tr><td>${x.weigh_date}</td><td>${N(x.sampled_heads)}</td><td>${N(x.average_weight_g)} г</td><td>${(heads(b)*N(x.average_weight_g)/1000).toFixed(2)} кг</td><td><button class="secondary" onclick="weightForm('${id}','${x.id}')">Ред.</button> <button class="danger" onclick="del('broiler_weights','${x.id}')">×</button></td></tr>`).join('')}</table><p>Приріст ${gain(id).toFixed(2)} кг · FCR ${fcr(id)?fcr(id).toFixed(3):'—'} · Фаза ${E(phase(b)?.name||'')}</p>`;if(t==='eggs')h=`<button class="primary" onclick="eggForm('${id}')">＋ Запис яєць</button><table class="table"><tr><th>Дата</th><th>Добрі</th><th>Биті</th><th></th></tr>${C.eggs.filter(x=>x.batch_id===id).map(x=>`<tr><td>${x.record_date}</td><td>${N(x.good_eggs)}</td><td>${N(x.broken_eggs)}</td><td><button class="secondary" onclick="eggForm('${id}','${x.id}')">Ред.</button> <button class="danger" onclick="del('egg_records','${x.id}')">×</button></td></tr>`).join('')}</table>`;if(t==='daily')h=`<button class="primary" onclick="dailyForm('${id}')">＋ Денний запис</button> <button class="secondary" onclick="treatForm('${id}')">💊 Лікування</button><table class="table"><tr><th>Дата</th><th>Корм</th><th>Вода</th><th>Витрати</th><th></th></tr>${C.daily.filter(x=>x.batch_id===id).map(x=>`<tr><td>${x.record_date}</td><td>${N(x.feed_kg)} кг</td><td>${N(x.water_l)} л</td><td>${M(N(x.water_cost)+N(x.medicine_cost)+N(x.bedding_cost)+N(x.electricity_cost)+N(x.labor_cost)+N(x.other_cost))}</td><td><button class="secondary" onclick="dailyForm('${id}','${x.id}')">Ред.</button> <button class="danger" onclick="del('daily_records','${x.id}')">×</button></td></tr>`).join('')}</table><p>Корм ${feed(id).toFixed(2)} кг · лікування ${M(mcost(id))} · собівартість ${M(cost(id))}</p>`;if(t==='sales')h=`<button class="primary" onclick="eventForm('${id}','sale')">＋ Продаж птиці</button>${b.kind==='layer'?'<button class="primary" onclick="eggSaleForm(\''+id+'\')">＋ Продаж яєць</button>':''}<p>Дохід ${M(income(id))} · прибуток ${M(income(id)-cost(id))}</p>`;$('dt').innerHTML=h}
function weightForm(bid,id){let x=id&&C.weights.find(w=>w.id===id);modal(`<h3>Зважування</h3><form id="f" class="grid g2"><div class="field"><label>Дата</label><input name="weigh_date" type="date" value="${x?.weigh_date||D()}"></div><div class="field"><label>Зважено голів</label><input name="sampled_heads" type="number" min="1" value="${N(x?.sampled_heads)||''}"></div><div class="field"><label>Середня вага, г</label><input name="average_weight_g" type="number" min="0" step=".1" value="${N(x?.average_weight_g)||''}"></div><button class="primary">Зберегти</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.sampled_heads=N(p.sampled_heads);p.average_weight_g=N(p.average_weight_g);await save('broiler_weights',p,id);close();detail(bid)}}function eventForm(bid,type,id){let x=id&&C.events.find(e=>e.id===id),b=C.batches.find(b=>b.id===bid);modal(`<h3>${type}</h3><form id="f" class="grid g2"><div class="field"><label>Дата</label><input name="event_date" type="date" value="${x?.event_date||D()}"></div><div class="field"><label>Голови</label><input name="heads" type="number" min="1" value="${N(x?.heads)||''}"></div><div class="field"><label>Вага, кг</label><input name="weight_kg" type="number" min="0" step=".001" value="${N(x?.weight_kg)}"></div><div class="field"><label>Ціна, грн/кг</label><input name="price_per_kg" type="number" min="0" step=".01" value="${N(x?.price_per_kg)}"></div><div class="field"><label>Клієнт</label><input name="client" value="${E(x?.client||'')}"></div><button class="primary">Зберегти</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.event_type=type;p.heads=N(p.heads);p.weight_kg=N(p.weight_kg);p.price_per_kg=N(p.price_per_kg);p.total_amount=p.weight_kg*p.price_per_kg;let available=heads(b)+(x?N(x.heads):0);if(p.heads>available)return alert('Недостатньо поголів’я.');await save('livestock_events',p,id);if(type==='sale'&&!id&&p.total_amount)await save('finance',{operation_type:'income',operation_date:p.event_date,category:'broiler_sale',amount:p.total_amount,batch_id:bid,description:'Продаж птиці'});close();detail(bid)}}
function dailyForm(bid,id){let x=id&&C.daily.find(d=>d.id===id);modal(`<h3>Денний облік</h3><form id="f" class="grid g4"><div class="field"><label>Дата</label><input name="record_date" type="date" value="${x?.record_date||D()}"></div><div class="field"><label>Корм кг</label><input name="feed_kg" type="number" min="0" step=".001" value="${N(x?.feed_kg)}"></div><div class="field"><label>Вода л</label><input name="water_l" type="number" min="0" step=".001" value="${N(x?.water_l)}"></div><div class="field"><label>Вода грн</label><input name="water_cost" type="number" min="0" step=".01" value="${N(x?.water_cost)}"></div><div class="field"><label>Ліки грн</label><input name="medicine_cost" type="number" min="0" step=".01" value="${N(x?.medicine_cost)}"></div><div class="field"><label>Підстилка грн</label><input name="bedding_cost" type="number" min="0" step=".01" value="${N(x?.bedding_cost)}"></div><div class="field"><label>Електрика грн</label><input name="electricity_cost" type="number" min="0" step=".01" value="${N(x?.electricity_cost)}"></div><div class="field"><label>Зарплата грн</label><input name="labor_cost" type="number" min="0" step=".01" value="${N(x?.labor_cost)}"></div><div class="field"><label>Інше грн</label><input name="other_cost" type="number" min="0" step=".01" value="${N(x?.other_cost)}"></div><button class="primary">Зберегти</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;['feed_kg','water_l','water_cost','medicine_cost','bedding_cost','electricity_cost','labor_cost','other_cost'].forEach(k=>p[k]=N(p[k]));await save('daily_records',p,id);close();detail(bid)}}function eggForm(bid,id){let x=id&&C.eggs.find(e=>e.id===id);modal(`<h3>Яйця</h3><form id="f" class="grid g2"><div class="field"><label>Дата</label><input name="record_date" type="date" value="${x?.record_date||D()}"></div><div class="field"><label>Добрі яйця</label><input name="good_eggs" type="number" min="0" value="${N(x?.good_eggs)}"></div><div class="field"><label>Биті</label><input name="broken_eggs" type="number" min="0" value="${N(x?.broken_eggs)}"></div><button class="primary">Зберегти</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.good_eggs=N(p.good_eggs);p.broken_eggs=N(p.broken_eggs);await save('egg_records',p,id);close();detail(bid)}}function eggSaleForm(bid,id){let x=id&&C.eggSales.find(e=>e.id===id);modal(`<h3>Продаж яєць</h3><form id="f" class="grid g2"><div class="field"><label>Дата</label><input name="sale_date" type="date" value="${x?.sale_date||D()}"></div><div class="field"><label>Кількість</label><input name="quantity" type="number" min="1" value="${N(x?.quantity)||''}"></div><div class="field"><label>Ціна/яйце</label><input name="price_per_egg" type="number" min="0" step=".01" value="${N(x?.price_per_egg)||''}"></div><button class="primary">Зберегти</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.quantity=N(p.quantity);p.price_per_egg=N(p.price_per_egg);await save('egg_sales',p,id);if(!id)await save('finance',{operation_type:'income',operation_date:p.sale_date,category:'egg_sales',amount:p.quantity*p.price_per_egg,batch_id:bid,description:'Продаж яєць'});close();detail(bid)}}
function warehouse(){let bal=i=>C.moves.filter(m=>m.item_id===i.id).reduce((s,m)=>s+(m.movement_type==='in'||m.movement_type==='adjustment'&&m.adjustment_direction==='in'?N(m.quantity):-N(m.quantity)),0);$('content').innerHTML=`<button class="primary" onclick="itemForm()">＋ Позиція</button> <button class="secondary" onclick="moveForm()">＋ Рух</button><table class="table"><tr><th>Тип</th><th>Назва</th><th>Од.</th><th>Залишок</th><th>Ціна</th><th></th></tr>${C.items.map(i=>`<tr><td>${E(i.item_type)}</td><td>${E(i.name)}</td><td>${E(i.unit)}</td><td>${bal(i).toFixed(3)}</td><td>${M(i.price_per_unit)}</td><td><button class="secondary" onclick="itemForm('${i.id}')">Ред.</button> <button class="danger" onclick="del('warehouse_items','${i.id}')">×</button></td></tr>`).join('')}</table>`}function itemForm(id){let x=id&&C.items.find(i=>i.id===id);modal(`<h3>Склад</h3><form id="f" class="grid g2"><div class="field"><label>Тип</label><select name="item_type"><option value="feed">Корм</option><option value="medicine">Ліки</option><option value="bedding">Підстилка</option><option value="other">Інше</option></select></div><div class="field"><label>Назва</label><input name="name" required value="${E(x?.name||'')}"></div><div class="field"><label>Одиниця</label><input name="unit" value="${E(x?.unit||'кг')}"></div><div class="field"><label>Ціна</label><input name="price_per_unit" type="number" min="0" step=".0001" value="${N(x?.price_per_unit)}"></div><div class="field"><label>Постачальник</label><input name="supplier" value="${E(x?.supplier||'')}"></div><button class="primary">Зберегти</button></form>`);$('f').item_type.value=x?.item_type||'feed';$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.price_per_unit=N(p.price_per_unit);await save('warehouse_items',p,id);close()}}function moveForm(){modal(`<h3>Рух складу</h3><form id="f" class="grid g2"><div class="field"><label>Позиція</label><select name="item_id" required>${C.items.map(i=>`<option value="${i.id}">${E(i.name)}</option>`).join('')}</select></div><div class="field"><label>Тип</label><select name="movement_type"><option value="in">Надходження</option><option value="use">Використання</option><option value="sale">Продаж</option><option value="home">Додому</option><option value="adjustment">Коригування</option></select></div><div class="field"><label>Дата</label><input name="movement_date" type="date" value="${D()}"></div><div class="field"><label>Кількість</label><input name="quantity" type="number" min=".001" step=".001" required></div><div class="field"><label>Ціна</label><input name="unit_price" type="number" min="0" step=".0001"></div><div class="field"><label>Партія</label><select name="batch_id"><option value="">Без партії</option>${C.batches.map(b=>`<option value="${b.id}">${E(b.name)}</option>`).join('')}</select></div><button class="primary">Зберегти</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.quantity=N(p.quantity);p.unit_price=N(p.unit_price);p.total_amount=p.quantity*p.unit_price;if(p.movement_type==='adjustment')p.adjustment_direction=confirm('Збільшити залишок?')?'in':'out';let bal=C.moves.filter(m=>m.item_id===p.item_id).reduce((s,m)=>s+(m.movement_type==='in'||m.movement_type==='adjustment'&&m.adjustment_direction==='in'?N(m.quantity):-N(m.quantity)),0);if(['use','sale','home'].includes(p.movement_type)&&p.quantity>bal)return alert('Недостатньо на складі.');await save('warehouse_movements',p);close()}}
function medicines(){$('content').innerHTML=`<button class="primary" onclick="medForm()">＋ Ліки</button><table class="table"><tr><th>Назва</th><th>Концентрація</th><th>Форма</th><th>Упаковка</th><th>Ціна</th><th></th></tr>${C.meds.map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.concentration||'')}</td><td>${E(x.form||'')}</td><td>${N(x.package_ml)||N(x.package_g)}</td><td>${M(x.price)}</td><td><button class="secondary" onclick="medForm('${x.id}')">Ред.</button> <button class="danger" onclick="del('medicines','${x.id}')">×</button></td></tr>`).join('')}</table><h3>Лікування</h3><table class="table"><tr><th>Дата</th><th>Партія</th><th>Препарат</th><th>Фактично</th><th>Вартість</th></tr>${C.treat.map(x=>`<tr><td>${x.treatment_date}</td><td>${E(C.batches.find(b=>b.id===x.batch_id)?.name||'')}</td><td>${E(x.medicine_name)}</td><td>${N(x.used_qty)} ${E(x.unit)}</td><td>${M(x.total_cost)}</td></tr>`).join('')}</table>`}function medForm(id){let x=id&&C.meds.find(m=>m.id===id);modal(`<h3>Ліки</h3><form id="f" class="grid g2"><div class="field"><label>Назва</label><input name="name" required value="${E(x?.name||'')}"></div><div class="field"><label>Концентрація</label><input name="concentration" value="${E(x?.concentration||'')}"></div><div class="field"><label>Форма</label><input name="form" value="${E(x?.form||'')}"></div><div class="field"><label>Мл/уп.</label><input name="package_ml" type="number" step=".001" value="${N(x?.package_ml)}"></div><div class="field"><label>Г/уп.</label><input name="package_g" type="number" step=".001" value="${N(x?.package_g)}"></div><div class="field"><label>Ціна</label><input name="price" type="number" step=".01" value="${N(x?.price)}"></div><div class="field"><label>Постачальник</label><input name="supplier" value="${E(x?.supplier||'')}"></div><div class="field"><label>Лот</label><input name="lot" value="${E(x?.lot||'')}"></div><div class="field"><label>Термін</label><input name="expiry_date" type="date" value="${x?.expiry_date||''}"></div><button class="primary">Зберегти</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));['package_ml','package_g','price'].forEach(k=>p[k]=N(p[k]));await save('medicines',p,id);close()}}function treatForm(bid,id){let x=id&&C.treat.find(t=>t.id===id);modal(`<h3>Лікування</h3><form id="f" class="grid g2"><div class="field"><label>Дата</label><input name="treatment_date" type="date" value="${x?.treatment_date||D()}"></div><div class="field"><label>Препарат</label><select name="medicine_id"><option value="">Вручну</option>${C.meds.map(m=>`<option value="${m.id}">${E(m.name)} ${E(m.concentration||'')}</option>`).join('')}</select></div><div class="field"><label>Назва</label><input name="medicine_name" required value="${E(x?.medicine_name||'')}"></div><div class="field"><label>Дозування</label><input name="dosage" value="${E(x?.dosage||'')}"></div><div class="field"><label>Птахів</label><input name="birds" type="number" min="0" value="${N(x?.birds)}"></div><div class="field"><label>Фактично</label><input name="used_qty" type="number" min="0" step=".001" value="${N(x?.used_qty)}"></div><div class="field"><label>Одиниця</label><select name="unit"><option>мл</option><option>г</option><option>л</option></select></div><div class="field"><label>Ціна/од.</label><input name="price_per_unit" type="number" min="0" step=".0001" value="${N(x?.price_per_unit)}"></div><button class="primary">Зберегти</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.birds=N(p.birds);p.used_qty=N(p.used_qty);p.price_per_unit=N(p.price_per_unit);await save('treatments',p,id);close()}}
function recipes(){$('content').innerHTML=`<button class="primary" onclick="recipeForm()">＋ Рецепт</button><div class="grid g2">${C.recipes.map(r=>{let l=C.lines.filter(x=>x.recipe_id===r.id),kg=l.reduce((s,x)=>s+N(x.kg),0),sum=l.reduce((s,x)=>s+N(x.kg)*N(x.price_per_kg),0);return `<div class="card"><h3>${E(r.name)}</h3><table class="table"><tr><th>Інгредієнт</th><th>кг</th><th>%</th></tr>${l.map(x=>`<tr><td>${E(x.ingredient_name)}</td><td>${N(x.kg)}</td><td>${kg?(N(x.kg)/kg*100).toFixed(1):0}</td></tr>`).join('')}</table><b>${kg.toFixed(3)} кг · ${M(sum/kg||0)}/кг</b><p><button class="secondary" onclick="recipeForm('${r.id}')">Ред.</button> <button class="danger" onclick="del('feed_recipes','${r.id}')">×</button></p></div>`}).join('')}</div>`}function recipeForm(id){let r=id&&C.recipes.find(x=>x.id===id),l=id?C.lines.filter(x=>x.recipe_id===id):[{}];modal(`<h3>Рецепт</h3><form id="f"><div class="grid g2"><div class="field"><label>Назва</label><input name="name" required value="${E(r?.name||'')}"></div><div class="field"><label>Фаза</label><input name="phase" value="${E(r?.phase||'')}"></div></div><div id="ls">${l.map(x=>`<div class="line row"><input name="ingredient_name" placeholder="Інгредієнт" value="${E(x.ingredient_name||'')}"><input name="kg" type="number" min=".001" step=".001" placeholder="кг" value="${N(x.kg)||''}"><input name="price_per_kg" type="number" min="0" step=".0001" placeholder="грн/кг" value="${N(x.price_per_kg)||''}"></div>`).join('')}</div><button type="button" class="secondary" onclick="addLine()">＋ Інгредієнт</button> <button class="primary">Зберегти</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));if(id)await db.from('feed_recipe_lines').delete().eq('recipe_id',id).eq('user_id',user.id);await save('feed_recipes',p,id);let r2=id?C.recipes.find(x=>x.id===id):C.recipes.find(x=>x.name===p.name);let rows=[...$('ls').children].map(x=>({recipe_id:r2.id,user_id:user.id,ingredient_name:x.querySelector('[name=ingredient_name]').value,kg:N(x.querySelector('[name=kg]').value),price_per_kg:N(x.querySelector('[name=price_per_kg]').value)})).filter(x=>x.ingredient_name&&x.kg>0);if(rows.length)await db.from('feed_recipe_lines').insert(rows);await load();close()}}function addLine(){$('ls').insertAdjacentHTML('beforeend','<div class="line row"><input name="ingredient_name" placeholder="Інгредієнт"><input name="kg" type="number" min=".001" step=".001" placeholder="кг"><input name="price_per_kg" type="number" min="0" step=".0001" placeholder="грн/кг"></div>')}
function finance(){$('content').innerHTML=`<button class="primary" onclick="finForm()">＋ Операція</button><table class="table"><tr><th>Дата</th><th>Тип</th><th>Категорія</th><th>Партія</th><th>Сума</th><th></th></tr>${C.fin.map(x=>`<tr><td>${x.operation_date}</td><td>${x.operation_type}</td><td>${E(x.category)}</td><td>${E(C.batches.find(b=>b.id===x.batch_id)?.name||'')}</td><td>${M(x.amount)}</td><td><button class="secondary" onclick="finForm('${x.id}')">Ред.</button> <button class="danger" onclick="del('finance','${x.id}')">×</button></td></tr>`).join('')}</table>`}function finForm(id){let x=id&&C.fin.find(f=>f.id===id);modal(`<h3>Фінанси</h3><form id="f" class="grid g2"><div class="field"><label>Тип</label><select name="operation_type"><option value="income">Дохід</option><option value="expense">Витрата</option></select></div><div class="field"><label>Дата</label><input name="operation_date" type="date" value="${x?.operation_date||D()}"></div><div class="field"><label>Категорія</label><input name="category" required value="${E(x?.category||'other')}"></div><div class="field"><label>Сума</label><input name="amount" type="number" min="0" step=".01" value="${N(x?.amount)}"></div><div class="field"><label>Партія</label><select name="batch_id"><option value="">Без партії</option>${C.batches.map(b=>`<option value="${b.id}">${E(b.name)}</option>`).join('')}</select></div><div class="field"><label>Опис</label><input name="description" value="${E(x?.description||'')}"></div><button class="primary">Зберегти</button></form>`);$('f').operation_type.value=x?.operation_type||'expense';$('f').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.amount=N(p.amount);await save('finance',p,id);close()}}function reports(){$('content').innerHTML=`<div class="row noPrint"><button class="primary" onclick="print()">🖨️ Друк / PDF</button></div><div class="card"><h1>FERMA PRO • Агро-звіт</h1><p>Дата ${D()}</p><table class="table"><tr><th>Партія</th><th>Тип</th><th>Початок</th><th>Зараз</th><th>Вік</th><th>Вага/яйця</th><th>Корм</th><th>FCR</th><th>Витрати</th><th>Дохід</th><th>Прибуток</th></tr>${C.batches.filter(b=>b.status!=='archived').map(b=>`<tr><td>${E(b.name)}</td><td>${b.kind}</td><td>${N(b.initial_heads)}</td><td>${heads(b)}</td><td>${age(b)}</td><td>${b.kind==='broiler'?(lw(b.id)?N(lw(b.id).average_weight_g).toFixed(0)+' г':'—'):C.eggs.filter(x=>x.batch_id===b.id).reduce((s,x)=>s+N(x.good_eggs),0)+' шт'}</td><td>${feed(b.id).toFixed(2)}</td><td>${b.kind==='broiler'?(fcr(b.id)?fcr(b.id).toFixed(3):'—'):'—'}</td><td>${M(cost(b.id))}</td><td>${M(income(b.id))}</td><td>${M(income(b.id)-cost(b.id))}</td></tr>`).join('')}</table><h2>Склад</h2><table class="table"><tr><th>Назва</th><th>Тип</th><th>Залишок</th></tr>${C.items.map(i=>`<tr><td>${E(i.name)}</td><td>${E(i.item_type)}</td><td>${C.moves.filter(m=>m.item_id===i.id).reduce((s,m)=>s+(m.movement_type==='in'?N(m.quantity):-N(m.quantity)),0).toFixed(3)} ${E(i.unit)}</td></tr>`).join('')}</table></div>`}function settings(){$('content').innerHTML=`<div class="card"><h3>Налаштування</h3><p>Користувач: ${E(user.email)}</p><p>Supabase: zfqekerozvjrpauqiqln</p><p class="muted">Дані ізольовані RLS. Усі основні записи можна редагувати та видаляти.</p></div>`}(async()=>{const s=await db.auth.getSession();user=s.data.session?.user;if(!user)return location.href='login.html';await load()})();</script></body></html>
