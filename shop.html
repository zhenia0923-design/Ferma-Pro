<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#166534"><title>Магазин • FERMA PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e7eb;padding:14px max(16px,env(safe-area-inset-left))}.topin{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.brand{font-size:20px;font-weight:900}.right{margin-left:auto}.wrap{max-width:1100px;margin:auto;padding:18px 16px 40px}.hero{background:#166534;color:#fff;border-radius:18px;padding:22px;margin-bottom:18px}.hero h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 4px #00000012}.photo,.placeholder{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#f3f4f6;display:grid;place-items:center;font-size:48px}.muted{color:#6b7280;font-size:13px}.price{font-size:20px;font-weight:900}.pill{padding:5px 8px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:12px}.row{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#166534;color:#fff}.secondary{background:#e5e7eb;color:#111827}.qty{width:90px;padding:10px;border:1px solid #d1d5db;border-radius:10px}.cart{position:fixed;right:16px;bottom:16px;z-index:10}.modalbg{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}@media(min-width:700px){.modalbg{align-items:center}.modal{border-radius:20px}}
</style></head><body><header class="top"><div class="topin"><div class="brand">🌾 FERMA PRO • Магазин</div><button class="btn secondary right" onclick="showCart()">🛒 Кошик <span id="count">0</span></button></div></header><main class="wrap"><section class="hero"><h1>Магазин</h1><div>Оберіть товар, вкажіть кількість та оформіть замовлення без входу в акаунт.</div></section><div id="msg" class="muted">Завантаження товарів…</div><div id="products" class="grid"></div></main><div id="modalbg" class="modalbg" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div><script>(async()=>{const U='https://zfqekerozvjrpauqiqln.supabase.co',K='sb_publishable_HO1JIwKs8dkUNtKu7UuZUg_KGCjUsVpK';const db=supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false}});let products=[],cart=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const num=x=>Number(x)||0;const money=x=>num(x).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' грн';function render(){ $('products').innerHTML=products.map(p=>{const made=p.fulfillment_type==='made_to_order';return `<article class="card"><div>${p.image_url?`<img class="photo" src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'<div class="placeholder">🌾</div>'}</div><div class="muted" style="margin-top:10px">${esc(p.category||'')}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||'')}</p><div class="row"><span class="price">${money(p.price)}</span><span class="muted">/ ${esc(p.unit)}</span></div><p class="muted">${made?'Під замовлення':'В наявності: '+num(p.stock_qty)+' '+esc(p.unit)}</p><div class="row"><input class="qty" id="q-${p.id}" type="number" min="0.001" step="0.001" value="1" ${made?'':'max="'+num(p.stock_qty)+'"'}><button class="btn primary right" onclick="add('${p.id}')">Додати</button></div></article>`}).join('')||'<div class="card">Товарів поки немає.</div>';}
window.add= id=>{const p=products.find(x=>x.id===id);if(!p)return;const q=num($('q-'+id).value),made=p.fulfillment_type==='made_to_order';if(q<=0||(!made&&q>num(p.stock_qty)))return alert('Перевірте кількість.');const old=cart.find(x=>x.product_id===id);if(old)old.quantity+=q;else cart.push({product_id:p.id,product_name:p.name,unit:p.unit,quantity:q,unit_price:num(p.price),fulfillment_type:p.fulfillment_type});update();alert('Додано в кошик.');};function update(){$('count').textContent=cart.reduce((s,x)=>s+x.quantity,0);}
window.showCart=()=>{if(!cart.length)return open(`<h2>Кошик порожній</h2><button class="btn secondary" onclick="closeModal()">Закрити</button>`);const total=cart.reduce((s,x)=>s+x.quantity*x.unit_price,0);open(`<h2>🛒 Кошик</h2>${cart.map((x,i)=>`<div class="line"><span>${esc(x.product_name)} × ${x.quantity} ${esc(x.unit)}</span><b>${money(x.quantity*x.unit_price)}</b></div>`).join('')}<h3>Разом: ${money(total)}</h3><button class="btn primary" onclick="checkout()">Оформити замовлення</button> <button class="btn secondary" onclick="closeModal()">Продовжити покупки</button>`)};
window.checkout=()=>{const total=cart.reduce((s,x)=>s+x.quantity*x.unit_price,0);open(`<h2>Оформлення замовлення</h2><div class="field"><label>Ім’я *</label><input id="name" autocomplete="name"></div><div class="field"><label>Телефон *</label><input id="phone" type="tel" autocomplete="tel"></div><div class="field"><label>Адреса / відділення</label><textarea id="addr"></textarea></div><div class="field"><label>Коментар</label><textarea id="comment"></textarea></div><h3>До сплати: ${money(total)}</h3><button class="btn primary" onclick="place()">Сформувати замовлення</button> <button class="btn secondary" onclick="showCart()">Назад</button>`)};
window.place=async()=>{const name=$('name').value.trim(),phone=$('phone').value.trim(),addr=$('addr').value.trim(),comment=$('comment').value.trim();if(!name||!phone)return alert('Вкажіть ім’я та телефон.');const items=cart.map(x=>({product_id:x.product_id,quantity:x.quantity}));const r=await db.rpc('create_shop_order',{p_customer_name:name,p_phone:phone,p_delivery_address:addr,p_comment:comment,p_items:items});if(r.error)return alert(r.error.message);const n=await db.rpc('get_shop_order_number',{p_order_id:r.data});const no=!n.error?n.data:'';cart=[];update();closeModal();await load();open(`<h2>✅ Замовлення сформовано</h2><p>Ваше замовлення <b>${no?'Замовлення '+no:'прийнято'}</b> передано фермі.</p><p class="muted">Для наступного покупця кошик порожній.</p><button class="btn primary" onclick="closeModal()">До магазину</button>`)};
function open(html){$('modal').innerHTML=html;$('modalbg').style.display='flex'}window.closeModal=()=>$('modalbg').style.display='none';async function load(){const r=await db.from('shop_products').select('id,name,description,category,price,unit,stock_qty,image_url,fulfillment_type').eq('is_active',true).order('sort_order').order('name');if(r.error){$('msg').textContent='Не вдалося завантажити товари: '+r.error.message;return}products=r.data||[];$('msg').textContent=products.length?'':'Товарів поки немає.';render()}load();})();</script></body></html>
