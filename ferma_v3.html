const SB_URL='https://axxormlcevusdjfqruib.supabase.co',SB_KEY='sb_publishable_fmFGe67Hi8_nUZC8sKP5xg_piWbDfZi';const sb=supabase.createClient(SB_URL,SB_KEY);let user=null,pageName='dashboard',cache={batches:[],events:[],weights:[],daily:[],items:[],moves:[],meds:[],treatments:[],finance:[],recipes:[],lines:[],phases:[]};const $=id=>document.getElementById(id);const n=v=>Number(v)||0;const money=v=>n(v).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' грн';const date=v=>v||new Date().toISOString().slice(0,10);function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function msg(x){$('authMsg').textContent=x}

async function get(table,order=''){let q=sb.from(table).select('*');if(order)q=q.order(order,{ascending:true});const r=await q;return r.error?[]:(r.data||[])}async function refresh(){if(!user)return;try{[cache.batches,cache.events,cache.weights,cache.daily,cache.items,cache.moves,cache.meds,cache.treatments,cache.finance,cache.recipes,cache.lines,cache.phases]=await Promise.all([get('batches','placed_at'),get('livestock_events','event_date'),get('broiler_weights','weigh_date'),get('daily_records','record_date'),get('warehouse_items','name'),get('warehouse_movements','movement_date'),get('medicines','name'),get('treatments','treatment_date'),get('finance','operation_date'),get('feed_recipes','name'),get('feed_recipe_lines','ingredient_name'),get('feed_phases','sort_order')]);render()}catch(e){console.error(e);render()}}
function page(p){pageName=p;render()}function render(){const names={dashboard:'Головна',broilers:'Бройлери',layers:'Несучки',warehouse:'Склад',medicines:'Ліки',recipes:'Рецепти',finance:'Фінанси',reports:'Звіти',settings:'Налаштування'};$('title').textContent=names[pageName]||'FERMA PRO';document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===pageName));({dashboard:dashboard,broilers:broilers,layers:layers,warehouse:warehouse,medicines:medicines,recipes:recipes,finance:finance,reports:reports,settings:settings}[pageName])()}
function headcount(b){let x=b.initial_heads;cache.events.filter(e=>e.batch_id===b.id).forEach(e=>{if(['mortality','sale','home','cull'].includes(e.event_type))x-=n(e.heads);else if(e.event_type==='adjustment')x+=n(e.heads)});return Math.max(0,x)}function batch(id){return cache.batches.find(b=>b.id===id)}function phaseFor(b){if(!b)return null;const age=Math.max(1,Math.floor((Date.now()-new Date(b.placed_at))/86400000)+1);return cache.phases.filter(p=>p.kind==='broiler').find(p=>age>=p.from_day&&age<=p.to_day)||null}function latestWeight(id){return cache.weights.filter(w=>w.batch_id===id).sort((a,b)=>new Date(b.weigh_date)-new Date(a.weigh_date))[0]}
function dashboard(){const bro=cache.batches.filter(b=>b.kind==='broiler'&&b.status!=='archived'),lay=cache.batches.filter(b=>b.kind==='layer'&&b.status!=='archived'),income=cache.finance.filter(x=>x.operation_type==='income').reduce((a,x)=>a+n(x.amount),0),expense=cache.finance.filter(x=>x.operation_type==='expense').reduce((a,x)=>a+n(x.amount),0);$('content').innerHTML=`<div class="grid g4"><div class="card">🐔 Бройлери<div class="stat">${bro.reduce((a,b)=>a+headcount(b),0)}</div><div class="muted">голів</div></div><div class="card">🥚 Несучки<div class="stat">${lay.reduce((a,b)=>a+headcount(b),0)}</div><div class="muted">голів</div></div><div class="card">💰 Дохід<div class="stat">${money(income)}</div></div><div class="card">📉 Витрати<div class="stat">${money(expense)}</div><div class="muted">результат ${money(income-expense)}</div></div></div><div class="section" style="margin-top:15px"><div class="card"><h3>Активні партії</h3>${broilerCards(bro)}${layerCards(lay)}</div></div>`}function broilerCards(arr){return arr.length?arr.map(b=>{const w=latestWeight(b.id),p=phaseFor(b);const feed=cache.daily.filter(d=>d.batch_id===b.id).reduce((a,d)=>a+n(d.feed_kg),0);return `<div class="card" style="margin:8px 0"><div class="row"><b>${esc(b.name)}</b><span class="pill">${headcount(b)} гол.</span><span class="pill">${Math.floor((Date.now()-new Date(b.placed_at))/86400000)+1} день</span>${p?`<span class="pill">${esc(p.name)}</span>`:''}<span class="right">${w?money(0).replace('0,00 грн',money(w.average_weight_g/1000))+' кг':'Немає зважування'}</span><button class="secondary small" onclick="openBatch('${b.id}')">Відкрити</button></div><div class="muted small">Корм: ${feed.toFixed(2)} кг · Остання вага: ${w?w.average_weight_g.toFixed(0)+' г':'—'} · FCR: ${calcFcr(b.id)}</div></div>`}).join(''):'<div class="muted">Немає активних партій бройлерів</div>'}function layerCards(arr){return arr.length?arr.map(b=>`<div class="card" style="margin:8px 0"><div class="row"><b>${esc(b.name)}</b><span class="pill">${headcount(b)} гол.</span><button class="secondary small" onclick="openBatch('${b.id}')">Відкрити</button></div></div>`).join(''):'<div class="muted">Немає активних партій несучок</div>'}
function broilers(){const arr=cache.batches.filter(b=>b.kind==='broiler');$('content').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="primary" onclick="batchForm('broiler')">＋ Нова партія</button></div><div class="card"><table class="table"><thead><tr><th>Партія</th><th>Посадка</th><th>Початок</th><th>Зараз</th><th>Вік</th><th>Вага</th><th>Фаза</th><th></th></tr></thead><tbody>${arr.map(b=>{const w=latestWeight(b.id),age=Math.floor((Date.now()-new Date(b.placed_at))/86400000)+1,p=phaseFor(b);return `<tr><td><b>${esc(b.name)}</b><br><span class="muted">${esc(b.breed)}</span></td><td>${b.placed_at}</td><td>${b.initial_heads}</td><td><b>${headcount(b)}</b></td><td>${age}</td><td>${w?w.average_weight_g.toFixed(0)+' г':'—'}</td><td>${p?esc(p.name):'—'}</td><td><button class="secondary small" onclick="openBatch('${b.id}')">Облік</button> <button class="secondary small" onclick="batchForm('broiler','${b.id}')">✎</button> <button class="danger small" onclick="del('batches','${b.id}')">×</button></td></tr>`}).join('')}</tbody></table></div>`}
function layers(){const arr=cache.batches.filter(b=>b.kind==='layer');$('content').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="primary" onclick="batchForm('layer')">＋ Нова партія</button></div><div class="card"><table class="table"><thead><tr><th>Партія</th><th>Посадка</th><th>Було</th><th>Зараз</th><th>Яйця</th><th>Несучість</th><th></th></tr></thead><tbody>${arr.map(b=>{const ds=cache.daily.filter(d=>d.batch_id===b.id),eg=ds.reduce((a,d)=>a+n(d.eggs),0),days=Math.max(1,ds.length),rate=headcount(b)?(eg/(headcount(b)*days)*100):0;return `<tr><td>${esc(b.name)}</td><td>${b.placed_at}</td><td>${b.initial_heads}</td><td>${headcount(b)}</td><td>${eg}</td><td>${rate.toFixed(1)}%</td><td><button class="secondary small" onclick="openBatch('${b.id}')">Облік</button> <button class="secondary small" onclick="batchForm('layer','${b.id}')">✎</button></td></tr>`}).join('')}</tbody></table></div>`}
function openBatch(id){const b=batch(id);if(!b)return;const events=cache.events.filter(e=>e.batch_id===id),ws=cache.weights.filter(w=>w.batch_id===id),ds=cache.daily.filter(d=>d.batch_id===id),ts=cache.treatments.filter(t=>t.batch_id===id),age=Math.floor((Date.now()-new Date(b.placed_at))/86400000)+1,feed=ds.reduce((a,d)=>a+n(d.feed_kg),0),w=latestWeight(id),gain=w?Math.max(0,w.average_weight_g/1000*n(headcount(b))-n(b.initial_heads)*n(b.start_weight_g)/1000):0;$('modalBody').innerHTML=`<div class="row"><h3>${esc(b.name)} · ${b.kind==='broiler'?'Бройлер':'Несучка'}</h3><button class="secondary right" onclick="closeModal()">Закрити</button></div><div class="grid g4"><div class="card">Поголів'я<div class="stat">${headcount(b)}</div></div><div class="card">Вік<div class="stat">${age}</div></div><div class="card">Корм<div class="stat">${feed.toFixed(1)} кг</div></div><div class="card">FCR<div class="stat">${calcFcr(id)}</div></div></div><div class="row" style="margin:12px 0"><button class="primary" onclick="eventForm('${id}')">＋ Рух поголів'я</button>${b.kind==='broiler'?`<button class="primary" onclick="weightForm('${id}')">⚖ Зважування</button>`:''}<button class="primary" onclick="dailyForm('${id}')">＋ Щоденний облік</button><button class="primary" onclick="treatmentForm('${id}')">💊 Лікування</button></div><div class="card section"><h3>Поголів'я та рухи</h3><table class="table"><tr><th>Дата</th><th>Операція</th><th>Голів</th><th>Кг</th><th>Сума</th><th></th></tr>${events.map(e=>`<tr><td>${e.event_date}</td><td>${e.event_type}</td><td>${e.heads}</td><td>${n(e.weight_kg).toFixed(2)}</td><td>${money(e.total_amount)}</td><td><button class="secondary small" onclick="eventForm('${id}','${e.id}')">✎</button> <button class="danger small" onclick="del('livestock_events','${e.id}');openBatch('${id}')">×</button></td></tr>`).join('')}</table></div>${b.kind==='broiler'?`<div class="card section"><h3>Зважування</h3><table class="table"><tr><th>Дата</th><th>Вік</th><th>Вибірка</th><th>Середня</th><th>Жива маса</th><th>Норма</th><th>Відхилення</th><th></th></tr>${ws.map(x=>{const age=Math.floor((new Date(x.weigh_date)-new Date(b.placed_at))/86400000)+1,p=cache.phases.find(p=>p.kind==='broiler'&&age>=p.from_day&&age<=p.to_day),dev=p&&p.recommended_weight_g?n(x.average_weight_g)-n(p.recommended_weight_g):0;return `<tr><td>${x.weigh_date}</td><td>${age}</td><td>${x.sampled_heads}</td><td>${n(x.average_weight_g).toFixed(0)} г</td><td>${(n(x.average_weight_g)*headcount(b)/1000).toFixed(1)} кг</td><td>${p&&p.recommended_weight_g?p.recommended_weight_g+' г':'—'}</td><td>${p&&p.recommended_weight_g?`<span class="pill ${dev>=0?'ok':dev>-100?'warn':'bad'}">${dev.toFixed(0)} г</span>`:'—'}</td><td><button class="secondary small" onclick="weightForm('${id}','${x.id}')">✎</button> <button class="danger small" onclick="del('broiler_weights','${x.id}');openBatch('${id}')">×</button></td></tr>`}).join('')}</table></div>`:''}<div class="card"><h3>Щоденний облік</h3><table class="table"><tr><th>Дата</th><th>Корм кг</th><th>Вода л</th><th>Яйця</th><th>Інші витрати</th><th></th></tr>${ds.map(d=>`<tr><td>${d.record_date}</td><td>${n(d.feed_kg).toFixed(2)}</td><td>${n(d.water_l).toFixed(2)}</td><td>${n(d.eggs)}</td><td>${money(n(d.medicine_cost)+n(d.bedding_cost)+n(d.electricity_cost)+n(d.labor_cost)+n(d.other_cost))}</td><td><button class="secondary small" onclick="dailyForm('${id}','${d.id}')">✎</button> <button class="danger small" onclick="del('daily_records','${d.id}');openBatch('${id}')">×</button></td></tr>`).join('')}</table></div>`;$('modal').classList.remove('hidden')}
function calcFcr(id){const b=batch(id),w=cache.weights.filter(x=>x.batch_id===id).sort((a,b)=>new Date(a.weigh_date)-new Date(b.weigh_date)),feed=cache.daily.filter(x=>x.batch_id===id).reduce((a,x)=>a+n(x.feed_kg),0);if(w.length<2)return '—';const first=w[0].average_weight_g/1000*b.initial_heads,last=w[w.length-1].average_weight_g/1000*headcount(b),gain=last-first;return gain>0?(feed/gain).toFixed(2):'—'}
function formShell(title,body,save){$('modalBody').innerHTML=`<div class="row"><h3>${title}</h3><button class="secondary right" onclick="closeModal()">×</button></div>${body}<div class="row" style="margin-top:15px"><button class="primary" onclick="${save}">Зберегти</button><button class="secondary" onclick="closeModal()">Скасувати</button></div>`;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
async function saveRow(table,obj,id=null,after=refresh){obj.user_id=user.id;let q=id?sb.from(table).update(obj).eq('id',id).eq('user_id',user.id):sb.from(table).insert(obj);const r=await q.select().single();if(r.error){alert(r.error.message);return}closeModal();await after()}
function batchForm(kind,id){const b=id?batch(id):{};formShell(id?'Редагування партії':'Нова партія',`<div class="grid g2"><div class="field"><label>Назва партії</label><input id="f_name" value="${esc(b.name)}"></div><div class="field"><label>Порода</label><input id="f_breed" value="${esc(b.breed)}"></div><div class="field"><label>Дата посадки</label><input id="f_date" type="date" value="${date(b.placed_at)}"></div><div class="field"><label>Початкове поголів'я</label><input id="f_heads" type="number" min="1" value="${b.initial_heads||''}"></div><div class="field"><label>Ціна курчати/голови</label><input id="f_price" type="number" step="0.01" value="${b.chick_price||0}"></div><div class="field"><label>Початкова середня вага, г</label><input id="f_start" type="number" step="0.1" value="${b.start_weight_g||''}"></div><div class="field"><label>Статус</label><select id="f_status"><option value="active">Активна</option><option value="completed">Завершена</option><option value="archived">Архів</option></select></div></div>`,`saveRow('batches',{kind,name:$('f_name').value,breed:$('f_breed').value,placed_at:$('f_date').value,initial_heads:n($('f_heads').value),chick_price:n($('f_price').value),start_weight_g:n($('f_start').value),status:$('f_status').value},'${id||''}')`);if(id)$('f_status').value=b.status}
function eventForm(bid,id){const e=id?cache.events.find(x=>x.id===id):{};formShell('Рух поголів\'я',`<div class="grid g2"><div class="field"><label>Дата</label><input id="e_date" type="date" value="${date(e.event_date)}"></div><div class="field"><label>Тип</label><select id="e_type"><option value="mortality">Падіж</option><option value="sale">Продаж</option><option value="home">Додому</option><option value="cull">Вибракування</option><option value="adjustment">Коригування (+)</option></select></div><div class="field"><label>Голів</label><input id="e_heads" type="number" min="1" value="${e.heads||''}"></div><div class="field"><label>Вага, кг</label><input id="e_weight" type="number" step="0.001" value="${e.weight_kg||0}"></div><div class="field"><label>Ціна/кг</label><input id="e_ppk" type="number" step="0.01" value="${e.price_per_kg||0}"></div><div class="field"><label>Сума</label><input id="e_total" type="number" step="0.01" value="${e.total_amount||0}"></div><div class="field"><label>Клієнт</label><input id="e_client" value="${esc(e.client)}"></div><div class="field"><label>Примітка</label><input id="e_note" value="${esc(e.notes)}"></div></div>`,`saveEvent('${bid}','${id||''}')`)}async function saveEvent(bid,id){const b=batch(bid),heads=n($('e_heads').value),available=headcount(b)+(id?0:0),type=$('e_type').value;if(['mortality','sale','home','cull'].includes(type)&&heads>available){alert('Не можна вилучити більше голів, ніж є в партії.');return}const total=n($('e_total').value)||n($('e_weight').value)*n($('e_ppk').value);await saveRow('livestock_events',{batch_id:bid,event_date:$('e_date').value,event_type:type,heads,weight_kg:n($('e_weight').value),price_per_kg:n($('e_ppk').value),total_amount:total,client:$('e_client').value,notes:$('e_note').value},id,async()=>{if(total>0&&type==='sale')await sb.from('finance').insert({user_id:user.id,operation_type:'income',operation_date:$('e_date').value,category:b.kind==='broiler'?'Продаж бройлерів':'Продаж курей',amount:to function moveForm(itemId){const items=cache.items;formShell('Рух складу',`<div class="grid g3"><div class="field"><label>Товар</label><select id="m_item">${items.map(i=>`<option value="${i.id}" ${i.id===itemId?'selected':''}>${esc(i.name)} (${i.unit})</option>`).join('')}</select></div><div class="field"><label>Дата</label><input id="m_date" type="date" value="${date()}"/></div><div class="field"><label>Операція</label><select id="m_type"><option value="in">Прихід</option><option value="use">Використання</option><option value="sale">Продаж</option><option value="home">Додому</option><option value="adjustment">Коригування</option></select></div><div class="field"><label>Кількість</label><input id="m_qty" type="number" min="0.001" step="0.001"></div><div class="field"><label>Ціна/од.</label><input id="m_price" type="number" step="0.0001"></div><div class="field"><label>Постачальник</label><input id="m_sup"></div><div class="field"><label>Напрям коригування</label><select id="m_dir"><option value="in">+ Додати</option><option value="out">− Зняти</option></select></div><div class="field"><label>Примітка</label><input id="m_note"></div></div>`,`saveMove()`)}async function saveMove(){const item=cache.items.find(i=>i.id==$('m_item').value),qty=n($('m_qty').value),type=$('m_type').value,price=n($('m_price').value)||n(item?.price_per_unit);if(!qty){alert('Вкажи кількість');return}const current=cache.moves.filter(m=>m.item_id===item.id).reduce((a,m)=>a+(m.movement_type==='in'||(m.movement_type==='adjustment'&&m.adjustment_direction==='in')?n(m.quantity):-n(m.quantity)),0);if(['use','sale','home'].includes(type)&&qty>current){alert(`Недостатній залишок. Доступно: ${current.toFixed(3)} ${item.unit}`);return}await saveRow('warehouse_movements',{item_id:item.id,movement_date:$('m_date').value,movement_type:type,quantity:qty,unit_price:price,total_amount:qty*price,adjustment_direction:type==='adjustment'?$('m_dir').value:null,supplier:$('m_sup').value,notes:$('m_note').value})}

function recipeForm(id){const r=id?cache.recipes.find(x=>x.id===id):{};let lines=id?cache.lines.filter(x=>x.recipe_id===id):[];let lineHtml=lines.map((l,i)=>lineTpl(l,i)).join('')||lineTpl({},0);formShell(id?'Редагування рецепту':'Новий рецепт',`<div class="grid g2"><div class="field"><label>Назва</label><input id="r_name" value="${esc(r.name)}"></div><div class="field"><label>Фаза</label><input id="r_phase" value="${esc(r.phase)}"></div></div><div id="recipeLines">${lineHtml}</div><button class="secondary" onclick="addLine()">＋ Додати інгредієнт</button>`,`saveRecipe('${id||''}')`)}function lineTpl(l,i){return `<div class="grid g4 recipeLine" style="margin:8px 0"><div class="field"><label>Інгредієнт</label><input class="ln" value="${esc(l.ingredient_name)}"></div><div class="field"><label>Кг</label><input class="lk" type="number" step="0.001" value="${l.kg||''}"></div><div class="field"><label>Ціна/кг</label><input class="lp" type="number" step="0.0001" value="${l.price_per_kg||0}"></div><div><label>&nbsp;</label><button class="danger" onclick="this.closest('.recipeLine').remove()">Видалити</button></div></div>`}function addLine(){const d=document.createElement('div');d.innerHTML=lineTpl({},Date.now());$('recipeLines').appendChild(d.firstElementChild)}async function saveRecipe(id){const r=await saveRow('feed_recipes',{name:$('r_name').value,phase:$('r_phase').value},id,async()=>{});if(!r)return}

e}
function reports(){const arr=cache.batches.filter(b=>b.status!=='archived');$('content').innerHTML=`<div class="card"><h3>Звіт по партії</h3><div class="field"><label>Партія</label><select id="repBatch">${arr.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><button class="primary" style="margin-top:10px" onclick="report('${arr[0]?.id||''}')">Сформувати</button></div>`}function report(id){const b=batch(id);if(!b)return;const ev=cache.events.filter(e=>e.batch_id===id),ds=cache.daily.filter(d=>d.batch_id===id),ws=cache.weights.filter(w=>w.batch_id===id),tr=cache.treatments.filter(t=>t.batch_id===id),feed=ds.reduce((a,d)=>a+n(d.feed_kg),0),feedCost=ds.reduce((a,d)=>a+n(d.feed_kg)*avgFeedPrice(),0),med=tr.reduce((a,t)=>a+n(t.total_cost),0),other=ds.reduce((a,d)=>a+n(d.bedding_cost)+n(d.electricity_cost)+n(d.labor_cost)+n(d.other_cost)+n(d.medicine_cost),0),sales=ev.filter(e=>e.event_type==='sale').reduce((a,e)=>a+n(e.total_amount),0),cost=n(b.initial_heads)*n(b.chick_price)+feedCost+med+other;const w=latestWeight(id);$('content').innerHTML=`<div class="card"><div class="row"><div><h2 style="margin:0">ЗВІТ ПАРТІЇ ${esc(b.name)}</h2><div class="muted">${b.kind==='broiler'?'Бройлери':'Несучки'} · ${b.placed_at}</div></div><button class="primary right" onclick="window.print()">🖨 Друк</button></div><hr><div class="grid g4"><div>Початково<strong class="stat">${b.initial_heads}</strong></div><div>Зараз<strong class="stat">${headcount(b)}</strong></div><div>Корм<strong class="stat">${feed.toFixed(2)} кг</strong></div><div>FCR<strong class="stat">${calcFcr(id)}</strong></div><div>Остання вага<strong class="stat">${w?w.average_weight_g.toFixed(0)+' г':'—'}</strong></div><div>Корм<strong class="stat">${money(feedCost)}</strong></div><div>Ліки<strong class="stat">${money(med)}</strong></div><div>Всі витрати<strong class="stat">${money(cost)}</strong></div><div>Продажі<strong class="stat">${money(sales)}</strong></div><div>Прибуток<strong class="stat">${money(sales-cost)}</strong></div><div>Собівартість/голову<strong class="stat">${money(headcount(b)?cost/headcount(b):0)}</strong></div><div>Рентабельність<strong class="stat">${cost?(100*(sales-cost)/cost).toFixed(1):'0.0'}%</strong></div></div><h3>Контроль годівлі</h3><table class="table"><tr><th>Етап</th><th>Дні</th><th>Рекомендована вага</th><th>Рекомендований корм/гол.</th></tr>${cache.phases.filter(p=>p.kind==='broiler').map(p=>`<tr><td>${esc(p.name)}</td><td>${p.from_day}–${p.to_day>=9999?'∞':p.to_day}</td><td>${p.recommended_weight_g||'—'} г</td><td>${p.recommended_feed_g_head||'—'} г</td></tr>`).join('')}</table><h3>Зважування</h3><table class="table"><tr><th>Дата</th><th>Вік</th><th>Середня</th><th>Загальна жива маса</th><th>Відхилення</th></tr>${ws.map(w=>{const age=Math.floor((new Date(w.weigh_date)-new Date(b.placed_at))/86400000)+1,p=cache.phases.find(p=>p.kind==='broiler'&&age>=p.from_day&&age<=p.to_day),dev=p&&p.recommended_weight_g?n(w.average_weight_g)-n(p.recommended_weight_g):0;return `<tr><td>${w.weigh_date}</td><td>${age}</td><td>${w.average_weight_g} г</td><td>${(w.average_weight_g*headcount(b)/1000).toFixed(1)} кг</td><td>${p&&p.recommended_weight_g?dev.toFixed(0)+' г':'—'}</td></tr>`}).join('')}</table></div>`}function avgFeedPrice(){const feed=cache.items.filter(i=>i.item_type==='feed');return feed.length?feed.reduce((a,i)=>a+n(i.price_per_unit),0)/feed.length:0}
function settings(){const p=cache.phases.filter(x=>x.kind==='broiler');$('content').innerHTML=`<div class="card"><h3>Фази годівлі бройлера</h3><div class="muted">Стартова схема: STARTER + 3 GROWER + 2 FINISHER. Дні можна змінювати.</div><table class="table"><tr><th>Фаза</th><th>Від</th><th>До</th><th>Рекомендована вага, г</th><th>Корм/гол., г</th><th></th></tr>${p.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.from_day}</td><td>${x.to_day>=9999?'∞':x.to_day}</td><td>${x.recommended_weight_g||0}</td><td>${x.recommended_feed_g_head||0}</td><td><button class="secondary small" onclick="phaseForm('${x.id}')">✎</button></td></tr>`).join('')}</table></div><div class="card" style="margin-top:12px"><h3>Схема</h3><b>STARTER → GROWER 1 → GROWER 2 → GROWER 3 → FINISHER 1 → FINISHER 2</b></div>`}function phaseForm(id){const p=cache.phases.find(x=>x.id===id);formShell('Редагування фази',`<div class="grid g2"><div class="field"><label>Назва</label><input id="ph_name" value="${esc(p.name)}"></div><div class="field"><label>Від дня</label><input id="ph_from" type="number" value="${p.from_day}"></div><div class="field"><label>До дня</label><input id="ph_to" type="number" value="${p.to_day}"></div><div class="field"><label>Рекомендована вага, г</label><input id="ph_w" type="number" step="0.1" value="${p.recommended_weight_g||0}"></div><div class="field"><label>Корм/гол., г</label><input id="ph_f" type="number" step="0.1" value="${p.recommended_feed_g_head||0}"></div></div>`,`saveRow('feed_phases',{name:$('ph_name').value,from_day:n($('ph_from').value),to_day:n($('ph_to').value),recommended_weight_g:n($('ph_w').value),recommended_feed_g_head:n($('ph_f').value)},'${id}')`)}
async function del(table,id){if(!confirm('Видалити запис?'))return;const r=await sb.from(table).delete().eq('id',id).eq('user_id',user.id);if(r.error)alert(r.error.message);await refresh()}render();
</script></body></html>
