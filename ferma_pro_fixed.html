</style></head><body>
<div id="auth" class="login"><div class="box"><h1>🌾 FERMA PRO</h1><p class="muted">Робочий облік ферми</p><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Пароль</label><input id="password" type="password" required></div><div class="row"><button class="primary">Увійти</button><button class="secondary" type="button" id="signup">Реєстрація</button></div><p id="authMsg" class="muted"></p></form></div></div>
<div id="app" class="hidden"><aside class="nav"><div class="brand">🌾 FERMA PRO</div><button data-page="dashboard">📊 Головна</button><button data-page="broilers">🐔 Бройлери</button><button data-page="layers">🥚 Несучки</button><button data-page="warehouse">📦 Склад</button><button data-page="medicines">💊 Ліки</button><button data-page="recipes">🌾 Рецепти</button><button data-page="finance">💰 Фінанси</button><button data-page="reports">📑 Звіти</button><button data-page="settings">⚙️ Налаштування</button><button id="logout">🚪 Вийти</button></aside><main class="main"><div class="top"><div><h2 id="title" style="margin:0">Головна</h2><span class="muted">Бройлери + несучки</span></div><button class="secondary noPrint" id="refresh">↻ Оновити</button></div><div id="content"></div></main></div>

<script>
'use strict';
const SB_URL='https://zfqekerozvjrpauqiqln.supabase.co',SB_KEY='sb_publishable_HO1JIwKs8dkUNtKu7UuZUg_KGCjUsVp',db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-zfqekerozvjrpauqiqln-auth-token'}});
let user=null,current='dashboard';
const C={batches:[],events:[],weights:[],daily:[],eggs:[],eggSales:[],items:[],moves:[],meds:[],treat:[],fin:[],recipes:[],lines:[],phases:[]};
const $=id=>document.getElementById(id),N=v=>{const x=Number(v);return Number.isFinite(x)?x:0},D=()=>new Date().toISOString().slice(0,10),M=v=>N(v).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' грн',E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openModal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
async function get(t,o){let q=db.from(t).select('*');if(o)q=q.order(o,{ascending:true});const r=await q;if(r.error){console.error(t,r.error);return []}return r.data||[]}
async function load(){const map=[['batches','placed_at','batches'],['livestock_events','event_date','events'],['broiler_weights','weigh_date','weights'],['daily_records','record_date','daily'],['egg_records','record_date','eggs'],['egg_sales','sale_date','eggSales'],['warehouse_items','name','items'],['warehouse_movements','movement_date','moves'],['medicines','name','meds'],['treatments','treatment_date','treat'],['finance','operation_date','fin'],['feed_recipes','name','recipes'],['feed_recipe_lines','ingredient_name','lines'],['feed_phases','sort_order','phases']];for(const [t,o,k] of map)C[k]=await get(t,o);render()}
async function save(t,p,id){const r=id?await db.from(t).update(p).eq('id',id).eq('user_id',user.id):await db.from(t).insert({...p,user_id:user.id});if(r.error){alert(r.error.message);return false}await load();return true}
async function del(t,id){if(!confirm('Видалити запис?'))return;const r=await db.from(t).delete().eq('id',id).eq('user_id',user.id);if(r.error)alert(r.error.message);else await load()}
function batch(id){return C.batches.find(x=>x.id===id)}
function heads(b){let n=N(b?.initial_heads);C.events.filter(x=>x.batch_id===b?.id).forEach(x=>{if(['mortality','sale','home','cull'].includes(x.event_type))n-=N(x.heads);if(x.event_type==='adjustment')n+=N(x.heads)});return Math.max(0,Math.round(n))}
function age(b){return Math.max(1,Math.floor((Date.now()-new Date(b.placed_at+'T00:00:00'))/86400000)+1)}
function weights(id){return C.weights.filter(x=>x.batch_id===id).sort((a,b)=>new Date(a.weigh_date)-new Date(b.weigh_date))}
function latestWeight(id){const a=weights(id);return a[a.length-1]||null}function firstWeight(id){return weights(id)[0]||null}
function feedKg(id){return C.daily.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.feed_kg),0)}
function dailyCost(id){return C.daily.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.water_cost)+N(x.medicine_cost)+N(x.bedding_cost)+N(x.electricity_cost)+N(x.labor_cost)+N(x.other_cost),0)}
function treatmentCost(id){return C.treat.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.total_cost),0)}
function feedCost(id){return C.moves.filter(x=>x.batch_id===id&&x.movement_type==='use'&&C.items.find(i=>i.id===x.item_id)?.item_type==='feed').reduce((s,x)=>s+N(x.total_amount)||s+N(x.quantity)*N(x.unit_price),0)}
function explicitExpense(id){return C.fin.filter(x=>x.batch_id===id&&x.operation_type==='expense').reduce((s,x)=>s+N(x.amount),0)}
function birdSales(id){return C.events.filter(x=>x.batch_id===id&&x.event_type==='sale').reduce((s,x)=>s+N(x.total_amount),0)}
function eggSalesIncome(id){return C.eggSales.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.total_amount),0)}
function income(id){return birdSales(id)+eggSalesIncome(id)+C.fin.filter(x=>x.batch_id===id&&x.operation_type==='income').reduce((s,x)=>s+N(x.amount),0)}
function totalCost(id){const b=batch(id);return N(b?.initial_heads)*N(b?.chick_price)+feedCost(id)+dailyCost(id)+treatmentCost(id)+explicitExpense(id)}
function gainKg(id){const b=batch(id),f=firstWeight(id),l=latestWeight(id);if(!b||!f||!l||f.id===l.id)return 0;return Math.max(0,heads(b)*N(l.average_weight_g)/1000-N(b.initial_heads)*N(f.average_weight_g)/1000)}
function fcr(id){const g=gainKg(id);return g>0?feedKg(id)/g:0}
function phaseFor(b){const p=age(b);return C.phases.filter(x=>x.kind==='broiler').find(x=>p>=N(x.from_day)&&p<=N(x.to_day))||null}
function eggProduced(id){return C.eggs.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.good_eggs),0)}
function eggSold(id){return C.eggSales.filter(x=>x.batch_id===id).reduce((s,x)=>s+N(x.quantity),0)}
function eggAvailable(id){return Math.max(0,eggProduced(id)-eggSold(id))}
function nav(p){current=p;render()}
function render(){const names={dashboard:'Головна',broilers:'Бройлери',layers:'Несучки',warehouse:'Склад',medicines:'Ліки',recipes:'Рецепти',finance:'Фінанси',reports:'Звіти',settings:'Налаштування'};$('title').textContent=names[current];document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));({dashboard,broilers,layers,warehouse,medicines,recipes,finance,reports,settings}[current])()}
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
function dashboard(){const active=C.batches.filter(b=>b.status!=='archived'),br=active.filter(b=>b.kind==='broiler'),la=active.filter(b=>b.kind==='layer');const inc=C.fin.filter(x=>x.operation_type==='income').reduce((s,x)=>s+N(x.amount),0)+C.eggSales.reduce((s,x)=>s+N(x.total_amount),0)+C.events.filter(x=>x.event_type==='sale').reduce((s,x)=>s+N(x.total_amount),0),exp=C.fin.filter(x=>x.operation_type==='expense').reduce((s,x)=>s+N(x.amount),0)+C.batches.reduce((s,b)=>s+N(b.initial_heads)*N(b.chick_price),0);$('content').innerHTML=`<div class="grid g4"><div class="card">🐔 Бройлери<div class="stat">${br.reduce((s,b)=>s+heads(b),0)}</div><span class="muted">голів</span></div><div class="card">🥚 Несучки<div class="stat">${la.reduce((s,b)=>s+heads(b),0)}</div><span class="muted">голів</span></div><div class="card">💰 Дохід<div class="stat">${M(inc)}</div></div><div class="card">📉 Витрати<div class="stat">${M(exp)}</div></div></div><div class="section card"><h3>Активні партії</h3>${active.map(b=>{const w=latestWeight(b.id),p=phaseFor(b);return `<div class="card" style="margin:8px 0"><div class="row"><b>${E(b.name)}</b><span class="pill">${b.kind==='broiler'?'🐔':'🥚'} ${heads(b)} гол.</span><span class="pill">${age(b)} день</span>${p?`<span class="pill">${E(p.name)}</span>`:''}<button class="secondary small right" onclick="openBatch('${b.id}')">Відкрити</button></div><div class="muted">${b.kind==='broiler'?`Вага ${w?N(w.average_weight_g).toFixed(0)+' г':'—'} · корм ${feedKg(b.id).toFixed(2)} кг · FCR ${fcr(b.id)?fcr(b.id).toFixed(3):'—'}`:`Яйця ${eggProduced(b.id)} шт · доступно ${eggAvailable(b.id)} шт`}</div></div>`}).join('')||'<p class="muted">Партій немає.</p>'}</div>`}
function batchList(kind){const a=C.batches.filter(b=>b.kind===kind);$('content').innerHTML=`<div class="row"><button class="primary" onclick="batchForm('${kind}')">＋ Нова партія</button><button class="secondary" onclick="archiveCompleted('${kind}')">Архів завершених</button></div><div class="card section"><table class="table"><thead><tr><th>Партія</th><th>Посадка</th><th>Було</th><th>Зараз</th><th>Вік</th><th>${kind==='broiler'?'Вага / FCR':'Яйця / доступно'}</th><th>Статус</th><th></th></tr></thead><tbody>${a.map(b=>{const w=latestWeight(b.id);return `<tr><td><b>${E(b.name)}</b><br><span class="muted">${E(b.breed||'')}</span></td><td>${b.placed_at}</td><td>${N(b.initial_heads)}</td><td><b>${heads(b)}</b></td><td>${age(b)}</td><td>${kind==='broiler'?(w?N(w.average_weight_g).toFixed(0)+' г':'—')+' / '+(fcr(b.id)?fcr(b.id).toFixed(3):'—'):`${eggProduced(b.id)} / ${eggAvailable(b.id)}`}</td><td>${E(b.status)}</td><td class="actions"><button class="secondary small" onclick="openBatch('${b.id}')">Облік</button> <button class="secondary small" onclick="batchForm('${kind}','${b.id}')">Ред.</button> <button class="danger small" onclick="del('batches','${b.id}')">×</button></td></tr>`}).join('')||'<tr><td colspan="8">Немає партій</td></tr>'}</tbody></table></div>`}
function broilers(){batchList('broiler')}function layers(){batchList('layer')}
async function archiveCompleted(kind){for(const b of C.batches.filter(x=>x.kind===kind&&x.status==='completed'))await save('batches',{status:'archived'},b.id)}
function batchForm(kind,id){const b=id?batch(id):null;openModal(`<h3>${b?'Редагувати':'Нова'} партія</h3><form id="form" class="grid g2"><div class="field"><label>Назва</label><input name="name" required value="${E(b?.name||'')}" placeholder="Бройлер №1"></div><div class="field"><label>Порода</label><input name="breed" value="${E(b?.breed||'')}"></div><div class="field"><label>Дата посадки</label><input name="placed_at" type="date" required value="${b?.placed_at||D()}"></div><div class="field"><label>Початкова кількість, гол.</label><input name="initial_heads" type="number" min="1" required value="${N(b?.initial_heads)||''}"></div><div class="field"><label>Ціна птиці, грн/гол.</label><input name="chick_price" type="number" min="0" step=".01" value="${N(b?.chick_price)}"></div><div class="field"><label>Стартова вага, г</label><input name="start_weight_g" type="number" min="0" step=".1" value="${N(b?.start_weight_g)||''}"></div><div class="field"><label>Статус</label><select name="status"><option value="active">active</option><option value="completed">completed</option><option value="archived">archived</option></select></div><div class="field"><label>Примітки</label><textarea name="notes">${E(b?.notes||'')}</textarea></div><button class="primary">Зберегти</button></form>`);$('form').status.value=b?.status||'active';$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.kind=kind;p.initial_heads=N(p.initial_heads);p.chick_price=N(p.chick_price);p.start_weight_g=N(p.start_weight_g);if(await save('batches',p,id))closeModal()}}
function openBatch(id){const b=batch(id);openModal(`<div class="row"><h2>${E(b.name)}</h2><button class="secondary right" onclick="closeModal()">Закрити</button></div><p>${E(b.breed||'')} · ${b.placed_at} · <b>${heads(b)} гол.</b></p><div class="row"><button class="primary" onclick="tab('${id}','heads')">Поголів'я</button>${b.kind==='broiler'?'<button class="primary" onclick="tab(\''+id+'\',\'weight\')">Зважування</button>':'<button class="primary" onclick="tab(\''+id+'\',\'eggs\')">Яйця</button>'}<button class="primary" onclick="tab('${id}','daily')">Корм/витрати</button><button class="primary" onclick="tab('${id}','sales')">Продаж</button><button class="secondary" onclick="batchForm('${b.kind}','${id}')">Редагувати партію</button></div><div id="tabBody"></div>`);tab(id,'heads')}
function tab(id,t){const b=batch(id);let h='';if(t==='heads')h=`<div class="row"><button class="primary" onclick="eventForm('${id}','mortality')">＋ Падіж</button><button class="primary" onclick="eventForm('${id}','cull')">＋ Вибракування</button><button class="primary" onclick="eventForm('${id}','sale')">＋ Продаж</button><button class="primary" onclick="eventForm('${id}','home')">＋ Додому</button><button class="primary" onclick="eventForm('${id}','adjustment')">＋ Коригування</button></div><table class="table"><tr><th>Дата</th><th>Тип</th><th>Голів</th><th>Вага кг</th><th>Сума</th><th></th></tr>${C.events.filter(x=>x.batch_id===id).map(x=>`<tr><td>${x.event_date}</td><td>${E(x.event_type)}</td><td>${N(x.heads)}</td><td>${N(x.weight_kg).toFixed(3)}</td><td>${M(x.total_amount)}</td><td><button class="secondary small" onclick="eventForm('${id}','${x.event_type}','${x.id}')">Ред.</button> <button class="danger small" onclick="del('livestock_events','${x.id}');setTimeout(()=>tab('${id}','heads'),300)">×</button></td></tr>`).join('')}</table><p><b>Поточне поголів'я: ${heads(b)}</b></p>`;if(t==='weight')h=`<button class="primary" onclick="weightForm('${id}')">＋ Зважування</button><table class="table"><tr><th>Дата</th><th>Вибірка</th><th>Середня</th><th>Маса партії</th><th></th></tr>${weights(id).map(x=>`<tr><td>${x.weigh_date}</td><td>${N(x.sampled_heads)}</td><td>${N(x.average_weight_g).toFixed(1)} г</td><td>${(heads(b)*N(x.average_weight_g)/1000).toFixed(2)} кг</td><td><button class="secondary small" onclick="weightForm('${id}','${x.id}')">Ред.</button> <button class="danger small" onclick="del('broiler_weights','${x.id}');setTimeout(()=>tab('${id}','weight'),300)">×</button></td></tr>`).join('')}</table><p>Приріст: ${gainKg(id).toFixed(2)} кг · FCR: ${fcr(id)?fcr(id).toFixed(3):'—'}</p>`;if(t==='eggs')h=`<button class="primary" onclick="eggForm('${id}')">＋ Збір яєць</button><p>Всього добрих: <b>${eggProduced(id)}</b> · Продано: <b>${eggSold(id)}</b> · Доступно: <b>${eggAvailable(id)}</b></p><table class="table"><tr><th>Дата</th><th>Добрі</th><th>Биті</th><th></th></tr>${C.eggs.filter(x=>x.batch_id===id).map(x=>`<tr><td>${x.record_date}</td><td>${N(x.good_eggs)}</td><td>${N(x.broken_eggs)}</td><td><button class="secondary small" onclick="eggForm('${id}','${x.id}')">Ред.</button> <button class="danger small" onclick="del('egg_records','${x.id}');setTimeout(()=>tab('${id}','eggs'),300)">×</button></td></tr>`).join('')}</table>`;if(t==='daily')h=`<button class="primary" onclick="dailyForm('${id}')">＋ Денний запис</button><button class="secondary" onclick="treatForm('${id}')">💊 Лікування</button><table class="table"><tr><th>Дата</th><th>Корм</th><th>Вода</th><th>Витрати</th><th></th></tr>${C.daily.filter(x=>x.batch_id===id).map(x=>`<tr><td>${x.record_date}</td><td>${N(x.feed_kg).toFixed(3)} кг</td><td>${N(x.water_l).toFixed(3)} л</td><td>${M(dailyRowCost(x))}</td><td><button class="secondary small" onclick="dailyForm('${id}','${x.id}')">Ред.</button> <button class="danger small" onclick="del('daily_records','${x.id}');setTimeout(()=>tab('${id}','daily'),300)">×</button></td></tr>`).join('')}</table><p>Корм: ${feedKg(id).toFixed(3)} кг · Корм зі складу: ${M(feedCost(id))} · Лікування: ${M(treatmentCost(id))} · Інші: ${M(dailyCost(id))} · Собівартість: ${M(totalCost(id))}</p>`;if(t==='sales')h=`<div class="row"><button class="primary" onclick="eventForm('${id}','sale')">＋ Продаж птиці</button>${b.kind==='layer'?'<button class="primary" onclick="eggSaleForm(\''+id+'\')">＋ Продаж яєць</button>':''}</div><p>Дохід: <b>${M(income(id))}</b> · Витрати: <b>${M(totalCost(id))}</b> · Результат: <b>${M(income(id)-totalCost(id))}</b></p>`;$('tabBody').innerHTML=h}
function dailyRowCost(x){return N(x.water_cost)+N(x.medicine_cost)+N(x.bedding_cost)+N(x.electricity_cost)+N(x.labor_cost)+N(x.other_cost)}
function weightForm(bid,id){const x=id?C.weights.find(w=>w.id===id):null;openModal(`<h3>Зважування</h3><form id="form" class="grid g2"><div class="field"><label>Дата</label><input name="weigh_date" type="date" value="${x?.weigh_date||D()}"></div><div class="field"><label>Зважено голів</label><input name="sampled_heads" type="number" min="1" value="${N(x?.sampled_heads)||''}" required></div><div class="field"><label>Середня вага, г</label><input name="average_weight_g" type="number" min="0" step=".1" value="${N(x?.average_weight_g)||''}" required></div><div class="field"><label>Примітка</label><input name="notes" value="${E(x?.notes||'')}"></div><button class="primary">Зберегти</button></form>`);$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.sampled_heads=N(p.sampled_heads);p.average_weight_g=N(p.average_weight_g);if(await save('broiler_weights',p,id)){closeModal();openBatch(bid)}}}
function eventForm(bid,type,id){const x=id?C.events.find(e=>e.id===id):null,b=batch(bid);openModal(`<h3>${id?'Редагувати':'Новий'}: ${E(type)}</h3><form id="form" class="grid g2"><div class="field"><label>Дата</label><input name="event_date" type="date" value="${x?.event_date||D()}"></div><div class="field"><label>Голови</label><input name="heads" type="number" min="1" value="${N(x?.heads)||''}" required></div><div class="field"><label>Вага, кг</label><input name="weight_kg" type="number" min="0" step=".001" value="${N(x?.weight_kg)}"></div><div class="field"><label>Ціна, грн/кг</label><input name="price_per_kg" type="number" min="0" step=".01" value="${N(x?.price_per_kg)}"></div><div class="field"><label>Клієнт</label><input name="client" value="${E(x?.client||'')}"></div><div class="field"><label>Примітка</label><input name="notes" value="${E(x?.notes||'')}"></div><button class="primary">Зберегти</button></form>`);$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.event_type=type;p.heads=N(p.heads);p.weight_kg=N(p.weight_kg);p.price_per_kg=N(p.price_per_kg);p.total_amount=type==='sale'?p.weight_kg*p.price_per_kg:0;const available=heads(b)+(x?N(x.heads):0);if(['mortality','sale','home','cull'].includes(type)&&p.heads>available)return alert('Недостатньо поголів’я.');if(await save('livestock_events',p,id)){closeModal();openBatch(bid)}}}
function dailyForm(bid,id){const x=id?C.daily.find(d=>d.id===id):null;openModal(`<h3>Денний облік</h3><form id="form" class="grid g3"><div class="field"><label>Дата</label><input name="record_date" type="date" value="${x?.record_date||D()}" required></div><div class="field"><label>Корм, кг</label><input name="feed_kg" type="number" min="0" step=".001" value="${N(x?.feed_kg)}"></div><div class="field"><label>Вода, л</label><input name="water_l" type="number" min="0" step=".001" value="${N(x?.water_l)}"></div><div class="field"><label>Вода, грн</label><input name="water_cost" type="number" min="0" step=".01" value="${N(x?.water_cost)}"></div><div class="field"><label>Ліки, грн</label><input name="medicine_cost" type="number" min="0" step=".01" value="${N(x?.medicine_cost)}"></div><div class="field"><label>Підстилка, грн</label><input name="bedding_cost" type="number" min="0" step=".01" value="${N(x?.bedding_cost)}"></div><div class="field"><label>Електрика, грн</label><input name="electricity_cost" type="number" min="0" step=".01" value="${N(x?.electricity_cost)}"></div><div class="field"><label>Праця, грн</label><input name="labor_cost" type="number" min="0" step=".01" value="${N(x?.labor_cost)}"></div><div class="field"><label>Інше, грн</label><input name="other_cost" type="number" min="0" step=".01" value="${N(x?.other_cost)}"></div><div class="field" style="grid-column:1/-1"><label>Примітка</label><textarea name="notes">${E(x?.notes||'')}</textarea></div><button class="primary">Зберегти</button></form>`);$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;['feed_kg','water_l','water_cost','medicine_cost','bedding_cost','electricity_cost','labor_cost','other_cost'].forEach(k=>p[k]=N(p[k]));if(await save('daily_records',p,id)){closeModal();openBatch(bid)}}}
function eggForm(bid,id){const x=id?C.eggs.find(e=>e.id===id):null;openModal(`<h3>Збір яєць</h3><form id="form" class="grid g2"><div class="field"><label>Дата</label><input name="record_date" type="date" value="${x?.record_date||D()}" required></div><div class="field"><label>Добрі яйця</label><input name="good_eggs" type="number" min="0" value="${N(x?.good_eggs)}"></div><div class="field"><label>Биті</label><input name="broken_eggs" type="number" min="0" value="${N(x?.broken_eggs)}"></div><div class="field"><label>Примітка</label><input name="notes" value="${E(x?.notes||'')}"></div><button class="primary">Зберегти</button></form>`);$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.good_eggs=N(p.good_eggs);p.broken_eggs=N(p.broken_eggs);if(await save('egg_records',p,id)){closeModal();openBatch(bid)}}}
function eggSaleForm(bid,id){const x=id?C.eggSales.find(e=>e.id===id):null;openModal(`<h3>Продаж яєць</h3><form id="form" class="grid g2"><div class="field"><label>Дата</label><input name="sale_date" type="date" value="${x?.sale_date||D()}" required></div><div class="field"><label>Кількість</label><input name="quantity" type="number" min="1" value="${N(x?.quantity)||''}" required></div><div class="field"><label>Ціна за яйце, грн</label><input name="price_per_egg" type="number" min="0" step=".01" value="${N(x?.price_per_egg)||''}" required></div><div class="field"><label>Клієнт</label><input name="client" value="${E(x?.client||'')}"></div><button class="primary">Зберегти</button></form>`);$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.quantity=N(p.quantity);p.price_per_egg=N(p.price_per_egg);const avail=eggAvailable(bid)+(x?N(x.quantity):0);if(p.quantity>avail)return alert('Недостатньо яєць на складі.');if(await save('egg_sales',p,id)){closeModal();openBatch(bid)}}}
function warehouse(){const balance=i=>C.moves.filter(m=>m.item_id===i.id).reduce((s,m)=>{if(m.movement_type==='in')return s+N(m.quantity);if(m.movement_type==='adjustment')return s+(m.adjustment_direction==='in'?N(m.quantity):-N(m.quantity));return s-N(m.quantity)},0);$('content').innerHTML=`<div class="row"><button class="primary" onclick="itemForm()">＋ Позиція</button><button class="secondary" onclick="moveForm()">＋ Рух складу</button></div><div class="card section"><table class="table"><tr><th>Тип</th><th>Назва</th><th>Од.</th><th>Залишок</th><th>Ціна</th><th></th></tr>${C.items.map(i=>`<tr><td>${E(i.item_type)}</td><td>${E(i.name)}</td><td>${E(i.unit)}</td><td><b>${balance(i).toFixed(3)}</b></td><td>${M(i.price_per_unit)}</td><td><button class="secondary small" onclick="itemForm('${i.id}')">Ред.</button> <button class="danger small" onclick="del('warehouse_items','${i.id}')">×</button></td></tr>`).join('')}</table></div>`}
function itemForm(id){const x=id?C.items.find(i=>i.id===id):null;openModal(`<h3>Складова позиція</h3><form id="form" class="grid g2"><div class="field"><label>Тип</label><select name="item_type"><option value="feed">Корм</option><option value="medicine">Ліки</option><option value="bedding">Підстилка</option><option value="other">Інше</option></select></div><div class="field"><label>Назва</label><input name="name" required value="${E(x?.name||'')}"></div><div class="field"><label>Одиниця</label><input name="unit" value="${E(x?.unit||'кг')}"></div><div class="field"><label>Ціна за одиницю</label><input name="price_per_unit" type="number" min="0" step=".0001" value="${N(x?.price_per_unit)}"></div><div class="field"><label>Постачальник</label><input name="supplier" value="${E(x?.supplier||'')}"></div><div class="field"><label>Лот</label><input name="lot" value="${E(x?.lot||'')}"></div><button class="primary">Зберегти</button></form>`);$('form').item_type.value=x?.item_type||'feed';$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.price_per_unit=N(p.price_per_unit);if(await save('warehouse_items',p,id))closeModal()}}
function moveForm(id){const x=id?C.moves.find(m=>m.id===id):null;openModal(`<h3>Рух складу</h3><form id="form" class="grid g2"><div class="field"><label>Позиція</label><select name="item_id" required>${C.items.map(i=>`<option value="${i.id}">${E(i.name)}</option>`).join('')}</select></div><div class="field"><label>Тип руху</label><select name="movement_type"><option value="in">Надходження</option><option value="use">Використання</option><option value="sale">Продаж</option><option value="home">Додому</option><option value="adjustment">Коригування</option></select></div><div class="field"><label>Дата</label><input name="movement_date" type="date" value="${x?.movement_date||D()}"></div><div class="field"><label>Кількість</label><input name="quantity" type="number" min=".001" step=".001" required value="${N(x?.quantity)||''}"></div><div class="field"><label>Ціна за од.</label><input name="unit_price" type="number" min="0" step=".0001" value="${N(x?.unit_price)}"></div><div class="field"><label>Партія</label><select name="batch_id"><option value="">Без партії</option>${C.batches.map(b=>`<option value="${b.id}">${E(b.name)}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>Примітка</label><input name="notes" value="${E(x?.notes||'')}"></div><button class="primary">Зберегти</button></form>`);if(x){$('form').item_id.value=x.item_id;$('form').movement_type.value=x.movement_type;$('form').batch_id.value=x.batch_id||'';$('form').adjustment_direction.value=x.adjustment_direction||''}$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.quantity=N(p.quantity);p.unit_price=N(p.unit_price);p.total_amount=p.quantity*p.unit_price;if(p.movement_type==='adjustment')p.adjustment_direction=confirm('Збільшити залишок?')?'in':'out';const bal=C.moves.filter(m=>m.item_id===p.item_id&&m.id!==id).reduce((s,m)=>s+(m.movement_type==='in'||(m.movement_type==='adjustment'&&m.adjustment_direction==='in')?N(m.quantity):-N(m.quantity)),0);if(['use','sale','home'].includes(p.movement_type)&&p.quantity>bal)return alert('Недостатньо товару на складі.');if(await save('warehouse_movements',p,id))closeModal()}}
function medicines(){$('content').innerHTML=`<div class="row"><button class="primary" onclick="medForm()">＋ Ліки</button></div><div class="card section"><h3>Довідник препаратів</h3><table class="table"><tr><th>Назва</th><th>Концентрація</th><th>Форма</th><th>Упаковка</th><th>Ціна</th><th></th></tr>${C.meds.map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.concentration||'')}</td><td>${E(x.form||'')}</td><td>${N(x.package_ml)||N(x.package_g)}</td><td>${M(x.price)}</td><td><button class="secondary small" onclick="medForm('${x.id}')">Ред.</button> <button class="danger small" onclick="del('medicines','${x.id}')">×</button></td></tr>`).join('')}</table></div><div class="card"><h3>Лікування</h3><table class="table"><tr><th>Дата</th><th>Партія</th><th>Препарат</th><th>Фактично</th><th>Вартість</th><th></th></tr>${C.treat.map(x=>`<tr><td>${x.treatment_date}</td><td>${E(batch(x.batch_id)?.name||'')}</td><td>${E(x.medicine_name)}</td><td>${N(x.used_qty)} ${E(x.unit)}</td><td>${M(x.total_cost)}</td><td><button class="secondary small" onclick="treatForm('${x.batch_id}','${x.id}')">Ред.</button> <button class="danger small" onclick="del('treatments','${x.id}')">×</button></td></tr>`).join('')}</table></div>`}
function medForm(id){const x=id?C.meds.find(m=>m.id===id):null;openModal(`<h3>Препарат</h3><form id="form" class="grid g2"><div class="field"><label>Назва</label><input name="name" required value="${E(x?.name||'')}"></div><div class="field"><label>Концентрація</label><input name="concentration" value="${E(x?.concentration||'')}"></div><div class="field"><label>Форма</label><input name="form" value="${E(x?.form||'')}"></div><div class="field"><label>Мл/уп.</label><input name="package_ml" type="number" step=".001" value="${N(x?.package_ml)}"></div><div class="field"><label>Г/уп.</label><input name="package_g" type="number" step=".001" value="${N(x?.package_g)}"></div><div class="field"><label>Ціна упаковки</label><input name="price" type="number" step=".01" value="${N(x?.price)}"></div><button class="primary">Зберегти</button></form>`);$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));['package_ml','package_g','price'].forEach(k=>p[k]=N(p[k]));if(await save('medicines',p,id))closeModal()}}
function treatForm(bid,id){const x=id?C.treat.find(t=>t.id===id):null;openModal(`<h3>Лікування</h3><form id="form" class="grid g2"><div class="field"><label>Дата</label><input name="treatment_date" type="date" value="${x?.treatment_date||D()}"></div><div class="field"><label>Препарат</label><select name="medicine_id"><option value="">Вручну</option>${C.meds.map(m=>`<option value="${m.id}">${E(m.name)} ${E(m.concentration||'')}</option>`).join('')}</select></div><div class="field"><label>Назва препарату</label><input name="medicine_name" required value="${E(x?.medicine_name||'')}"></div><div class="field"><label>Дозування</label><input name="dosage" value="${E(x?.dosage||'')}"></div><div class="field"><label>Птахів</label><input name="birds" type="number" min="0" value="${N(x?.birds)}"></div><div class="field"><label>Фактично використано</label><input name="used_qty" type="number" min="0" step=".001" value="${N(x?.used_qty)}" required></div><div class="field"><label>Одиниця</label><select name="unit"><option value="мл">мл</option><option value="г">г</option><option value="л">л</option></select></div><div class="field"><label>Ціна за одиницю</label><input name="price_per_unit" type="number" min="0" step=".0001" value="${N(x?.price_per_unit)}"></div><button class="primary">Зберегти</button></form>`);if(x)$('form').medicine_id.value=x.medicine_id||'';$('form').unit.value=x?.unit||'мл';$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.batch_id=bid;p.birds=N(p.birds);p.used_qty=N(p.used_qty);p.price_per_unit=N(p.price_per_unit);if(await save('treatments',p,id))closeModal()}}
function recipes(){ $('content').innerHTML=`<div class="row"><button class="primary" onclick="recipeForm()">＋ Рецепт</button></div><div class="grid g2 section">${C.recipes.map(r=>{const l=C.lines.filter(x=>x.recipe_id===r.id),kg=l.reduce((s,x)=>s+N(x.kg),0),cost=l.reduce((s,x)=>s+N(x.kg)*N(x.price_per_kg),0);return `<div class="card"><div class="row"><h3>${E(r.name)}</h3><span class="right">${E(r.phase||'')}</span></div><table class="table"><tr><th>Інгредієнт</th><th>кг</th><th>%</th><th>грн</th></tr>${l.map(x=>`<tr><td>${E(x.ingredient_name)}</td><td>${N(x.kg).toFixed(3)}</td><td>${kg?(N(x.kg)/kg*100).toFixed(1):'0.0'}</td><td>${M(N(x.kg)*N(x.price_per_kg))}</td></tr>`).join('')}</table><b>${kg.toFixed(3)} кг · ${M(kg?cost/kg:0)}/кг</b><p><button class="secondary" onclick="recipeForm('${r.id}')">Ред.</button> <button class="danger" onclick="del('feed_recipes','${r.id}')">×</button></p></div>`}).join('')||'<div class="card">Рецептів немає.</div>'}</div>`}
function recipeForm(id){const r=id?C.recipes.find(x=>x.id===id):null,l=id?C.lines.filter(x=>x.recipe_id===id):[{}];openModal(`<h3>${r?'Редагувати':'Новий'} рецепт</h3><form id="form"><div class="grid g2"><div class="field"><label>Назва</label><input name="name" required value="${E(r?.name||'')}"></div><div class="field"><label>Фаза</label><input name="phase" value="${E(r?.phase||'')}"></div></div><div id="recipeLines" class="section">${l.map(line=>lineEditor(line)).join('')}</div><button type="button" class="secondary" onclick="addRecipeLine()">＋ Інгредієнт</button> <button class="primary">Зберегти рецепт</button></form>`);$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));let ok=await save('feed_recipes',p,id);if(!ok)return;const rr=id?C.recipes.find(x=>x.id===id):C.recipes.filter(x=>x.name===p.name).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];if(!rr)return;await db.from('feed_recipe_lines').delete().eq('recipe_id',rr.id).eq('user_id',user.id);const rows=[...$('recipeLines').children].map(el=>({recipe_id:rr.id,user_id:user.id,ingredient_name:el.querySelector('[name=ingredient_name]').value.trim(),kg:N(el.querySelector('[name=kg]').value),price_per_kg:N(el.querySelector('[name=price_per_kg]').value)})).filter(x=>x.ingredient_name&&x.kg>0);if(rows.length)await db.from('feed_recipe_lines').insert(rows);await load();closeModal()}}
function lineEditor(x){return `<div class="row recipe-line" style="margin:6px 0"><input name="ingredient_name" placeholder="Інгредієнт" value="${E(x?.ingredient_name||'')}" style="flex:2"><input name="kg" type="number" min=".001" step=".001" placeholder="кг" value="${N(x?.kg)||''}" style="width:120px"><input name="price_per_kg" type="number" min="0" step=".0001" placeholder="грн/кг" value="${N(x?.price_per_kg)||''}" style="width:140px"><button type="button" class="danger small" onclick="this.parentElement.remove()">×</button></div>`}function addRecipeLine(){$('recipeLines').insertAdjacentHTML('beforeend',lineEditor({}))}
function finance(){const rows=C.fin.map(x=>`<tr><td>${x.operation_date}</td><td>${x.operation_type==='income'?'Дохід':'Витрата'}</td><td>${E(x.category)}</td><td>${E(batch(x.batch_id)?.name||'')}</td><td>${M(x.amount)}</td><td><button class="secondary small" onclick="finForm('${x.id}')">Ред.</button> <button class="danger small" onclick="del('finance','${x.id}')">×</button></td></tr>`).join('');$('content').innerHTML=`<button class="primary" onclick="finForm()">＋ Операція</button><div class="card section"><table class="table"><tr><th>Дата</th><th>Тип</th><th>Категорія</th><th>Партія</th><th>Сума</th><th></th></tr>${rows||'<tr><td colspan="6">Немає операцій</td></tr>'}</table><p class="muted">Продажі птиці та яєць враховуються автоматично в доході партії, без дублювання фінансової операції.</p></div>`}
function finForm(id){const x=id?C.fin.find(f=>f.id===id):null;openModal(`<h3>Фінансова операція</h3><form id="form" class="grid g2"><div class="field"><label>Тип</label><select name="operation_type"><option value="income">Дохід</option><option value="expense">Витрата</option></select></div><div class="field"><label>Дата</label><input name="operation_date" type="date" value="${x?.operation_date||D()}"></div><div class="field"><label>Категорія</label><input name="category" required value="${E(x?.category||'other')}"></div><div class="field"><label>Сума</label><input name="amount" type="number" min="0" step=".01" value="${N(x?.amount)}"></div><div class="field"><label>Партія</label><select name="batch_id"><option value="">Без партії</option>${C.batches.map(b=>`<option value="${b.id}">${E(b.name)}</option>`).join('')}</select></div><div class="field"><label>Опис</label><input name="description" value="${E(x?.description||'')}"></div><button class="primary">Зберегти</button></form>`);$('form').operation_type.value=x?.operation_type||'expense';$('form').batch_id.value=x?.batch_id||'';$('form').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.amount=N(p.amount);if(await save('finance',p,id))closeModal()}}
function reports(){const rows=C.batches.filter(b=>b.status!=='archived').map(b=>{const w=latestWeight(b.id);return `<tr><td>${E(b.name)}</td><td>${b.kind}</td><td>${N(b.initial_heads)}</td><td>${heads(b)}</td><td>${age(b)}</td><td>${b.kind==='broiler'?(w?N(w.average_weight_g).toFixed(0)+' г':'—'):`${eggProduced(b.id)} / ${eggAvailable(b.id)} шт`}</td><td>${feedKg(b.id).toFixed(2)}</td><td>${b.kind==='broiler'?(fcr(b.id)?fcr(b.id).toFixed(3):'—'):'—'}</td><td>${M(totalCost(b.id))}</td><td>${M(income(b.id))}</td><td>${M(income(b.id)-totalCost(b.id))}</td></tr>`}).join('');$('content').innerHTML=`<div class="row noPrint"><button class="primary" onclick="window.print()">🖨️ Друк / PDF</button></div><div class="card"><h1>FERMA PRO • Агро-звіт</h1><p>Сформовано: ${D()}</p><table class="table"><tr><th>Партія</th><th>Тип</th><th>Було</th><th>Зараз</th><th>Вік</th><th>Вага/яйця</th><th>Корм кг</th><th>FCR</th><th>Собівартість</th><th>Дохід</th><th>Результат</th></tr>${rows||'<tr><td colspan="11">Немає даних</td></tr>'}</table><h2>Склад</h2><table class="table"><tr><th>Назва</th><th>Тип</th><th>Залишок</th><th>Ціна</th></tr>${C.items.map(i=>`<tr><td>${E(i.name)}</td><td>${E(i.item_type)}</td><td>${warehouseBalance(i).toFixed(3)} ${E(i.unit)}</td><td>${M(i.price_per_unit)}</td></tr>`).join('')}</table></div>`}
function warehouseBalance(i){return C.moves.filter(m=>m.item_id===i.id).reduce((s,m)=>s+(m.movement_type==='in'||(m.movement_type==='adjustment'&&m.adjustment_direction==='in')?N(m.quantity):-N(m.quantity)),0)}
function settings(){$('content').innerHTML=`<div class="card"><h3>Налаштування</h3><p>Користувач: ${E(user.email||'')}</p><p>Supabase: ${E(SB_URL.split('.')[0].replace('https://',''))}</p><p class="muted">Усі записи прив'язані до користувача через RLS. Партії, зважування, поголів'я, корм, склад, ліки, лікування, рецепти, фінанси та звіти працюють з редагуванням і видаленням.</p></div>`}
$('authForm').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authMsg').textContent=r.error?r.error.message:'Успішно'};$('signup').onclick=async()=>{const r=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authMsg').textContent=r.error?r.error.message:'Акаунт створено. Підтвердь email, якщо потрібно.'};
(async()=>{const s=await db.auth.getSession();user=s.data.session?.user||null;if(!user)return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await load()})();
</script></body></html>
