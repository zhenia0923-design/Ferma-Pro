<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FERMA PRO • Вхід</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;font:15px system-ui;color:#17202a}.box{width:min(420px,92%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 20px 70px #0006}h1{margin:0 0 6px}p{color:#6b7280}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:9px;font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}button{padding:11px 15px;border:0;border-radius:9px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#166534;color:white}.secondary{background:#e5e7eb}.msg{margin-top:12px;min-height:20px}.err{color:#b91c1c}.ok{color:#166534}</style></head><body><div class="box"><h1>🌾 FERMA PRO</h1><p>Вхід до обліку ферми</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><div class="row"><button class="primary" id="login" type="submit">Увійти</button><button class="secondary" id="signup" type="button">Реєстрація</button></div></form><div id="msg" class="msg"></div></div><script>const db=supabase.createClient('https://axxormlcevusdjfqruib.supabase.co','sb_publishable_fmFGe67Hi8_nUZC8sKP5xg_piWbDfZi');const $=id=>document.getElementById(id),msg=(text,err=false)=>{$('msg').textContent=text;$('msg').className='msg '+(err?'err':'ok')};async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('Введи email і пароль.',true);$('login').disabled=true;$('login').textContent='Вхід...';try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;location.replace('ferma_v4.html')}catch(e){msg(e?.message||'Помилка входу. Перевір email і пароль.',true)}finally{$('login').disabled=false;$('login').textContent='Увійти'}}$('form').addEventListener('submit',e=>{e.preventDefault();login()});$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('Введи email і пароль для реєстрації.',true);if(password.length<6)return msg('Пароль має містити щонайменше 6 символів.',true);$('signup').disabled=true;try{const r=await db.auth.signUp({email,password});if(r.error)throw r.error;if(r.data.session)location.replace('ferma_v4.html');else msg('Реєстрацію створено. Перевір email для підтвердження.')}catch(e){msg(e?.message||'Помилка реєстрації.',true)}finally{$('signup').disabled=false}};db.auth.getSession().then(({data})=>{if(data.session)location.replace('ferma_v4.html')}).catch(()=>{});</script></body></html>
