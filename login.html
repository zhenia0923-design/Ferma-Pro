<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FERMA PRO • Вхід</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;font:15px system-ui;color:#17202a}.box{width:min(420px,92%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 20px 70px #0006}h1{margin:0 0 6px}p{color:#6b7280}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:9px;font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}button{padding:11px 15px;border:0;border-radius:9px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#166534;color:white}.secondary{background:#e5e7eb}.msg{margin-top:12px;min-height:20px;line-height:1.45}.err{color:#b91c1c}.ok{color:#166534}.muted{font-size:12px;color:#6b7280;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h1>🌾 FERMA PRO</h1>
<p>Вхід до обліку ферми</p>
<form id="form">
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div>
<div class="row"><button class="primary" id="login" type="submit">Увійти</button><button class="secondary" id="signup" type="button">Реєстрація</button></div>
</form>
<div id="msg" class="msg">Підключення до сервера...</div>
<div class="muted">Якщо після натискання нічого не відбувається, тут буде показана точна причина.</div>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://axxormlcevusdjfqruib.supabase.co';
const SUPABASE_KEY='sb_publishable_fmFGe67Hi8_nUZC8sKP5xg_piWbDfZi';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const setMsg=(text,error=false)=>{$('msg').textContent=text;$('msg').className='msg '+(error?'err':'ok')};
const go=()=>window.location.href='./ferma_v4.html';

async function checkSession(){
 try{
  const {data,error}=await db.auth.getSession();
  if(error) throw error;
  if(data?.session) go(); else setMsg('Готово. Введи email і пароль.');
 }catch(e){setMsg('Помилка підключення: '+(e?.message||e),true)}
}

$('form').addEventListener('submit',async e=>{
 e.preventDefault();
 const email=$('email').value.trim();
 const password=$('password').value;
 if(!email||!password){setMsg('Введи email і пароль.',true);return}
 $('login').disabled=true;$('signup').disabled=true;$('login').textContent='Вхід...';setMsg('Перевіряю дані...');
 try{
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error) throw error;
  if(!data?.session) throw new Error('Сесію не створено. Перевір підтвердження email у Supabase.');
  setMsg('Вхід успішний. Відкриваю FERMA PRO...');
  setTimeout(go,100);
 }catch(e){
  let text=e?.message||String(e);
  if(/invalid login credentials/i.test(text)) text='Неправильний email або пароль.';
  if(/email not confirmed/i.test(text)) text='Email ще не підтверджено. Перевір пошту та підтвердь адресу.';
  setMsg(text,true);
 }finally{$('login').disabled=false;$('signup').disabled=false;$('login').textContent='Увійти'}
});

$('signup').addEventListener('click',async()=>{
 const email=$('email').value.trim();
 const password=$('password').value;
 if(!email||!password){setMsg('Введи email і пароль для реєстрації.',true);return}
 if(password.length<6){setMsg('Пароль має містити щонайменше 6 символів.',true);return}
 $('login').disabled=true;$('signup').disabled=true;$('signup').textContent='Реєстрація...';setMsg('Створюю обліковий запис...');
 try{
  const {data,error}=await db.auth.signUp({email,password});
  if(error) throw error;
  if(data?.session){setMsg('Реєстрація успішна. Відкриваю FERMA PRO...');setTimeout(go,100)}
  else setMsg('Акаунт створено. Підтвердь email у листі, потім увійди.');
 }catch(e){setMsg(e?.message||String(e),true)}
 finally{$('login').disabled=false;$('signup').disabled=false;$('signup').textContent='Реєстрація'}
});

checkSession();
</script>
</body>
</html>
