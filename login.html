<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FERMA PRO • Вхід</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;font:16px system-ui}.box{width:min(430px,92%);background:#fff;padding:28px;border-radius:18px}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.row{display:flex;gap:10px;margin-top:18px}.row button{flex:1;padding:13px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#166534;color:#fff}.secondary{background:#e5e7eb}.shop{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#fef3c7;color:#92400e;font-weight:800;text-decoration:none;text-align:center;box-sizing:border-box}.msg{margin-top:16px;min-height:24px}.err{color:#b91c1c}.ok{color:#166534}.muted{font-size:12px;color:#6b7280;margin-top:10px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="box"><h1>🌾 FERMA PRO</h1><p>Вхід до обліку ферми</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><div class="row"><button class="primary" id="login" type="submit">Увійти</button><button class="secondary" id="signup" type="button">Реєстрація</button></div></form><a class="shop" href="./shop.html">🛒 Відкрити магазин без входу</a><div id="msg" class="msg">Введи email і пароль.</div><div class="muted">FERMA PRO • авторизація через Supabase</div></div><script>(async function(){'use strict';const U='https://zfqekerozvjrpauqiqln.supabase.co',K='sb_publishable_HO1JIwKs8dkUNtKu7UuZUg_KGCjUsVpK',storageKey='sb-zfqekerozvjrpauqiqln-auth-token',$=x=>document.getElementById(x);const client=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey}});function msg(x,e=false){$('msg').textContent=x;$('msg').className='msg '+(e?'err':'ok')}function go(){location.replace('./app.html')}function readable(e){const m=String(e?.message||'Помилка входу');if(/invalid login credentials/i.test(m))return'Неправильний email або пароль.';if(/email not confirmed/i.test(m))return'Email ще не підтверджено. Підтвердь лист від Supabase, потім увійди ще раз.';if(/too many requests/i.test(m))return'Забагато спроб. Зачекай кілька хвилин і повтори.';return m}try{const r=await client.auth.getSession();if(r.data?.session){go();return}}catch(e){console.warn('session check',e)}$('form').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;$('login').disabled=$('signup').disabled=true;msg('Виконується вхід…');try{const r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data?.session)throw new Error('Supabase не повернув сесію. Перевір підтвердження email та налаштування Auth.');msg('Вхід успішний');setTimeout(go,150)}catch(e){console.error(e);msg(readable(e),true)}finally{$('login').disabled=$('signup').disabled=false}};$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email)return msg('Введи email.',true);if(password.length<6)return msg('Пароль має містити щонайменше 6 символів.',true);$('login').disabled=$('signup').disabled=true;msg('Створюємо акаунт…');try{const r=await client.auth.signUp({email,password});if(r.error)throw r.error;if(r.data?.session){msg('Реєстрація успішна');setTimeout(go,150)}else msg('Акаунт створено. Підтвердь email у листі та після цього увійди.')}catch(e){console.error(e);msg(readable(e),true)}finally{$('login').disabled=$('signup').disabled=false}}})()</script></body></html>
