q(path,body){const r=await fetch(U+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||d.error_description||'Помилка входу');return d}function go(){location.replace('./app.html')}$('form').onsubmit=async e=>{e.preventDefault();$('login').disabled=$('signup').disabled=true;try{const d=await req('token?grant_type=password',{email:$('email').value.trim(),password:$('password').value});if(!save(d))throw Error('Сесія не отримана');msg('Успішно');setTimeout(go,200)}catch(e){msg(/invalid login credentials/i.test(e.message)?'Неправильний email або пароль.':e.message,true)}finally{$('login').disabled=$('signup').disabled=false}};$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(password.length<6)return msg('Пароль має містити щонайменше 6 символів.',true);$('login').disabled=$('signup').disabled=true;try{const d=await req('signup',{email,password});if(d.access_token&&save(d)){msg('Реєстрація успішна');setTimeout(go,200)}else msg('Акаунт створено. Підтвердь email і увійди.')}catch(e){msg(e.message,true)}finally{$('login').disabled=$('signup').disabled=false}};try{const s=JSON.parse(localStorage.getItem(S)||'null');if(s?.access_token&&Number(s.expires_at||0)>Math.floor(Date.now()/1000)+10)go()}catch(e){localStorage.removeItem(S)}})();</script></body></html>
