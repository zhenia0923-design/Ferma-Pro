</head><body><div class="box"><h1>🌾 FERMA PRO</h1><p>Вхід до обліку ферми</p><form id="form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><div class="row"><button class="primary" id="login" type="submit">Увійти</button><button class="secondary" id="signup" type="button">Реєстрація</button></div></form><div id="msg" class="msg">Готово. Введи email і пароль.</div><div class="muted">FERMA PRO використовує нову Supabase хмару.</div></div>
<script>(function(){'use strict';const URL='https://zfqekerozvjrpauqiqln.supabase.co',KEY='sb_publishable_HO1JIwKs8dkUNtKu7UuZUg_KGCjUsVp',STORAGE='sb-zfqekerozvjrpauqiqln-auth-token',$=id=>document.getElementById(id);function msg(t,e){$('msg').textContent=t;$('msg').className='msg '+(e?'err':'ok')}function save(d){const s=d.session||d;if(!s?.access_token)return false;const now=Math.floor(Date.now()/1000),x={access_token:s.access_token,refresh_token:s.refresh_token,expires_in:Number(s.expires_in||3600),expires_at:s.expires_at||now+Number(s.expires_in||3600),token_type:s.token_type||'bearer',user:s.user||null};localStorage.setItem(STORAGE,JSON.stringify(x));return true}async function request(path,body){const r=await fetch(URL+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||('HTTP '+r.status));return d}function go(){location.replace('./ferma_v4.html')}$('form').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('Введи email і пароль.',true);$('login').disabled=$('signup').disabled=true;$('login').textContent='Вхід...';try{const d=await request('token?grant_type=password',{email,password});if(!save(d))throw Error('Supabase не повернув сесію.');msg('Вхід успішний.');setTimeout(go,250)}catch(e){let t=e.message;if(/invalid login credentials/i.test(t))t='Неправильний email або пароль.';if(/email not confirmed/i.test(t))t='Email ще не підтверджено.';msg(t,true)}finally{$('login').disabled=$('signup').disabled=false;$('login').textContent='Увійти'}};$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('Введи email і пароль для реєстрації.',true);if(password.length<6)return msg('Пароль має містити щонайменше 6 символів.',true);$('login').disabled=$('signup').disabled=true;$('signup').textContent='Реєстрація...';try{const d=await request('signup',{email,password});if(d.access_token&&save(d)){msg('Реєстрація успішна.');setTimeout(go,250)}else msg('Акаунт створено. Підтвердь email у листі, потім увійди.')}catch(e){msg(e.message,true)}finally{$('login').disabled=$('signup').disabled=false;$('signup').textContent='Реєстрація'}};try{const s=JSON.parse(localStorage.getItem(STORAGE)||'null');if(s?.access_token&&Number(s.expires_at||0)>Math.floor(Date.now()/1000)+10)go()}catch(_){localStorage.removeItem(STORAGE)}})();</script></body></html>
