<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ferma-Pro | Магазин</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f5f7f5;color:#17202a}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb}.topin{max-width:1180px;margin:auto;padding:12px 18px;display:flex;gap:12px;align-items:center}.brand{font-weight:900;font-size:20px}.grow{flex:1}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:#166534;color:white}.secondary{background:#e5e7eb;color:#17202a}.danger{background:#fee2e2;color:#991b1b}.login{min-height:100vh;display:grid;place-items:center;background:#111827;padding:20px}.box{width:min(440px,100%);background:white;border-radius:18px;padding:26px;box-shadow:0 18px 60px #0002}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:10px;background:#fff}.grid{display:grid;gap:14px}.products{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:15px}.photo{width:100%;aspect-ratio:4/3;border-radius:11px;object-fit:cover;background:#e5e7eb}.placeholder{aspect-ratio:4/3;border-radius:11px;background:#eef2ee;display:grid;place-items:center;font-size:45px}.price{font-size:21px;font-weight:900}.muted{color:#6b7280}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.qty{width:90px!important}.section{margin:20px 0}.order{border-left:4px solid #166534}.empty{text-align:center;padding:45px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button.active{background:#166534;color:white}@media(max-width:800px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.products{grid-template-columns:1fr}.wrap{padding:12px}.topin{padding:10px 12px}}
</style></head>
<body>
<div id="auth" class="login"><div class="box"><h1>🌾 Ferma-Pro</h1><p class="muted">Магазин ферми</p><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Пароль</label><input id="password" type="password" minlength="6" autocomplete="current-password" required></div><div class="row"><button class="btn primary">Увійти</button><button class="btn secondary" type="button" id="signup">Реєстрація</button></div><p id="authMsg" class="muted"></p></form></div></div>
<div id="shop" class="hidden">
<header class="top"><div class="topin"><div class="brand">🌾 Ferma-Pro</div><div class="grow"></div><button class="btn secondary" id="cartBtn">🛒 Кошик <span id="cartCount">0</span></button><button class="btn secondary" id="logout">Вийти</button></div></header>
<main class="wrap"><div class="row"><div><h1 style="margin-bottom:3px">Продукція ферми</h1><div class="muted">Обирайте товари та оформлюйте замовлення</div></div><div class="grow"></div><span id="hello" class="pill"></span></div>
<div class="tabs"><button class="btn secondary active" data-tab="catalog">Каталог</button><button class="btn secondary" data-tab="orders">Мої замовлення</button></div>
<section id="catalogTab"><div id="products" class="grid products"></div></section>
<section id="ordersTab" class="hidden"><div id="orders"></div></section>
</main></div>
<div id="modal" class="hidden" style="position:fixed;inset:0;background:#0008;z-index:30;display:grid;place-items:center;padding:12px"><div id="modalBody" class="box" style="max-height:94vh;overflow:auto"></div></div>
<script>
'use strict';
const SB_URL='https://zfqekerozvjrpauqiqln.supabase.co',SB_KEY='sb_publishable_HO1JIwKs8dkUNtKu7UuZUg_KGCjUsVp',db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-zfqekerozvjrpauqiqln-client-auth-token'}});
let user=null,products=[],cart=[];
const $=id=>document.getElementById(id),N=v=>{const n=Number(v);return Number.isFinite(n)?n:0},E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(v){return N(v).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' грн'}
function openModal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
async function loadProducts(){const r=await db.from('shop_products').select('id,name,description,category,price,unit,stock_qty,image_url').eq('is_active',true).order('sort_order').order('name');if(r.error){console.error(r.error);return}products=r.data||[];renderProducts()}
function renderProducts(){$('products').innerHTML=products.map(p=>`<article class="card"><div>${p.image_url?`<img class="photo" src="${E(p.image_url)}" alt="${E(p.name)}">`:'<div class="placeholder">🌾</div>'}</div><div class="muted" style="margin-top:10px">${E(p.category||'')}</div><h3 style="margin:5px 0">${E(p.name)}</h3><p class="muted">${E(p.description||'')}</p><div class="row"><span class="price">${money(p.price)}</span><span class="muted">/ ${E(p.unit)}</span><span class="right pill">Є в наявності: ${N(p.stock_qty)} ${E(p.unit)}</span></div><div class="row" style="margin-top:12px"><input id="q-${p.id}" class="field qty" type="number" min="0.001" step="0.001" max="${N(p.stock_qty)}" value="1"><button class="btn primary right" onclick="addToCart('${p.id}')">Додати</button></div></article>`).join('')||'<div class="card empty" style="grid-column:1/-1">Товарів поки немає. Каталог ще наповнюється.</div>'}
function addToCart(id){const p=products.find(x=>x.id===id);if(!p)return;const q=N($('q-'+id).value);if(q<=0||q>N(p.stock_qty))return alert('Перевірте кількість.');const old=cart.find(x=>x.product_id===id);if(old)old.quantity=Math.min(N(p.stock_qty),old.quantity+q);else cart.push({product_id:id,product_name:p.name,unit:p.unit,quantity:q,unit_price:N(p.price),line_total:q*N(p.price)});cart.forEach(x=>x.line_total=x.quantity*x.unit_price);updateCart();}
function updateCart(){$('cartCount').textContent=cart.reduce((s,x)=>s+N(x.quantity),0).toLocaleString('uk-UA');}
function showCart(){if(!cart.length)return openModal('<h2>Кошик порожній</h2><p class="muted">Додайте товар з каталогу.</p><button class="btn secondary" onclick="closeModal()">Закрити</button>');const total=cart.reduce((s,x)=>s+x.line_total,0);openModal(`<h2>🛒 Кошик</h2>${cart.map((x,i)=>`<div class="card" style="margin:8px 0"><div class="row"><b>${E(x.product_name)}</b><span class="right">${money(x.line_total)}</span></div><div class="row muted">${x.quantity} ${E(x.unit)} × ${money(x.unit_price)}<button class="btn danger right" onclick="cart.splice(${i},1);updateCart();showCart()">Видалити</button></div></div>`).join('')}<h3>Разом: ${money(total)}</h3><button class="btn primary" onclick="checkout()">Оформити замовлення</button> <button class="btn secondary" onclick="closeModal()">Продовжити покупки</button>`)}
async function checkout(){if(!cart.length)return;const r=await db.from('profiles').select('full_name,phone').eq('id',user.id).maybeSingle();const p=r.data||{};const total=cart.reduce((s,x)=>s+x.line_total,0);openModal(`<h2>Оформлення замовлення</h2><div class="field"><label>Ім'я</label><input id="cname" value="${E(p.full_name||'')}"></div><div class="field"><label>Телефон</label><input id="cphone" value="${E(p.phone||'')}"></div><div class="field"><label>Адреса / відділення</label><textarea id="caddr"></textarea></div><div class="field"><label>Коментар</label><textarea id="ccomment"></textarea></div><h3>До сплати: ${money(total)}</h3><button class="btn primary" onclick="placeOrder()">Підтвердити замовлення</button> <button class="btn secondary" onclick="showCart()">Назад</button>`)}
async function placeOrder(){const name=$('cname').value.trim(),phone=$('cphone').value.trim(),address=$('caddr').value.trim(),comment=$('ccomment').value.trim();if(!name||!phone)return alert('Вкажіть ім’я та телефон.');const total=cart.reduce((s,x)=>s+x.line_total,0);const o=await db.from('shop_orders').insert({client_id:user.id,status:'new',total_amount:total,customer_name:name,phone,delivery_address:address,comment}).select('id').single();if(o.error)return alert(o.error.message);const rows=cart.map(x=>({order_id:o.data.id,product_id:x.product_id,product_name:x.product_name,unit:x.unit,quantity:x.quantity,unit_price:x.unit_price,line_total:x.line_total}));const i=await db.from('shop_order_items').insert(rows);if(i.error){await db.from('shop_orders').delete().eq('id',o.data.id);return alert(i.error.message)};cart=[];updateCart();closeModal();openOrders();alert('Замовлення прийнято!');}
async function openOrders(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='orders'));$('catalogTab').classList.add('hidden');$('ordersTab').classList.remove('hidden');const r=await db.from('shop_orders').select('id,status,total_amount,customer_name,phone,delivery_address,comment,created_at').eq('client_id',user.id).order('created_at',{ascending:false});if(r.error){$('orders').innerHTML='<div class="card">Не вдалося завантажити замовлення.</div>';return}const orders=r.data||[];if(!orders.length)return $('orders').innerHTML='<div class="card empty">Замовлень ще немає.</div>';let html='';for(const o of orders){const it=await db.from('shop_order_items').select('product_name,unit,quantity,unit_price,line_total').eq('order_id',o.id);html+=`<article class="card order section"><div class="row"><b>Замовлення #${E(o.id.slice(0,8))}</b><span class="pill">${statusName(o.status)}</span><span class="right">${money(o.total_amount)}</span></div><div class="muted">${new Date(o.created_at).toLocaleString('uk-UA')}</div>${(it.data||[]).map(x=>`<div class="row" style="margin-top:8px"><span>${E(x.product_name)}</span><span>${x.quantity} ${E(x.unit)} × ${money(x.unit_price)}</span><span class="right"><b>${money(x.line_total)}</b></span></div>`).join('')}<div class="muted" style="margin-top:10px">${E(o.delivery_address||'')}</div>${o.comment?`<div class="muted">${E(o.comment)}</div>`:''}</article>`}$('orders').innerHTML=html}
function statusName(s){return ({new:'Нове',confirmed:'Підтверджено',processing:'В обробці',ready:'Готово до видачі',completed:'Виконано',cancelled:'Скасовано'})[s]||s}
function openCatalog(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='catalog'));$('catalogTab').classList.remove('hidden');$('ordersTab').classList.add('hidden')}
$('cartBtn').onclick=showCart;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='orders'?openOrders():openCatalog());
$('authForm').onsubmit=async e=>{e.preventDefault();$('authMsg').textContent='Вхід...';const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)$('authMsg').textContent=r.error.message};
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return $('authMsg').textContent='Вкажіть email та пароль від 6 символів.';const r=await db.auth.signUp({email,password});$('authMsg').textContent=r.error?r.error.message:'Реєстрація виконана. Якщо ввімкнено підтвердження email, підтвердьте пошту.'};
async function start(){const s=await db.auth.getSession();user=s.data.session?.user||null;if(!user){$('auth').classList.remove('hidden');$('shop').classList.add('hidden');return}$('auth').classList.add('hidden');$('shop').classList.remove('hidden');$('hello').textContent=user.email;await loadProducts();}
start();
</script></body></html>
