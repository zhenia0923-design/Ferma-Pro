<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FERMA PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#f3f4f6;color:#111827}.login{min-height:100vh;display:grid;place-items:center;background:#111827}.loginbox{background:#fff;width:min(420px,94%);padding:25px;border-radius:16px}.loginbox input{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}.primary,.secondary{width:100%;padding:11px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.primary{background:#166534;color:#fff}.secondary{background:#e5e7eb;margin-top:8px}.hidden{display:none!important}.err{color:#b91c1c;font-weight:700;white-space:pre-wrap}.ok{color:#166534;font-weight:700}</style></head><body><div id="login" class="login"><div class="loginbox"><h1>FERMA PRO</h1><p>Надійний облік ферми</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Пароль</label><input id="pass" type="password" autocomplete="current-password"><button id="loginBtn" class="primary" type="button">Увійти</button><button id="signupBtn" class="secondary" type="button">Реєстрація</button><p id="msg"></p></div></div><div id="app" class="hidden"><div style="padding:30px"><h1>FERMA PRO</h1><p>Вхід виконано.</p><button class="primary" onclick="logout()">Вийти</button></div></div><script>(function(){'use strict';const URL='https://axxormlcevusdjfqruib.supabase.co';const KEY='sb_publishable_fmFGe67Hi8_nUZC8sKP5xg_piWbDfZi';const msg=document.getElementById('msg'),btn=document.getElementById('loginBtn'),signup=document.getElementById('signupBtn');let db=null;function show(text,ok){msg.textContent=text;msg.className=ok?'ok':'err'}function init(){if(!window.supabase){show('Не завантажився модуль Supabase. Оновіть сторінку Ctrl+F5.',false);return false}db=window.supabase.createClient(URL,KEY);return true}async function signIn(){if(!init())return;const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||!password){show('Введіть email і пароль.',false);return}btn.disabled=true;btn.textContent='Вхід...';show('Перевіряю дані...',true);try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data||!r.data.session){throw new Error('Supabase не повернув сесію. Перевірте підтвердження email та налаштування Auth.')}show('Вхід виконано.',true);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}catch(e){console.error(e);show('Помилка входу: '+(e?.message||String(e)),false)}finally{btn.disabled=false;btn.textContent='Увійти'}}async function signUp(){if(!init())return;const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||!password){show('Введіть email і пароль.',false);return}if(password.length<6){show('Пароль має містити щонайменше 6 символів.',false);return}signup.disabled=true;signup.textContent='Реєстрація...';try{const r=await db.auth.signUp({email,password});if(r.error)throw r.error;show(r.data?.session?'Реєстрацію виконано, вхід виконано.':'Реєстрацію створено. Перевірте email для підтвердження.',true);if(r.data?.session){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}}catch(e){console.error(e);show('Помилка реєстрації: '+(e?.message||String(e)),false)}finally{signup.disabled=false;signup.textContent='Реєстрація'}}async function logout(){if(db)await db.auth.signOut();location.reload()}window.logout=logout;btn.addEventListener('click',signIn);signup.addEventListener('click',signUp);document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});window.addEventListener('load',async()=>{if(!init())return;try{const r=await db.auth.getSession();if(r.data?.session){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}}catch(e){show('Помилка перевірки сесії: '+e.message,false)}})})();</script></body></html>
