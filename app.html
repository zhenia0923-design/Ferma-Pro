<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>FERMA PRO</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="ferma" title="FERMA PRO" src="legacy.html?v=stable-dashboard-fix"></iframe>
<script>
(function(){
  const frame=document.getElementById('ferma');
  frame.addEventListener('load',function(){
    const w=frame.contentWindow;
    if(!w||w.__FERMA_PRO_PATCHED__)return;
    w.__FERMA_PRO_PATCHED__=true;

    /* feed_recipes in the current DB does not expose the old name sort safely. */
    if(typeof w.loadRecipes==='function'){
      w.loadRecipes=async function(){
        if(!w.currentUser)return;
        const {data,error}=await w.supabaseClient
          .from('feed_recipes')
          .select('*')
          .eq('user_id',w.currentUser.id);
        if(error)throw error;
        w.recipes=Array.isArray(data)?data:[];
      };
    }

    /* The detail template contains an old global batchId reference. */
    if(typeof w.selectBroiler==='function'){
      const originalSelectBroiler=w.selectBroiler;
      w.selectBroiler=async function(id){
        const oldBatchId=w.batchId;
        w.batchId=id;
        try{
          return await originalSelectBroiler.call(this,id);
        }finally{
          if(oldBatchId===undefined)delete w.batchId;
          else w.batchId=oldBatchId;
        }
      };
    }

    /* Dashboard buttons must point to the Broilers navigation item. */
    if(typeof w.renderDashboard==='function'){
      const originalDashboard=w.renderDashboard;
      w.renderDashboard=async function(){
        try{
          return await originalDashboard.apply(this,arguments);
        }catch(e){
          console.error('FERMA PRO dashboard:',e);
          const el=w.document.getElementById('dashboardBroilers');
          if(el)el.innerHTML='<div class="empty">Не вдалося завантажити партії. Натисніть «Оновити».</div>';
          throw e;
        }
      };
    }

    /* The original app may have failed its first load before the patches existed. */
    setTimeout(async function(){
      try{
        if(typeof w.loadAll==='function'&&w.currentUser){
          await w.loadAll();
        }
      }catch(e){
        console.error('FERMA PRO initial refresh:',e);
      }
    },100);
  });
})();
</script>
</body>
</html>
